<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f8ff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Regnespil">
  <title>Regnespil</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #f4f8ff; }
    #version { display: none; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- Rammen holder siden i fuld skærm, når man skifter mellem spillene. Selve forsiden ligger i menu.html. -->
  <p id="version">Version 1.22.0</p>
  <iframe id="app" title="Regnespil" allow="fullscreen; screen-wake-lock" hidden></iframe>
  <noscript><p><a href="menu.html">Åbn Regnespil</a></p></noscript>

  <script>
    // Ældre versioner læser versionsnummeret ovenfor, når man trykker Opgrader. Hold det ens med menu.html og sw.js.
    // Kun hvor browseren har fuld skærm (Android, computer), bruges rammen. iPhone og iPad-apper åbner menu.html direkte.
    (function () {
      const root = document.documentElement;
      const canFullscreen = Boolean(root.requestFullscreen || root.webkitRequestFullscreen);
      const direct = window.top !== window || !canFullscreen || navigator.standalone === true
        || new URLSearchParams(location.search).has("direkte");
      // Frisk start af en installeret app: altid forsiden, også hvis genvejen blev lavet fra en børneside
      let freshApp = false;
      try {
        freshApp = !sessionStorage.getItem("regnespil-startet")
          && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches);
      } catch { /* ingen lagring */ }
      const target = "menu.html" + (freshApp ? "" : location.search);
      if (direct) { location.replace(target); return; }

      // "Hent som app" kan kun fanges i det øverste dokument. Forsiden i rammen henter den herfra.
      window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.__bip = e; });
      window.addEventListener("appinstalled", () => { window.__bip = null; });

      const frame = document.getElementById("app");
      frame.src = target;
      frame.hidden = false;
    })();
  </script>
</body>
</html>
