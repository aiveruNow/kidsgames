<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f6b3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Aris mål">
  <title>Aris mål</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="ballGrad" cx=".35" cy=".3" r=".8">
        <stop offset="0" stop-color="#fff"/>
        <stop offset=".7" stop-color="#f1f3f6"/>
        <stop offset="1" stop-color="#c6cfdc"/>
      </radialGradient>
      <clipPath id="ballClip"><circle cx="50" cy="50" r="48"/></clipPath>
    </defs>
  </svg>

  <div class="stage" id="stage">
    <div class="bg">
      <div class="stands" id="stands"></div>
      <div class="light l"></div><div class="light r"></div>
      <div class="grass"></div>
      <div class="box"></div><div class="arc"></div>
    </div>

    <div class="screen" id="screen" role="button" tabindex="0" aria-label="Billedet">
      <div class="pic" id="pic">⚽</div>
      <div class="slots" id="slots" aria-live="polite"></div>
    </div>

    <div class="goal" id="goal">
      <div class="goal-inner" id="goalInner">
        <div class="keeper" id="keeper">
          <div class="keeper-in" id="keeperIn">
            <svg class="keeper-svg" viewBox="0 0 200 250" aria-hidden="true" focusable="false">
              <ellipse cx="100" cy="246" rx="48" ry="5" fill="#000" opacity=".25"/>
              <rect x="78" y="204" width="19" height="34" rx="8" fill="#fff" stroke="#2b3f9e" stroke-width="3"/>
              <rect x="103" y="204" width="19" height="34" rx="8" fill="#fff" stroke="#2b3f9e" stroke-width="3"/>
              <path d="M78 218h19M103 218h19" stroke="#2b3f9e" stroke-width="4"/>
              <ellipse cx="86" cy="240" rx="15" ry="8" fill="#27344d"/>
              <ellipse cx="114" cy="240" rx="15" ry="8" fill="#27344d"/>
              <rect x="70" y="190" width="60" height="30" rx="12" fill="#2b3f9e" stroke="#1b2a73" stroke-width="3"/>
              <g class="arm l">
                <rect x="55" y="146" width="19" height="50" rx="9.5" fill="#7a5af0" stroke="#4a2fb5" stroke-width="3"/>
                <circle cx="64.5" cy="200" r="14" fill="#ff7a1a" stroke="#b34a00" stroke-width="3"/>
                <path d="M57 198h15" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
              </g>
              <g class="arm r">
                <rect x="126" y="146" width="19" height="50" rx="9.5" fill="#7a5af0" stroke="#4a2fb5" stroke-width="3"/>
                <circle cx="135.5" cy="200" r="14" fill="#ff7a1a" stroke="#b34a00" stroke-width="3"/>
                <path d="M128 198h15" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
              </g>
              <rect x="62" y="132" width="76" height="72" rx="22" fill="#7a5af0" stroke="#4a2fb5" stroke-width="3"/>
              <text x="100" y="186" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="40" font-weight="900" fill="#fff">1</text>
              <g transform="translate(100 80) scale(.72) translate(-100 -108)">
                <g class="mane"></g>
                <circle cx="58" cy="66" r="16" fill="#e9a43c" stroke="#a8641a" stroke-width="3"/>
                <circle cx="142" cy="66" r="16" fill="#e9a43c" stroke="#a8641a" stroke-width="3"/>
                <circle cx="58" cy="67" r="8" fill="#f2a08c"/>
                <circle cx="142" cy="67" r="8" fill="#f2a08c"/>
                <circle cx="100" cy="108" r="47" fill="#f6c453" stroke="#a8641a" stroke-width="3"/>
                <ellipse cx="100" cy="128" rx="26" ry="19" fill="#fff1c9"/>
                <circle cx="76" cy="122" r="6" fill="#ff9fb8" opacity=".6"/>
                <circle cx="124" cy="122" r="6" fill="#ff9fb8" opacity=".6"/>
                <g class="look" id="look">
                  <g class="blink"><circle cx="81" cy="100" r="8" fill="#27344d"/><circle cx="119" cy="100" r="8" fill="#27344d"/></g>
                  <circle cx="84" cy="97" r="2.8" fill="#fff"/>
                  <circle cx="122" cy="97" r="2.8" fill="#fff"/>
                </g>
                <path d="M92 116h16l-8 9z" fill="#7a3b1c" stroke="#7a3b1c" stroke-width="3" stroke-linejoin="round"/>
                <path class="mouth-closed" d="M100 125v6M100 131q-9 8-18 0M100 131q9 8 18 0" fill="none" stroke="#7a3b1c" stroke-width="3" stroke-linecap="round"/>
                <g class="mouth-open">
                  <path d="M82 129q18-6 36 0q-2 24-18 24t-18-24z" fill="#7a2b2b" stroke="#7a3b1c" stroke-width="3" stroke-linejoin="round"/>
                  <path d="M88 130l4 8 4-8M104 130l4 8 4-8" fill="#fff"/>
                  <ellipse cx="100" cy="147" rx="9" ry="5" fill="#f2808c"/>
                </g>
              </g>
            </svg>
          </div>
        </div>
      </div>
      <div class="net" id="net"></div>
      <div class="frame"></div>
    </div>

    <div class="bubble" id="bubble" aria-live="polite">Klar til kamp!</div>
    <div class="balls" id="balls"></div>
    <div class="dots" id="dots" aria-label="Fremskridt"></div>
    <button class="btn next" id="nextBtn" type="button" hidden>⚽ Nyt billede</button>
    <canvas id="aim" aria-hidden="true"></canvas>
    <div class="fx" id="fx"></div>
    <div class="banner" id="banner" aria-hidden="true"></div>

    <div class="modes" id="modes" role="group" aria-label="Vælg sværhedsgrad">
      <button class="mode" type="button" data-mode="ord" aria-pressed="false">🔤 Ord</button>
      <button class="mode" type="button" data-mode="hard" aria-pressed="false">🧠 Svær</button>
    </div>

    <div class="overlay" id="start">
      <div class="start-ball">⚽</div>
      <h2>Aris mål</h2>
      <p>Træk bolden tilbage, sigt og skyd den rigtige bold i mål!</p>
      <button class="btn" id="startBtn" type="button">Spil ▶</button>
    </div>

    <div class="overlay trophy" id="trophy" role="alert" hidden>
      <div class="rays"></div>
      <svg class="bigstar" viewBox="0 0 100 96" aria-hidden="true">
        <defs>
          <linearGradient id="starFill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#ffe66d"/>
            <stop offset="1" stop-color="#ffb300"/>
          </linearGradient>
        </defs>
        <path d="M50 4 62 35l33 3-25 22 8 33L50 76 22 93l8-33L5 38l33-3z" fill="url(#starFill)" stroke="#e08a00" stroke-width="4" stroke-linejoin="round"/>
        <path d="M50 16 59 38M30 40 40 41" stroke="#fff8c9" stroke-width="4" stroke-linecap="round" opacity=".8"/>
      </svg>
      <h2 id="trophyTitle">Du fik en stjerne!</h2>
      <p>5 ord i træk uden fejl ⚽⚽⚽⚽⚽</p>
      <button class="btn" id="trophyBtn" type="button">Videre ▶</button>
    </div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="../../shared/topbar.js"></script>
  <script src="game.js"></script>
</body>
</html>
