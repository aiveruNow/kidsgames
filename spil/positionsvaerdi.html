<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8ff">
  <title>Talbasket — positionsværdi</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #17233c;
      background: #f4f8ff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px 42px;
      background:
        radial-gradient(ellipse at 10% 0%, #fff 0, transparent 38%),
        #f4f8ff;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 980px);
      margin: 0 auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 14px;
      padding: 9px 13px;
      border: 1px solid #dfe7f3;
      border-radius: 13px;
      background: #ffffffcc;
      color: #27426f;
      font-size: .9rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 3px 10px #243a5a14;
    }

    .back:hover, .back:focus-visible { border-color: #9ab8e9; background: #fff; outline: none; }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 15px;
      background: #e7f2ff;
      font-size: 27px;
    }

    h1 {
      margin: 0;
      color: #183976;
      font-size: clamp(1.45rem, 4vw, 2rem);
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 3px 0 0;
      color: #62718a;
      font-size: .92rem;
    }

    .score {
      padding: 10px 15px;
      border: 1px solid #dfe7f3;
      border-radius: 14px;
      background: #fff;
      color: #27426f;
      font-size: .95rem;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 3px 10px #243a5a0a;
    }

    .game-card {
      overflow: hidden;
      border: 1px solid #e1e9f4;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 16px 42px #233c6012;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid #edf1f7;
      background: #fbfdff;
    }

    .levels {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .level {
      min-height: 40px;
      padding: 8px 13px;
      border: 1px solid #dce5f1;
      border-radius: 11px;
      background: #fff;
      color: #52617a;
      cursor: pointer;
      font-weight: 750;
      transition: background .15s, color .15s, transform .15s, border-color .15s;
    }

    .level:hover { transform: translateY(-1px); border-color: #9ab8e9; }

    .level[aria-pressed="true"] {
      border-color: #2764c5;
      background: #2764c5;
      color: #fff;
      box-shadow: 0 4px 10px #2764c533;
    }

    .round-label {
      color: #728099;
      font-size: .88rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .game-body { padding: clamp(18px, 4vw, 30px); }

    .prompt {
      margin: 0 0 5px;
      text-align: center;
      color: #263a5b;
      font-size: clamp(1.1rem, 3vw, 1.38rem);
      font-weight: 800;
    }

    .hint {
      margin: 0 0 18px;
      text-align: center;
      color: #78869d;
      font-size: .94rem;
    }

    .blocks-panel {
      overflow: hidden;
      padding: 10px;
      border: 1px solid #dcebf6;
      border-radius: 18px;
      background: linear-gradient(145deg, #f0faff, #e9f4ff);
    }

    #blocks {
      display: block;
      width: 100%;
      height: auto;
      min-height: 170px;
    }

    .answers-title {
      margin: 22px 0 12px;
      text-align: center;
      color: #708099;
      font-size: .88rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .answer {
      position: relative;
      display: grid;
      min-height: 92px;
      place-items: center;
      overflow: hidden;
      border: 2px solid #e4e9f1;
      border-radius: 18px;
      background: #fff;
      color: #17233c;
      cursor: pointer;
      transition: transform .16s, border-color .16s, background .16s, box-shadow .16s;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: #9ab8e9;
      box-shadow: 0 8px 18px #213c6415;
    }

    .ball {
      position: absolute;
      inset: -25px auto auto -13px;
      width: 74px;
      height: 74px;
      border: 2px solid #9d421c;
      border-radius: 50%;
      background:
        linear-gradient(34deg, transparent 47%, #39251d 48%, #39251d 50%, transparent 51%),
        linear-gradient(-34deg, transparent 47%, #39251d 48%, #39251d 50%, transparent 51%),
        radial-gradient(circle at 32% 28%, #ffb35a, #ed741f 62%, #d85517);
      opacity: .8;
    }

    .ball::after {
      position: absolute;
      inset: 0 23px;
      border-right: 2px solid #39251d;
      border-left: 2px solid #39251d;
      border-radius: 50%;
      content: "";
    }

    .answer-number {
      position: relative;
      z-index: 1;
      font-size: clamp(1.7rem, 5vw, 2.45rem);
      font-weight: 900;
      text-shadow: 0 1px #fff, 1px 0 #fff, -1px 0 #fff, 0 -1px #fff;
    }

    .answer:disabled { cursor: default; }
    .answer.is-right { border-color: #20a36a; background: #eafff4; }
    .answer.is-wrong { border-color: #e27777; background: #fff0ef; }

    .feedback {
      min-height: 34px;
      margin: 16px 0 0;
      text-align: center;
      color: #52617a;
      font-weight: 750;
    }

    .feedback.good { color: #087648; }
    .feedback.bad { color: #b33e3e; }

    .next-row {
      display: flex;
      justify-content: center;
      min-height: 50px;
      margin-top: 6px;
    }

    .next {
      align-self: flex-start;
      min-height: 46px;
      padding: 10px 22px;
      border: 0;
      border-radius: 13px;
      background: #1b9a67;
      color: #fff;
      cursor: pointer;
      font-weight: 850;
      box-shadow: 0 5px 12px #1b9a6730;
    }

    .next:hover { background: #147d52; }
    .next[hidden] { display: none; }

    .footer-note {
      margin: 15px 0 0;
      text-align: center;
      color: #8a96a9;
      font-size: .82rem;
    }

    .game-link {
      display: block;
      width: fit-content;
      margin: 12px auto 0;
      color: #2764c5;
      font-size: .9rem;
      font-weight: 800;
      text-decoration: none;
    }

    .game-link:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      body { padding: 16px 10px 28px; }
      .topline { align-items: flex-start; }
      .brand { gap: 8px; }
      .brand-icon { width: 40px; height: 40px; border-radius: 12px; font-size: 23px; }
      .subtitle { max-width: 190px; font-size: .8rem; }
      .score { padding: 8px 10px; font-size: .8rem; }
      .controls { align-items: flex-start; flex-direction: column; padding: 15px; }
      .levels { gap: 6px; }
      .level { min-height: 36px; padding: 7px 10px; font-size: .83rem; }
      .round-label { align-self: flex-end; }
      .game-body { padding: 17px 13px; }
      .answers { gap: 7px; }
      .answer { min-height: 76px; border-radius: 14px; }
      .ball { width: 60px; height: 60px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <a class="back" href="../index.html">← Alle spil</a>
    <header class="topline">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">🏀</div>
        <div>
          <h1>Talbasket</h1>
          <p class="subtitle">Lær om enere, tiere og hundreder</p>
        </div>
      </div>
      <div class="score" id="score" aria-live="polite">Rigtige: 0 / 0</div>
    </header>

    <section class="game-card" aria-label="Talbasket-spil">
      <div class="controls">
        <nav class="levels" aria-label="Vælg sværhedsgrad">
          <button class="level" type="button" data-max="19" aria-pressed="true">Op til 19</button>
          <button class="level" type="button" data-max="29" aria-pressed="false">Op til 29</button>
          <button class="level" type="button" data-max="49" aria-pressed="false">Op til 49</button>
          <button class="level" type="button" data-max="99" aria-pressed="false">Op til 99</button>
          <button class="level" type="button" data-max="999" aria-pressed="false">Op til 999</button>
        </nav>
        <div class="round-label" id="round">Runde 1</div>
      </div>

      <div class="game-body">
        <p class="prompt">Hvilket tal viser klodserne?</p>
        <p class="hint">Tæl hundreder, tiere og enere — og vælg den rigtige bold.</p>
        <div class="blocks-panel">
          <svg id="blocks" viewBox="0 0 900 330" role="img" aria-labelledby="blocks-title blocks-desc">
            <title id="blocks-title">Base-ti klodser</title>
            <desc id="blocks-desc">Klodserne viser et tal.</desc>
          </svg>
        </div>
        <p class="answers-title">Vælg et svar</p>
        <div class="answers" id="answers" aria-label="Mulige svar"></div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
        <div class="next-row">
          <button class="next" id="next" type="button" hidden>Næste spørgsmål <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>
    <p class="footer-note">Et lille matematikspil til at øve positionsværdi.</p>
    <a class="game-link" href="plus-minus.html">Prøv også plus og minus →</a>
  </main>

  <script>
    const levelButtons = [...document.querySelectorAll(".level")];
    const answerContainer = document.querySelector("#answers");
    const scoreDisplay = document.querySelector("#score");
    const roundDisplay = document.querySelector("#round");
    const feedback = document.querySelector("#feedback");
    const nextButton = document.querySelector("#next");
    const blocksSvg = document.querySelector("#blocks");
    const blocksDescription = document.querySelector("#blocks-desc");

    let maximum = 19;
    let currentNumber = 0;
    let correctCount = 0;
    let answeredCount = 0;
    let round = 1;

    function randomInteger(max) {
      return Math.floor(Math.random() * max) + 1;
    }

    function makeChoices(answer) {
      const choices = new Set([answer]);
      while (choices.size < 4) choices.add(randomInteger(maximum));
      return [...choices].sort(() => Math.random() - 0.5);
    }

    function renderBlocks(number) {
      const hundreds = Math.floor(number / 100);
      const tens = Math.floor((number % 100) / 10);
      const ones = number % 10;
      const categories = [
        { label: "Hundreder", count: hundreds, x: 16, kind: "hundred" },
        { label: "Tiere", count: tens, x: 316, kind: "ten" },
        { label: "Enere", count: ones, x: 616, kind: "one" }
      ];

      let markup = `<rect x="1" y="1" width="898" height="328" rx="16" fill="transparent"/>`;

      for (const category of categories) {
        markup += `<text x="${category.x + 134}" y="29" text-anchor="middle" fill="#506784" font-size="17" font-weight="700" font-family="Trebuchet MS, sans-serif">${category.label}</text>`;
        markup += `<line x1="${category.x + 12}" y1="42" x2="${category.x + 256}" y2="42" stroke="#d4e5f1" stroke-width="2"/>`;

        for (let index = 0; index < category.count; index++) {
          if (category.kind === "hundred") {
            const col = index % 3;
            const row = Math.floor(index / 3);
            const x = category.x + 31 + col * 82;
            const y = 61 + row * 84;
            markup += `<g aria-hidden="true"><rect x="${x}" y="${y}" width="70" height="70" rx="3" fill="#f3b942" stroke="#bd841f" stroke-width="2"/>`;
            for (let grid = 1; grid < 10; grid++) {
              const offset = grid * 7;
              markup += `<path d="M${x + offset} ${y}v70 M${x} ${y + offset}h70" stroke="#fff1c8" stroke-width="1.3"/>`;
            }
            markup += `</g>`;
          } else if (category.kind === "ten") {
            const col = index % 6;
            const row = Math.floor(index / 6);
            const x = category.x + 29 + col * 37;
            const y = 61 + row * 116;
            markup += `<g aria-hidden="true"><rect x="${x}" y="${y}" width="28" height="105" rx="5" fill="#43a86b" stroke="#247747" stroke-width="2"/>`;
            for (let segment = 1; segment < 10; segment++) {
              const sy = y + segment * 10.5;
              markup += `<path d="M${x + 2} ${sy}h24" stroke="#a9e3bb" stroke-width="1.4"/>`;
            }
            markup += `<path d="M${x + 5} ${y + 3}v99" stroke="#83d19b" stroke-width="2" opacity=".8"/></g>`;
          } else {
            const col = index % 5;
            const row = Math.floor(index / 5);
            const x = category.x + 32 + col * 43;
            const y = 72 + row * 94;
            markup += `<g aria-hidden="true"><polygon points="${x},${y + 9} ${x + 15},${y} ${x + 30},${y + 9} ${x + 15},${y + 18}" fill="#ff7770" stroke="#ba4542" stroke-width="1.5"/>`;
            markup += `<polygon points="${x},${y + 9} ${x + 15},${y + 18} ${x + 15},${y + 38} ${x},${y + 29}" fill="#e55450" stroke="#ba4542" stroke-width="1.5"/>`;
            markup += `<polygon points="${x + 15},${y + 18} ${x + 30},${y + 9} ${x + 30},${y + 29} ${x + 15},${y + 38}" fill="#d94240" stroke="#ba4542" stroke-width="1.5"/></g>`;
          }
        }
      }

      blocksSvg.innerHTML = `<title id="blocks-title">Base-ti klodser</title><desc id="blocks-desc">${hundreds} hundreder, ${tens} tiere og ${ones} enere.</desc>${markup}`;
      blocksDescription.textContent = `${hundreds} hundreder, ${tens} tiere og ${ones} enere.`;
    }

    function startRound() {
      currentNumber = randomInteger(maximum);
      roundDisplay.textContent = `Runde ${round}`;
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.hidden = true;
      renderBlocks(currentNumber);
      answerContainer.replaceChildren();

      for (const choice of makeChoices(currentNumber)) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.setAttribute("aria-label", `Svar ${choice}`);
        button.innerHTML = `<span class="ball" aria-hidden="true"></span><span class="answer-number">${choice}</span>`;
        button.addEventListener("click", () => selectAnswer(button, choice));
        answerContainer.append(button);
      }
    }

    function placeDescription(number) {
      const hundreds = Math.floor(number / 100);
      const tens = Math.floor((number % 100) / 10);
      const ones = number % 10;
      const parts = [];
      if (hundreds) parts.push(`${hundreds} ${hundreds === 1 ? "hundred" : "hundreder"}`);
      if (tens) parts.push(`${tens} ${tens === 1 ? "tier" : "tiere"}`);
      if (ones) parts.push(`${ones} ${ones === 1 ? "ener" : "enere"}`);
      return parts.join(" og ");
    }

    function selectAnswer(selectedButton, choice) {
      const isCorrect = choice === currentNumber;
      answeredCount++;
      if (isCorrect) correctCount++;

      for (const button of answerContainer.querySelectorAll(".answer")) {
        button.disabled = true;
        if (Number(button.querySelector(".answer-number").textContent) === currentNumber) {
          button.classList.add("is-right");
        }
      }

      if (isCorrect) {
        feedback.textContent = `Rigtigt! ${currentNumber} er ${placeDescription(currentNumber)}.`;
        feedback.classList.add("good");
      } else {
        selectedButton.classList.add("is-wrong");
        feedback.textContent = `Godt forsøgt — det rigtige svar er ${currentNumber} (${placeDescription(currentNumber)}).`;
        feedback.classList.add("bad");
      }

      scoreDisplay.textContent = `Rigtige: ${correctCount} / ${answeredCount}`;
      nextButton.hidden = false;
      nextButton.focus();
    }

    for (const button of levelButtons) {
      button.addEventListener("click", () => {
        maximum = Number(button.dataset.max);
        correctCount = 0;
        answeredCount = 0;
        round = 1;
        scoreDisplay.textContent = "Rigtige: 0 / 0";
        for (const level of levelButtons) {
          level.setAttribute("aria-pressed", String(level === button));
        }
        startRound();
      });
    }

    nextButton.addEventListener("click", () => {
      round++;
      startRound();
      answerContainer.querySelector(".answer")?.focus();
    });

    startRound();
  </script>
</body>
</html>
