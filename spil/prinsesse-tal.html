<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffd6ec">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Prinsesse Riyana">
  <title>Prinsesse Riyana lærer tallene</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #5b2a63;
      font-synthesis: none;
      /* Én enhed, der følger skærmens mindste side, så alt vokser og skrumper sammen */
      --u: min(1vw, 1.3vh);
      --it: clamp(3rem, calc(var(--u) * 13), 8rem);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }

    html { height: 100%; overflow: hidden; overscroll-behavior: none; }

    body {
      display: flex;
      flex-direction: column;
      min-width: 320px;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: calc(var(--tb-h, 54px) + 6px) 12px 10px;
      background: linear-gradient(170deg, #ffd6ec 0%, #e9d5ff 52%, #cfe8ff 100%);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: none;
    }

    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }

    /* ---------- Magisk baggrund ---------- */
    #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .rainbow {
      position: absolute; left: 50%; bottom: -22vmin; width: 130vmin; height: 65vmin; transform: translateX(-50%); opacity: .5;
      background: radial-gradient(circle 64vmin at 50% 100%, transparent 52%, #ff9ec4 52% 58%, #ffd59e 58% 64%, #fff3a3 64% 70%, #b8f0b0 70% 76%, #a8dcff 76% 82%, #d2b8ff 82% 88%, transparent 88%);
    }
    .cloud {
      position: absolute; left: -30vmin; width: 26vmin; height: 8vmin; border-radius: 99px; background: #ffffffcc;
      filter: blur(1px); animation: drift linear infinite;
    }
    .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
    .cloud::before { width: 45%; height: 130%; left: 14%; top: -62%; }
    .cloud::after { width: 34%; height: 100%; left: 50%; top: -42%; }
    .tw { position: absolute; font-size: clamp(1rem, 3vmin, 2rem); animation: twinkle 3s ease-in-out infinite alternate; }

    /* ---------- Layout ---------- */
    .app {
      position: relative; z-index: 1; display: flex; flex: 1; flex-direction: column; min-height: 0;
      width: min(100%, 860px); margin: 0 auto; gap: calc(var(--u) * 1.4);
    }
    .act { display: flex; flex: 1; flex-direction: column; min-height: 0; gap: calc(var(--u) * 1.4); }
    .ask { display: flex; flex: none; align-items: center; gap: calc(var(--u) * 1.8); }
    .avatar {
      flex: none; font-size: clamp(3.6rem, calc(var(--u) * 12), 8.5rem); line-height: 1;
      filter: drop-shadow(0 .5rem .6rem #8a2f7d44); animation: sway 3s ease-in-out infinite alternate; transform-origin: 50% 80%;
    }
    .avatar.cheer { animation: twirl .9s ease-in-out; }
    .avatar.oops { animation: shake .5s; }
    .bubble {
      position: relative; display: flex; flex: 1; align-items: center; gap: 10px; text-align: left;
      padding: calc(var(--u) * 1.6) calc(var(--u) * 2.2); border-radius: 26px; background: #fff; border: 4px solid #f9a8d4;
      font-size: clamp(1.4rem, calc(var(--u) * 4.6), 3.2rem); font-weight: 900; color: #a3267f; box-shadow: 0 8px 18px #8a2f7d22;
    }
    .bubble:active { transform: scale(.98); }
    .bubble::before {
      content: ""; position: absolute; left: -12px; top: 50%; width: 20px; height: 20px; background: #fff;
      border-left: 4px solid #f9a8d4; border-bottom: 4px solid #f9a8d4; transform: translateY(-50%) rotate(45deg);
    }
    .spk { font-size: .9em; animation: nudge 1.6s ease-in-out infinite; }
    #askText { display: inline-flex; align-items: center; gap: .35em; flex-wrap: wrap; }
    .chip {
      display: inline-grid; place-items: center; min-width: 1.5em; height: 1.5em; padding: 0 .25em; border-radius: 99px; color: #fff;
      font-size: 1.1em; text-shadow: 0 2px 0 #0003; background: linear-gradient(160deg, var(--a), var(--b)); box-shadow: 0 3px 0 color-mix(in srgb, var(--b) 70%, #000);
    }
    .collect { display: flex; flex: none; flex-wrap: wrap; justify-content: center; gap: 4px; font-size: clamp(1.2rem, calc(var(--u) * 3.2), 2rem); line-height: 1; }
    .collect .locked { filter: grayscale(1) brightness(1.6); opacity: .3; }
    .collect .new { animation: pop .6s; }
    .stage { display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: space-evenly; min-height: 0; gap: calc(var(--u) * 1.6); }

    .tb-panel .parent { display: flex; align-items: center; justify-content: center; gap: 10px; color: #8a6b99; font-size: 1.1rem; font-weight: 800; }
    .tb-panel .parent button { width: 48px; height: 48px; border-radius: 12px; background: #f3e8ff; font-size: 1.4rem; font-weight: 900; }

    /* ---------- Talfarver ---------- */
    .c0  { --a: #c4b5fd; --b: #8b5cf6; }
    .c1  { --a: #ff9ec4; --b: #ec4899; }
    .c2  { --a: #ffb87a; --b: #f97316; }
    .c3  { --a: #ffe27a; --b: #d9a406; }
    .c4  { --a: #8ee6a0; --b: #22a653; }
    .c5  { --a: #7ee0e0; --b: #0aa5c0; }
    .c6  { --a: #93c5fd; --b: #3b82f6; }
    .c7  { --a: #d8a7ff; --b: #a855f7; }
    .c8  { --a: #ff9aa2; --b: #ef4444; }
    .c9  { --a: #a5f3c9; --b: #10a878; }
    .c10 { --a: #fda4af; --b: #e11d48; }

    /* ---------- Ting, der tælles ---------- */
    .items { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 1); max-width: calc(var(--it) * 5.6); }
    .items.many { --it: clamp(1.7rem, calc(var(--u) * 6.5), 4.2rem); max-width: calc(var(--it) * 10.8); }
    .it {
      position: relative; display: grid; place-items: center; width: var(--it); height: var(--it); font-size: calc(var(--it) * .8); line-height: 1;
      transition: transform .2s; filter: drop-shadow(0 .3rem .3rem #8a2f7d33);
    }
    .it.hid { opacity: 0; transform: scale(.2); }
    .it.pop { animation: pop .5s; }
    .it.hop { animation: hop .5s; }
    .it.counted { filter: drop-shadow(0 0 .7rem #ec4899); }
    .it.dance { animation: dance .6s ease-in-out 3; animation-delay: calc(var(--k, 0) * 70ms); }
    .it i {
      position: absolute; right: -4%; bottom: -4%; display: grid; place-items: center; min-width: 1.4em; height: 1.4em; padding: 0 .15em; border-radius: 99px;
      background: #ec4899; color: #fff; font-size: calc(var(--it) * .34); font-style: normal; font-weight: 900; border: 3px solid #fff; animation: pop .35s;
    }
    .it.hint::after { content: "👆"; position: absolute; left: 50%; top: 62%; font-size: .75em; animation: tapHint .8s ease-in-out infinite alternate; }
    .tappable .it { cursor: pointer; }

    /* ---------- Lær tallene ---------- */
    .strip { display: grid; grid-template-columns: repeat(var(--cols, 5), 1fr); gap: calc(var(--u) * 1.2); width: min(100%, 640px); }
    .nb {
      position: relative; aspect-ratio: 1.1; max-height: var(--nh, calc(var(--u) * 19)); border-radius: 20px; color: #fff; font-weight: 900; font-size: var(--nf, clamp(2.4rem, calc(var(--u) * 9), 5.5rem));
      text-shadow: 0 3px 0 #0003; background: linear-gradient(160deg, var(--a), var(--b));
      box-shadow: 0 7px 0 color-mix(in srgb, var(--b) 70%, #000), 0 12px 20px #8a2f7d22; transition: transform .12s;
    }
    .nb:active { transform: translateY(5px); box-shadow: 0 2px 0 color-mix(in srgb, var(--b) 70%, #000); }
    .nb.on { outline: 5px solid #fff; transform: scale(1.07); }
    .nb.hint { animation: glow .8s ease-in-out infinite alternate; }
    .nb.hint::after { content: "👆"; position: absolute; left: 50%; bottom: -34%; font-size: .55em; animation: tapHint .8s ease-in-out infinite alternate; }
    /* Visningen af det valgte tal: størrelsen følger antallet, så alt passer på skærmen */
    .show { --it: clamp(2.6rem, calc(var(--u) * 13), 8rem); --bn: calc(var(--u) * 16); display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 1.4); width: 100%; min-height: 0; }
    .show.six { --it: clamp(2.2rem, calc(var(--u) * 8.5), 5.5rem); --bn: calc(var(--u) * 12); }
    .show.many { --it: clamp(1.5rem, calc(var(--u) * 6.5), 4.2rem); --bn: calc(var(--u) * 10); }
    .showtop { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 2.4); }
    .bignum {
      display: grid; place-items: center; flex: none; width: var(--bn); height: var(--bn); min-width: 3.4rem; min-height: 3.4rem; border-radius: 50%; color: #fff; font-weight: 900;
      font-size: calc(var(--bn) * .68); line-height: 1; text-shadow: 0 4px 0 #0003; animation: pop .55s;
      background: radial-gradient(circle at 35% 30%, var(--a), var(--b)); box-shadow: 0 8px 0 color-mix(in srgb, var(--b) 70%, #000), 0 0 0 6px #fff, 0 14px 26px #8a2f7d33;
    }
    .word { font-size: clamp(1.6rem, calc(var(--bn) * .42), 4.4rem); font-weight: 900; color: var(--b); text-transform: capitalize; text-shadow: 0 3px 0 #fff; }
    .hand { font-size: clamp(3rem, calc(var(--u) * 10), 6rem); animation: float 1.2s ease-in-out infinite alternate; }

    /* ---------- Smykkeskrinet ---------- */
    .chest { position: relative; width: min(100%, calc(var(--u) * 70)); margin-top: calc(var(--u) * 2.4); }
    .lid {
      position: absolute; left: 0; right: 0; top: calc(var(--u) * -4.2); height: calc(var(--u) * 5); border-radius: 22px 22px 6px 6px;
      background: linear-gradient(#ffe27a, #f4b400); border: 4px solid #ffd54f; box-shadow: 0 5px 0 #b97f00;
      transform-origin: 50% 100%; transform: perspective(700px) rotateX(64deg); transition: transform .55s cubic-bezier(.3, 1.5, .5, 1);
    }
    .chest.done .lid { transform: perspective(700px) rotateX(0); }
    .box {
      position: relative; z-index: 1; padding: calc(var(--u) * 2.4); border-radius: 12px 12px 30px 30px; border: 5px solid #ffd54f;
      background: linear-gradient(#ff9ec4, #ec4899); box-shadow: 0 9px 0 #b0306f, 0 16px 26px #8a2f7d33;
    }
    .chest.done .box { animation: pop .6s; }
    .slots {
      display: grid; grid-template-columns: repeat(var(--cols, 3), auto); justify-content: center; gap: calc(var(--u) * 1.4);
      padding: calc(var(--u) * 1.8); border-radius: 22px; background: radial-gradient(#fff6fa, #ffd1e6); box-shadow: inset 0 4px 10px #b0306f44;
    }
    .slot {
      display: grid; place-items: center; width: var(--slot, calc(var(--u) * 12)); height: var(--slot, calc(var(--u) * 12)); min-width: 2.6rem; min-height: 2.6rem; border-radius: 50%;
      border: 4px dashed #f58abe; background: #ffffff99; font-size: calc(var(--slot, calc(var(--u) * 12)) * .75);
    }
    .slot.next { animation: slotPulse 1s ease-in-out infinite alternate; }
    .slot .it { width: 100%; height: 100%; font-size: calc(var(--slot, calc(var(--u) * 12)) * .75); }
    .tray {
      display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 1.2); width: min(100%, 700px); min-height: calc(var(--it) + 24px);
      padding: calc(var(--u) * 1.4); border-radius: 28px; background: linear-gradient(#fff, #ffe4f1); box-shadow: 0 6px 14px #8a2f7d22;
    }
    .gem {
      width: var(--it); height: var(--it); font-size: calc(var(--it) * .8); line-height: 1; touch-action: none; cursor: grab;
      filter: drop-shadow(0 .3rem .3rem #8a2f7d33); animation: float 2.4s ease-in-out infinite alternate;
    }
    .gem:nth-child(even) { animation-delay: -1.2s; }
    .gem.fade { opacity: 0; transform: scale(.3); transition: all .4s; }
    .drag { position: fixed; z-index: 70; margin: 0; display: grid; place-items: center; font-size: calc(var(--it) * .8); line-height: 1; pointer-events: none; animation: none; filter: drop-shadow(0 .8rem .6rem #8a2f7d55); }
    .drag.snap { transition: left .35s cubic-bezier(.3, 1.4, .5, 1), top .35s cubic-bezier(.3, 1.4, .5, 1), width .35s, height .35s; }

    /* ---------- Find tallet: balloner ---------- */
    .sky { display: flex; flex: 1; align-items: center; justify-content: center; gap: calc(var(--u) * 3); width: 100%; min-height: 0; }
    .balloon {
      position: relative; display: grid; place-items: center; width: calc(var(--u) * 24); height: calc(var(--u) * 30); min-width: 4.8rem; min-height: 6rem;
      border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%; color: #fff; font-weight: 900; font-size: calc(var(--u) * 13); line-height: 1; text-shadow: 0 4px 0 #0003;
      background: radial-gradient(circle at 34% 28%, #fff9 0 9%, transparent 10%), radial-gradient(circle at 40% 35%, var(--a), var(--b));
      box-shadow: inset -.8rem -1rem 1.6rem #0002, 0 12px 20px #8a2f7d26; animation: bob 3s ease-in-out infinite alternate; animation-delay: calc(var(--i, 0) * -.9s);
      transform-origin: 50% 100%;
    }
    .balloon::before { content: ""; position: absolute; left: 50%; bottom: -9%; width: 12%; height: 8%; background: var(--b); transform: translateX(-50%); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    .balloon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 3px; height: calc(var(--u) * 12); background: #ffffffcc; transform: translateX(-50%); border-radius: 3px; }
    .balloon.wobble { animation: wobble .6s; }
    .balloon.hint { animation: glowBob .8s ease-in-out infinite alternate; }
    .balloon.boom { animation: boom .3s ease-out forwards; }
    .balloon.away { animation: away 1.1s ease-in forwards; pointer-events: none; }
    .reveal { display: flex; flex: none; min-height: calc(var(--it) + 8px); align-items: center; justify-content: center; }

    /* ---------- Hvor mange? ---------- */
    .field {
      position: relative; display: flex; flex: 1; align-items: center; justify-content: center; width: min(100%, 720px); min-height: 0; padding: calc(var(--u) * 2);
      border-radius: 30px; background: linear-gradient(#e6f5ff 0 58%, #bdf0b4 58% 100%); box-shadow: inset 0 0 0 5px #fff, 0 10px 22px #8a2f7d22;
    }
    .field .items { position: relative; z-index: 1; }
    .answers { display: flex; flex: none; justify-content: center; gap: calc(var(--u) * 2.4); width: 100%; }
    .ans {
      display: grid; place-items: center; width: calc(var(--u) * 21); height: calc(var(--u) * 21); min-width: 4.4rem; min-height: 4.4rem; border-radius: 50%; color: #fff;
      font-weight: 900; font-size: calc(var(--u) * 11); line-height: 1; text-shadow: 0 4px 0 #0003;
      background: radial-gradient(circle at 35% 30%, var(--a), var(--b)); box-shadow: 0 8px 0 color-mix(in srgb, var(--b) 70%, #000), 0 0 0 5px #fff, 0 14px 22px #8a2f7d22; transition: transform .12s;
    }
    .ans:active { transform: translateY(5px); }
    .ans.shake { animation: shake .45s; }
    .ans.hint, .ans.win { animation: glow .8s ease-in-out infinite alternate; }
    .ans.win { transform: scale(1.1); }
    .ans:disabled { cursor: default; }

    /* ---------- Tallet vises stort og skrives ---------- */
    .numpop {
      position: fixed; inset: 0; z-index: 54; display: grid; place-items: center; width: 100%; padding: calc(var(--tb-h, 54px) + 8px) 12px 12px; margin: 0;
      background: radial-gradient(circle at 50% 45%, #fffffff7 0, #ffd6ecf9 70%, #e9d5fffa 100%); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      cursor: pointer; animation: fade .25s;
    }
    .numcard { display: grid; justify-items: center; gap: calc(var(--u) * 1.4); animation: pop .5s; }
    .numsvg {
      --h: clamp(6.5rem, min(calc(var(--u) * 46), 33vh), 24rem);
      height: var(--h); width: calc(var(--h) * var(--vbw, 100) / 140); overflow: visible; filter: drop-shadow(0 .6rem .7rem #8a2f7d40);
    }
    .numsvg path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .numsvg .ghost { stroke: #f1d6ec; stroke-width: 17; }
    .numsvg .ink { stroke: var(--b); stroke-width: 14; }
    .numsvg .pen { fill: #ffd54f; stroke: #fff; stroke-width: 4; filter: drop-shadow(0 0 7px #ffd54f); }
    .numsvg.done { animation: pop .55s; }
    .numword { min-height: 1.2em; color: var(--b); font-size: clamp(2rem, calc(var(--u) * 8), 5rem); font-weight: 900; text-transform: capitalize; text-shadow: 0 3px 0 #fff; opacity: 0; transition: opacity .3s; }
    .numword.on { opacity: 1; }
    .numitems { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * .8); max-width: calc(var(--u) * 62); min-height: calc(var(--u) * 7); font-size: clamp(1.3rem, calc(var(--u) * 6), 3.6rem); line-height: 1; }
    .numitems span { animation: pop .45s backwards; animation-delay: calc(var(--k, 0) * 110ms); }
    .numtap { font-size: clamp(1rem, calc(var(--u) * 3), 1.8rem); font-weight: 800; color: #a3267f99; animation: nudge 1.4s ease-in-out infinite; }

    /* ---------- Start ---------- */
    .start {
      position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; width: 100%; padding: 16px;
      background: #ffffff59; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); animation: fade .3s;
    }
    .start-card { display: grid; justify-items: center; gap: calc(var(--u) * 2); text-align: center; }
    .start-ico { font-size: clamp(4rem, calc(var(--u) * 14), 9rem); line-height: 1; animation: bounce 1.4s ease-in-out infinite; }
    .start h1 { margin: 0; color: #a3267f; font-size: clamp(2rem, calc(var(--u) * 7), 4.6rem); letter-spacing: -.02em; text-shadow: 0 3px 0 #fff; }
    .play {
      position: relative; display: grid; place-items: center; width: calc(var(--u) * 26); height: calc(var(--u) * 26); min-width: 7rem; min-height: 7rem; border-radius: 50%;
      color: #fff; font-size: calc(var(--u) * 12); padding-left: .06em; text-shadow: 0 4px 0 #0003;
      background: radial-gradient(circle at 35% 30%, #ff9ec4, #ec4899); box-shadow: 0 10px 0 #b0306f, 0 0 0 7px #fff, 0 18px 30px #8a2f7d44; animation: playPulse 1.2s ease-in-out infinite alternate;
    }

    /* ---------- Overlay og effekter ---------- */
    #pop { position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; background: #ffffffb0; backdrop-filter: blur(4px); }
    .popbox { display: grid; gap: 8px; justify-items: center; padding: 28px 40px; border-radius: 36px; background: #fff; border: 5px solid #f9a8d4; box-shadow: 0 20px 50px #8a2f7d44; animation: pop .5s; }
    .popbig { font-size: clamp(5rem, calc(var(--u) * 18), 10rem); line-height: 1; animation: bounce 1s ease-in-out infinite; }
    .poptext { font-size: clamp(1.6rem, calc(var(--u) * 5), 3rem); font-weight: 900; color: #a3267f; text-align: center; }

    #fx { position: fixed; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
    .conf { position: absolute; top: -10%; animation: fall linear forwards; }
    .sp {
      position: fixed; z-index: 60; font-size: clamp(1.2rem, calc(var(--u) * 3.6), 2.4rem); pointer-events: none; animation: spark .9s ease-out forwards;
      transform: translate(-50%, -50%);
    }

    @keyframes drift { to { transform: translateX(calc(100vw + 60vmin)); } }
    @keyframes twinkle { from { opacity: .25; transform: scale(.7) rotate(-10deg); } to { opacity: 1; transform: scale(1.15) rotate(10deg); } }
    @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg) translateY(-3%); } }
    @keyframes twirl { 0% { transform: translateY(0) rotate(0) scale(1); } 40% { transform: translateY(-22%) rotate(200deg) scale(1.25); } 100% { transform: translateY(0) rotate(360deg) scale(1); } }
    @keyframes float { from { transform: translateY(0); } to { transform: translateY(-7px); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14%) scale(1.08); } }
    @keyframes bob { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-3vmin) rotate(3deg); } }
    @keyframes glowBob { from { transform: translateY(0) scale(1); filter: drop-shadow(0 0 0 #fff); } to { transform: translateY(-3vmin) scale(1.08); filter: drop-shadow(0 0 18px #fff) drop-shadow(0 0 30px #ffe27a); } }
    @keyframes wobble { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-12deg); } 40% { transform: rotate(10deg); } 60% { transform: rotate(-7deg); } 80% { transform: rotate(5deg); } }
    @keyframes boom { 0% { transform: scale(1); opacity: 1; } 55% { transform: scale(1.35); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes away { to { transform: translateY(-120vh) rotate(8deg); opacity: .6; } }
    @keyframes pop { 0% { transform: scale(.2); opacity: 0; } 70% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); } }
    @keyframes hop { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-30%) scale(1.25); } 100% { transform: translateY(0) scale(1); } }
    @keyframes dance { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-22%) rotate(-12deg); } 75% { transform: translateY(-22%) rotate(12deg); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
    @keyframes glow { from { box-shadow: 0 8px 0 color-mix(in srgb, var(--b) 70%, #000), 0 0 0 5px #fff, 0 0 0 0 #ffe27a; } to { box-shadow: 0 8px 0 color-mix(in srgb, var(--b) 70%, #000), 0 0 0 5px #fff, 0 0 30px 14px #ffe27a; } }
    @keyframes slotPulse { from { background: #ffffff99; } to { background: #fff; border-color: #ec4899; } }
    @keyframes tapHint { from { transform: translate(-50%, 0); } to { transform: translate(-50%, 18%); } }
    @keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    @keyframes playPulse { from { transform: scale(1); } to { transform: scale(1.1); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes fall { to { transform: translateY(115vh) rotate(360deg); } }
    @keyframes spark { 0% { opacity: 1; transform: translate(-50%, -50%) scale(.3); } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(180deg); } }

    @media (max-height: 500px) {
      :root { --u: min(1vw, 1.02vh); }
      .collect { font-size: 1.05rem; }
      .ask { gap: 8px; }
      .show.six { --it: 2rem; --bn: calc(var(--u) * 9); }
      .show.many { --it: 1.4rem; --bn: calc(var(--u) * 8); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="bg" aria-hidden="true"><div class="rainbow"></div></div>

  <div class="app">
    <main class="act" id="view"></main>
  </div>

  <div class="settings" id="settings" hidden>
    <div class="parent" id="rangeBox">Tal: 1–<span id="maxN">3</span>
      <button id="sMaxDown" type="button" aria-label="Færre tal">−</button>
      <button id="sMaxUp" type="button" aria-label="Flere tal">+</button>
    </div>
  </div>

  <button class="start" id="start" type="button" aria-label="Start legen">
    <span class="start-card">
      <span class="start-ico" id="startIco">👸</span>
      <h1 id="startTitle">Prinsesse Riyana</h1>
      <span class="play">▶</span>
    </span>
  </button>

  <button class="numpop" id="numpop" type="button" hidden aria-label="Tallet. Tryk for at lege.">
    <span class="numcard" id="numcard">
      <svg class="numsvg" id="numsvg" aria-hidden="true"></svg>
      <span class="numword" id="numword"></span>
      <span class="numitems" id="numitems" aria-hidden="true"></span>
      <span class="numtap">👆 Tryk for at lege</span>
    </span>
  </button>

  <div id="pop" hidden></div>
  <div id="fx" aria-hidden="true"></div>

  <script src="../topbar.js"></script>
  <script>
    const W = ["nul", "en", "to", "tre", "fire", "fem", "seks", "syv", "otte", "ni", "ti", "elleve", "tolv", "tretten", "fjorten", "femten", "seksten", "sytten", "atten", "nitten", "tyve"];
    const THINGS = [
      { e: "💎", sg: "diamant", pl: "diamanter", art: "en", where: "i smykkeskrinet" },
      { e: "🎀", sg: "sløjfe", pl: "sløjfer", art: "en", where: "i smykkeskrinet" },
      { e: "💍", sg: "ring", pl: "ringe", art: "en", where: "i smykkeskrinet" },
      { e: "👑", sg: "krone", pl: "kroner", art: "en", where: "i smykkeskrinet" },
      { e: "🌸", sg: "blomst", pl: "blomster", art: "en", where: "i smykkeskrinet" },
      { e: "🦋", sg: "sommerfugl", pl: "sommerfugle", art: "en", where: "i smykkeskrinet" },
      { e: "💖", sg: "hjerte", pl: "hjerter", art: "et", where: "i smykkeskrinet" },
      { e: "⭐", sg: "stjerne", pl: "stjerner", art: "en", where: "i smykkeskrinet" }
    ];
    // Hver tredje stjerne giver et nyt prinsessting til samlingen
    const ACC = [
      { e: "🎀", name: "sløjfe" }, { e: "💍", name: "ring" }, { e: "💄", name: "læbestift" }, { e: "💎", name: "diamant" },
      { e: "🦄", name: "enhjørning" }, { e: "🌸", name: "blomst" }, { e: "🦋", name: "sommerfugl" }, { e: "👑", name: "krone" }
    ];
    const PRAISE = ["Flot!", "Dygtig!", "Super!", "Hurra!", "Sådan!", "Fantastisk!"];

    const $ = (s, r = document) => r.querySelector(s);
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const rnd = a => a[Math.floor(Math.random() * a.length)];
    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* ingen lagring */ } }
    };

    // Hver leg er et eget spil: ?leg=learn, make, find eller count
    const MODES = {
      learn: { title: "Lær tallene", ico: "🔢" },
      make: { title: "Smykkeskrinet", ico: "💎" },
      find: { title: "Find tallet", ico: "🎈" },
      count: { title: "Hvor mange?", ico: "🌸" }
    };
    const legParam = new URLSearchParams(location.search).get("leg");
    const MODE = Object.prototype.hasOwnProperty.call(MODES, legParam) ? legParam : "learn";
    const STAR_KEY = `prinsesse-${MODE}-stars`;
    document.title = `Prinsesse Riyana: ${MODES[MODE].title}`;
    $("#startIco").textContent = MODES[MODE].ico;
    $("#startTitle").textContent = MODES[MODE].title;

    const MAX_NUM = 20;   // højeste tal, man kan vælge i ⚙️
    const S = {
      stars: Number(store.get(STAR_KEY, 0)) || 0,
      max: Math.min(MAX_NUM, Math.max(2, Number(store.get("prinsesse-max", 3)) || 3)),
      learnMax: Math.min(MAX_NUM, Math.max(3, Number(store.get("prinsesse-learn-max", 10)) || 10)),
      muted: !Topbar.soundOn(),
      streak: 0,
      last: -1
    };
    const view = $("#view");
    let ver = 0;            // bruges til at afbryde igangværende forløb ved skærmskift
    let started = false;
    let askSpeech = "";

    /* ---------- Baggrund ---------- */
    (function buildBackground() {
      const bg = $("#bg");
      for (let i = 0; i < 5; i++) {
        const c = document.createElement("div");
        c.className = "cloud";
        c.style.top = `${6 + i * 17 + Math.random() * 6}%`;
        c.style.transform = `scale(${.7 + Math.random() * .8})`;
        c.style.animationDuration = `${70 + i * 28}s`;
        c.style.animationDelay = `${-Math.random() * 90}s`;
        bg.append(c);
      }
      for (let i = 0; i < 16; i++) {
        const t = document.createElement("span");
        t.className = "tw";
        t.textContent = i % 3 ? "✨" : "⭐";
        t.style.left = `${Math.random() * 96}%`;
        t.style.top = `${Math.random() * 92}%`;
        t.style.animationDelay = `${-Math.random() * 3}s`;
        t.style.animationDuration = `${2 + Math.random() * 3}s`;
        bg.append(t);
      }
    })();

    /* ---------- Lyd ---------- */
    let ac;
    function audioOk() {
      if (S.muted) return false;
      try {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === "suspended") ac.resume().catch(() => {});
        return ac.state === "running";
      } catch { return false; }
    }
    function tone(f, d = .18, type = "sine", vol = .16, delay = 0, slideTo = 0) {
      if (!audioOk()) return;
      try {
        const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + d);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + .015);
        g.gain.exponentialRampToValueAtTime(.001, t + d);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + d + .02);
      } catch { /* ingen lyd */ }
    }
    function noise(d = .15, vol = .1, delay = 0, type = "highpass", from = 2500, to = 0) {
      if (!audioOk()) return;
      try {
        const t = ac.currentTime + delay;
        const buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * d)), ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const src = ac.createBufferSource();
        src.buffer = buf;
        const flt = ac.createBiquadFilter();
        flt.type = type;
        flt.frequency.setValueAtTime(from, t);
        if (to) flt.frequency.exponentialRampToValueAtTime(to, t + d);
        const g = ac.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + .01);
        g.gain.exponentialRampToValueAtTime(.001, t + d);
        src.connect(flt); flt.connect(g); g.connect(ac.destination);
        src.start(t);
      } catch { /* ingen lyd */ }
    }
    const SCALE = [262, 294, 330, 392, 440, 523, 587, 659, 784, 880, 1047];
    const sfx = {
      tick() { tone(1100, .05, "triangle", .035); },
      note(n) { tone(SCALE[Math.min(n, 10)], .26, "triangle", .17); tone(SCALE[Math.min(n, 10)] * 2, .18, "sine", .05, .05); },
      pick() { tone(500, .1, "triangle", .12, 0, 900); },
      clink(n) { tone(SCALE[Math.min(n, 10)] * 2, .35, "sine", .12); tone(SCALE[Math.min(n, 10)] * 3, .25, "sine", .05, .03); },
      balloon() { noise(.14, .16, 0, "highpass", 1500); tone(380, .14, "sine", .14, 0, 90); },
      oops() { tone(300, .2, "sine", .13); tone(240, .25, "sine", .13, .12); },
      giggle() { [660, 880, 740, 990].forEach((f, i) => tone(f, .09, "triangle", .1, i * .08)); },
      chest() { tone(160, .14, "square", .1, 0, 90); noise(.5, .06, .12, "highpass", 5000); [1047, 1319, 1568].forEach((f, i) => tone(f, .4, "sine", .08, .15 + i * .09)); },
      win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .3, "triangle", .15, i * .09)); tone(2093, .5, "sine", .05, .5); },
      whoosh() { noise(.3, .08, 0, "bandpass", 400, 2400); }
    };

    /* ---------- Tale ---------- */
    let daVoice = null;
    function findVoice() {
      if (!("speechSynthesis" in window)) return;
      daVoice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("da")) || null;
    }
    findVoice();
    if ("speechSynthesis" in window) speechSynthesis.addEventListener("voiceschanged", findVoice);

    // Uden dansk stemme på enheden hentes oplæsningen online (kun selve teksten sendes).
    const clips = new Map();
    let curClip = null;
    function stopSpeech() {
      try { speechSynthesis.cancel(); } catch { /* ingen tale */ }
      if (curClip) { curClip.pause(); curClip = null; }
    }

    function speak(text) {
      return new Promise(res => {
        if (S.muted) { setTimeout(res, 450); return; }
        let done = false;
        const fin = () => { if (!done) { done = true; res(); } };
        setTimeout(fin, 1500 + text.length * 110);
        stopSpeech();
        if (daVoice) {
          const u = new SpeechSynthesisUtterance(text);
          u.voice = daVoice; u.lang = daVoice.lang; u.rate = .85; u.pitch = 1.2;
          u.onend = fin; u.onerror = fin;
          speechSynthesis.speak(u);
          return;
        }
        const key = text.toLowerCase();
        if (!clips.has(key)) {
          const a = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=da&q=${encodeURIComponent(key)}`);
          a.preload = "auto";
          clips.set(key, a);
        }
        const a = clips.get(key);
        curClip = a;
        a.onended = fin; a.onerror = fin;
        a.currentTime = 0;
        a.play().catch(fin);
      });
    }

    window.addEventListener("topbar:sound", e => {
      S.muted = !e.detail.on;
      if (S.muted) stopSpeech();
    });

    /* ---------- Effekter ---------- */
    function burst(x, y, list = ["✨", "💖", "⭐"], n = 9, far = 110) {
      for (let i = 0; i < n; i++) {
        const s = document.createElement("span");
        const a = (i / n) * Math.PI * 2 + Math.random() * .5;
        const d = far * (.5 + Math.random() * .6);
        s.className = "sp";
        s.textContent = rnd(list);
        s.style.left = `${x}px`;
        s.style.top = `${y}px`;
        s.style.setProperty("--dx", `${Math.cos(a) * d}px`);
        s.style.setProperty("--dy", `${Math.sin(a) * d - 20}px`);
        $("#fx").append(s);
        setTimeout(() => s.remove(), 1000);
      }
    }
    function burstEl(el, list, n, far) {
      const r = el.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, list, n, far);
    }

    // Alle tryk giver et lille glimt og en blød lyd
    let lastTap = 0;
    document.addEventListener("pointerdown", e => {
      if (!started || e.target.closest(".tb, .tb-backdrop, #start")) return;
      const now = performance.now();
      if (now - lastTap < 140) return;
      lastTap = now;
      burst(e.clientX, e.clientY, ["✨"], 3, 38);
      sfx.tick();
    }, true);

    function confetti(n = 24) {
      const fx = $("#fx"), E = ["💖", "✨", "⭐", "👑", "💎", "🎀", "🌸"];
      for (let i = 0; i < n; i++) {
        const s = document.createElement("span");
        s.className = "conf";
        s.textContent = rnd(E);
        s.style.left = Math.random() * 100 + "%";
        s.style.fontSize = 1.4 + Math.random() * 1.6 + "rem";
        s.style.animationDuration = 1.4 + Math.random() * 1.2 + "s";
        s.style.animationDelay = Math.random() * .3 + "s";
        fx.append(s);
        setTimeout(() => s.remove(), 3200);
      }
    }

    function showPop(big, text) {
      return new Promise(res => {
        const p = $("#pop");
        p.innerHTML = `<div class="popbox"><div class="popbig">${big}</div><div class="poptext">${text}</div></div>`;
        p.hidden = false;
        confetti(34);
        sfx.win();
        let done = false;
        const end = () => { if (!done) { done = true; p.hidden = true; res(); } };
        p.onclick = end;
        speak(text).then(() => setTimeout(end, 500));
        setTimeout(end, 4500);
      });
    }

    function avatarDo(cls) {
      const a = $("#av");
      if (!a) return;
      a.classList.remove("cheer", "oops");
      void a.offsetWidth;
      a.classList.add(cls);
    }

    /* ---------- Hjælpere ---------- */
    const phrase = (n, t) => n === 1 ? `${t.art} ${t.sg}` : `${W[n]} ${t.pl}`;
    // Talfarverne gentager sig efter ti
    const cc = n => ((n - 1) % 10) + 1;
    const chip = n => `<span class="chip c${cc(n)}">${n}</span>`;

    function pick() {
      const p = [];
      for (let i = 1; i <= S.max; i++) if (i !== S.last) p.push(i);
      return (S.last = rnd(p));
    }

    // Altid mindst tre valg, så der er noget at vælge imellem
    function choices(n) {
      const top = Math.max(3, S.max);
      const all = [];
      for (let i = 1; i <= top; i++) if (i !== n) all.push(i);
      const s = [n];
      while (s.length < 3 && all.length) s.push(all.splice(Math.floor(Math.random() * all.length), 1)[0]);
      return s.sort(() => Math.random() - .5);
    }

    function items(n, t, { hide = false, tappable = false } = {}) {
      const row = document.createElement("div");
      row.className = "items" + (tappable ? " tappable" : "") + (n > 10 ? " many" : "");
      for (let i = 0; i < n; i++) {
        const s = document.createElement("button");
        s.type = "button";
        s.className = "it" + (hide ? " hid" : "");
        s.style.setProperty("--k", i);
        s.textContent = t.e;
        s.setAttribute("aria-label", `${t.sg} ${i + 1}`);
        row.append(s);
      }
      return row;
    }

    async function reward(v, first, line) {
      avatarDo("cheer"); confetti(); sfx.win();
      S.stars++;
      const unlock = S.stars % 3 === 0 && S.stars / 3 <= ACC.length ? ACC[S.stars / 3 - 1] : null;
      let levelUp = false;
      if (first) {
        if (++S.streak >= 3 && S.max < 10) { S.max++; S.streak = 0; levelUp = true; paintMax(); }
      } else S.streak = 0;
      store.set(STAR_KEY, S.stars);
      store.set("prinsesse-max", S.max);
      Topbar.refreshStars(true);
      await speak(line);
      if (v !== ver) return false;
      if (unlock) { await showPop(unlock.e, `Du fik en ${unlock.name}!`); if (v !== ver) return false; }
      if (levelUp) { await showPop(S.max, "Nu kan vi øve flere tal!"); if (v !== ver) return false; }
      return true;
    }

    async function countAloud(v, row) {
      let i = 0;
      for (const el of row.querySelectorAll(".it")) {
        i++;
        el.classList.remove("hid");
        el.classList.add("pop");
        sfx.note(i);
        burstEl(el, ["✨"], 5, 60);
        await speak(W[i]);
        if (v !== ver) return false;
        await sleep(100);
      }
      return true;
    }

    const dance = row => row.querySelectorAll(".it").forEach(el => { el.classList.remove("pop", "hop"); void el.offsetWidth; el.classList.add("dance"); });

    /* ---------- Navigation og opsætning ---------- */
    function go(name) {
      if (!started) return;
      ver++;
      numTok++;
      $("#numpop").hidden = true;
      stopSpeech();
      $("#pop").hidden = true;
      ({ learn: learnView, make: makeRound, find: findRound, count: countRound })[name]();
    }

    // Talområdet vælges i ⚙️-menuen. "Lær tallene" har sit eget (standard 1–10), de andre lege har deres (stiger af sig selv op til 10).
    const paintMax = () => { $("#maxN").textContent = MODE === "learn" ? S.learnMax : S.max; };
    const stepMax = d => {
      if (MODE === "learn") {
        S.learnMax = Math.min(MAX_NUM, Math.max(3, S.learnMax + d));
        store.set("prinsesse-learn-max", S.learnMax);
      } else {
        S.max = Math.min(MAX_NUM, Math.max(2, S.max + d));
        S.streak = 0;
        store.set("prinsesse-max", S.max);
      }
      paintMax();
      go(MODE);
    };
    $("#sMaxDown").addEventListener("click", () => stepMax(-1));
    $("#sMaxUp").addEventListener("click", () => stepMax(1));
    paintMax();

    function scaffold() {
      const got = Math.min(ACC.length, Math.floor(S.stars / 3));
      // Samlingen af prinsessting: det nyeste lyser op
      const collect = MODE !== "learn"
        ? `<div class="collect" aria-label="Dine prinsessting">${ACC.map((a, i) => `<span class="${i < got ? (i === got - 1 && S.stars % 3 === 0 ? "new" : "") : "locked"}">${a.e}</span>`).join("")}</div>`
        : "";
      view.innerHTML = `
        <div class="ask">
          <button class="avatar" id="av" type="button" aria-label="Prinsesse Riyana">👸</button>
          <button class="bubble" id="again" type="button"><span class="spk">🔊</span><span id="askText"></span></button>
        </div>
        ${collect}
        <div class="stage" id="stage"></div>`;
      $("#again").addEventListener("click", () => speak(askSpeech));
      $("#av").addEventListener("click", e => {
        avatarDo("cheer");
        sfx.giggle();
        burstEl(e.currentTarget, ["💖", "✨", "⭐"], 8, 90);
      });
      return $("#stage");
    }

    function ask(html, speech, say = true) {
      $("#askText").innerHTML = html;
      askSpeech = speech;
      return say ? speak(speech) : Promise.resolve();
    }

    /* ---------- Tallet skrives: strøg for strøg, som man skriver det i hånden ---------- */
    // Hvert tal er en eller flere streger i en boks på 100 × 140, tegnet i skriveretningen
    const DIGITS = {
      "0": ["M50 12 C25 12 14 40 14 70 C14 100 28 128 50 128 C72 128 86 100 86 70 C86 40 75 12 50 12"],
      "1": ["M26 44 L56 14 L56 128"],
      "2": ["M20 42 C20 18 38 12 50 12 C68 12 80 24 80 42 C80 62 60 82 20 126 L86 126"],
      "3": ["M22 28 C32 14 48 12 56 12 C74 12 82 26 80 40 C78 56 62 66 44 66 C66 66 84 78 84 98 C84 118 66 128 48 128 C34 128 22 120 16 106"],
      "4": ["M68 12 L16 92 L90 92", "M68 12 L68 128"],
      "5": ["M80 14 L30 14 L24 64 C34 56 46 52 58 54 C76 58 84 74 84 94 C84 114 68 128 48 128 C34 128 22 122 16 108"],
      "6": ["M72 16 C54 24 26 50 18 86 C12 112 28 128 50 128 C72 128 84 112 84 92 C84 72 70 60 52 60 C36 60 22 72 18 88"],
      "7": ["M16 14 L84 14 L40 128"],
      "8": ["M50 70 C28 70 20 56 20 42 C20 24 34 12 50 12 C66 12 80 24 80 42 C80 56 72 70 50 70 C26 70 16 86 16 102 C16 118 30 128 50 128 C70 128 84 118 84 102 C84 86 74 70 50 70"],
      "9": ["M50 12 C30 12 18 26 18 44 C18 62 32 76 50 76 C68 76 82 62 82 44 C82 26 70 12 50 12", "M82 44 C82 84 76 114 58 128 C48 134 36 130 26 122"]
    };
    let numTok = 0;
    let numState = null;
    const stillParam = new URLSearchParams(location.search).has("still");   // til test: vis tallet færdigskrevet

    function numberSvg(n) {
      const ds = String(n).split("");
      const vbW = ds.length * 100 + (ds.length - 1) * 24;
      const strokes = [];
      ds.forEach((d, i) => DIGITS[d].forEach(p => strokes.push({ d: p, x: i * 124 })));
      const svg = $("#numsvg");
      svg.setAttribute("viewBox", `0 0 ${vbW} 140`);
      svg.style.setProperty("--vbw", vbW);
      svg.classList.remove("done");
      svg.innerHTML = strokes.map(s => `<path class="ghost" transform="translate(${s.x} 0)" d="${s.d}"/>`).join("")
        + strokes.map(s => `<path class="ink" transform="translate(${s.x} 0)" d="${s.d}"/>`).join("")
        + `<circle class="pen" r="9" cx="-60" cy="-60"/>`;
      return strokes;
    }

    function drawStroke(path, pen, x, dur, tok) {
      return new Promise(res => {
        const len = path.getTotalLength();
        const t0 = performance.now();
        const step = now => {
          if (tok !== numTok) return res(false);
          const k = Math.min(1, (now - t0) / dur);
          const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          path.style.strokeDashoffset = len * (1 - e);
          const p = path.getPointAtLength(len * e);
          pen.setAttribute("cx", p.x + x);
          pen.setAttribute("cy", p.y);
          if (k < 1) requestAnimationFrame(step); else res(true);
        };
        requestAnimationFrame(step);
      });
    }

    // Tallet skrives igen og igen, indtil man trykker
    async function numLoop(n, t, tok) {
      const strokes = numberSvg(n);
      const svg = $("#numsvg"), pen = svg.querySelector(".pen"), inks = [...svg.querySelectorAll(".ink")];
      const word = $("#numword"), box = $("#numitems");
      word.textContent = W[n];
      const showThings = () => {
        word.classList.add("on");
        box.innerHTML = Array.from({ length: n }, (_, i) => `<span style="--k:${i}">${t.e}</span>`).join("");
      };
      if (stillParam || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        inks.forEach(p => { p.style.strokeDasharray = p.getTotalLength(); p.style.strokeDashoffset = 0; });
        pen.style.opacity = 0;
        showThings();
        speak(W[n]);
        return;
      }
      while (tok === numTok) {
        inks.forEach(p => { const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len; });
        svg.classList.remove("done");
        word.classList.remove("on");
        box.innerHTML = "";
        pen.style.opacity = 1;
        pen.setAttribute("cx", -60);
        speak(W[n]);
        await sleep(450);
        for (let i = 0; i < inks.length; i++) {
          if (tok !== numTok) return;
          const dur = Math.max(700, Math.min(1300, inks[i].getTotalLength() * 9));
          sfx.whoosh();
          if (!(await drawStroke(inks[i], pen, strokes[i].x, dur, tok))) return;
          await sleep(220);
        }
        if (tok !== numTok) return;
        pen.style.opacity = 0;
        svg.classList.add("done");
        sfx.clink(n);
        const r = svg.getBoundingClientRect();
        burst(r.left + r.width / 2, r.top + r.height / 2, ["✨", "⭐", "💖"], 12, 150);
        showThings();
        await sleep(3200);
      }
    }

    function openNumber(n, t, v) {
      const tok = ++numTok;
      const pop = $("#numpop");
      numState = { v, at: performance.now() };
      $("#numcard").className = `numcard c${cc(n)}`;
      pop.hidden = false;
      pop.focus({ preventScroll: true });
      stopSpeech();
      numLoop(n, t, tok);
    }

    function closeNumber() {
      const pop = $("#numpop");
      if (pop.hidden || !numState || performance.now() - numState.at < 350) return;
      numTok++;
      pop.hidden = true;
      stopSpeech();
      sfx.pick();
      // Nu fortæller prinsessen, hvad der skal gøres
      if (numState.v === ver) speak(askSpeech);
    }
    $("#numpop").addEventListener("click", closeNumber);

    /* ---------- Lær tallene ---------- */
    function learnView() {
      const stage = scaffold();
      // Tallene går fra 1 og op til det valgte (standard 10, op til 20 i ⚙️)
      const N = S.learnMax;
      const cols = N <= 5 ? N : N <= 10 ? 5 : N <= 16 ? 8 : 10;
      const fs = cols <= 5 ? 9 : cols <= 8 ? 6.6 : 5.4;
      ask("Tryk på et tal 👆", "Tryk på et tal");
      stage.innerHTML = `
        <div class="strip" style="--cols:${cols};--nf:clamp(1.3rem, calc(var(--u) * ${fs}), 5.5rem);--nh:calc(var(--u) * ${N > 5 ? 9.5 : 19})">${Array.from({ length: N }, (_, i) => `<button class="nb c${cc(i + 1)}${i === 0 ? " hint" : ""}" data-n="${i + 1}" type="button">${i + 1}</button>`).join("")}</div>
        <div class="show" id="show"></div>`;
      let current = 0;
      stage.querySelector(".strip").addEventListener("click", e => {
        const b = e.target.closest(".nb");
        if (b) learnPlay(Number(b.dataset.n));
      });
      stage.addEventListener("click", e => {
        if ((e.target.closest(".items") || e.target.closest(".bignum")) && current > 0) learnPlay(current);
      });

      async function learnPlay(n) {
        current = n;
        const v = ++ver;
        stage.querySelectorAll(".nb").forEach(b => { b.classList.remove("hint"); b.classList.toggle("on", Number(b.dataset.n) === n); });
        const t = rnd(THINGS);
        const show = $("#show");
        show.classList.toggle("six", n > 5 && n <= 10);
        show.classList.toggle("many", n > 10);
        const row = items(n, t, { hide: true, tappable: true });
        show.innerHTML = `<div class="showtop"><div class="bignum c${cc(n)}">${n}</div><div class="word c${cc(n)}">${W[n]}</div></div>`;
        show.append(row);
        sfx.note(n);
        if (!(await countAloud(v, row))) return;
        dance(row);
        avatarDo("cheer");
        await speak(phrase(n, t));
      }
    }

    /* ---------- Smykkeskrinet: træk eller tryk smykkerne i skrinet ---------- */
    let mk = null;   // den aktuelle runde
    let drag = null;

    function makeRound() {
      const forced = Number(new URLSearchParams(location.search).get("n")) || 0;   // ?n=7 til test
      const v = ver, n = forced || pick(), t = rnd(THINGS);
      const stage = scaffold();
      ask(`Læg ${chip(n)} ${t.e}`, `Læg ${phrase(n, t)} ${t.where}`, false);
      // Tryk på boblen viser tallet igen
      const again = $("#again"), fresh = again.cloneNode(true);
      again.replaceWith(fresh);
      fresh.addEventListener("click", () => openNumber(n, t, v));
      const trayCount = Math.min(22, n + 2);
      stage.innerHTML = `
        <div class="chest" id="chest" style="--slot:calc(var(--u) * ${n > 10 ? 5.2 : n > 5 ? 7.5 : 12})">
          <div class="lid"></div>
          <div class="box"><div class="slots" style="--cols:${n <= 5 ? n : n <= 10 ? 5 : 10}">${'<div class="slot"></div>'.repeat(n)}</div></div>
        </div>
        <div class="tray" id="tray" style="--it:clamp(2.2rem, calc(var(--u) * ${n > 10 ? 5.5 : n > 5 ? 7.2 : 11}), 7rem)">${Array.from({ length: trayCount }, () => `<button class="gem" type="button" aria-label="${t.sg}">${t.e}</button>`).join("")}</div>`;
      mk = { v, n, t, k: 0, busy: false, slots: [...stage.querySelectorAll(".slot")], chest: $("#chest"), tray: $("#tray") };
      mk.slots[0].classList.add("next");

      // Tryk på et smykke lægger det i skrinet. Kan også trækkes derhen.
      mk.tray.addEventListener("click", e => {
        const g = e.target.closest(".gem");
        if (g && e.detail === 0) place(g, g.getBoundingClientRect());   // tastatur
      });

      // Først vises tallet stort og skrives. Et tryk et vilkårligt sted lukker det, og så begynder legen.
      openNumber(n, t, v);
    }

    document.addEventListener("pointerdown", e => {
      if (!mk || mk.busy || drag || e.target.closest(".drag")) return;
      const g = e.target.closest(".gem");
      if (!g || !mk.tray.contains(g) || g.dataset.used) return;
      e.preventDefault();
      const r = g.getBoundingClientRect();
      const clone = g.cloneNode(true);
      clone.classList.add("drag");
      clone.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;font-size:${r.height * .8}px;`;
      document.body.append(clone);
      g.style.visibility = "hidden";
      drag = { g, clone, id: e.pointerId, ox: e.clientX - r.left, oy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, moved: false, home: r };
      sfx.pick();
    });

    document.addEventListener("pointermove", e => {
      if (!drag || e.pointerId !== drag.id) return;
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 10) drag.moved = true;
      drag.clone.style.left = `${e.clientX - drag.ox}px`;
      drag.clone.style.top = `${e.clientY - drag.oy}px`;
    });

    function endDrag(e, cancelled) {
      if (!drag || e.pointerId !== drag.id) return;
      const d = drag;
      drag = null;
      const box = mk?.chest.getBoundingClientRect();
      const over = box && e.clientX > box.left - 30 && e.clientX < box.right + 30 && e.clientY > box.top - 50 && e.clientY < box.bottom + 30;
      if (!cancelled && mk && !mk.busy && (!d.moved || over)) {
        place(d.g, d.home, d.clone);
        return;
      }
      // Slap uden for skrinet: smykket flyver tilbage
      d.clone.classList.add("snap");
      d.clone.style.left = `${d.home.left}px`;
      d.clone.style.top = `${d.home.top}px`;
      setTimeout(() => { d.clone.remove(); d.g.style.visibility = ""; }, 360);
    }
    document.addEventListener("pointerup", e => endDrag(e, false));
    document.addEventListener("pointercancel", e => endDrag(e, true));

    async function place(g, from, existingClone) {
      if (!mk || mk.busy || g.dataset.used || mk.k >= mk.n) return;
      const round = mk, v = round.v;
      g.dataset.used = "1";
      g.style.visibility = "hidden";
      const slot = round.slots[round.k];
      const sr = slot.getBoundingClientRect();
      const clone = existingClone || (() => {
        const c = g.cloneNode(true);
        c.classList.add("drag");
        c.style.cssText = `left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px;font-size:${from.height * .8}px;`;
        document.body.append(c);
        return c;
      })();
      sfx.whoosh();
      void clone.offsetWidth;
      clone.classList.add("snap");
      clone.style.left = `${sr.left}px`;
      clone.style.top = `${sr.top}px`;
      clone.style.width = `${sr.width}px`;
      clone.style.height = `${sr.height}px`;
      clone.style.fontSize = `${sr.height * .75}px`;
      round.k++;
      const k = round.k;
      round.slots.forEach(s => s.classList.remove("next"));
      if (k < round.n) round.slots[k].classList.add("next");
      round.busy = k >= round.n;
      await sleep(360);
      if (v !== ver) { clone.remove(); return; }
      clone.remove();
      const s = document.createElement("span");
      s.className = "it pop";
      s.textContent = round.t.e;
      slot.append(s);
      slot.style.borderStyle = "solid";
      sfx.clink(k);
      burstEl(slot, ["✨", "💖"], 6, 70);
      speak(W[k]);
      if (k === round.n) {
        await sleep(900);
        if (v !== ver) return;
        round.chest.classList.add("done");
        round.tray.querySelectorAll(".gem").forEach(x => x.classList.add("fade"));
        sfx.chest();
        burstEl(round.chest, ["✨", "💎", "💖", "⭐"], 14, 150);
        await sleep(700);
        if (await reward(v, true, `${phrase(round.n, round.t)}. ${rnd(PRAISE)}`)) makeRound();
      }
    }

    /* ---------- Find tallet: prik den rigtige ballon ---------- */
    function findRound() {
      const v = ver, n = pick(), t = rnd(THINGS), opts = choices(n);
      const stage = scaffold();
      ask(`Find ${chip(n)}`, `Find tallet ${W[n]}`);
      stage.innerHTML = `
        <div class="sky" id="sky">${opts.map((o, i) => `<button class="balloon c${cc(o)}" data-n="${o}" style="--i:${i}" type="button" aria-label="${o}">${o}</button>`).join("")}</div>
        <div class="reveal" id="reveal"></div>`;
      let wrong = 0, locked = false;
      $("#sky").addEventListener("click", async e => {
        const b = e.target.closest(".balloon");
        if (!b || locked) return;
        const m = Number(b.dataset.n);
        if (m !== n) {
          wrong++;
          sfx.oops();
          avatarDo("oops");
          b.classList.remove("wobble");
          void b.offsetWidth;
          b.classList.add("wobble");
          speak(`Det er ${W[m]}. Find ${W[n]}`);
          if (wrong >= 2) $(`.balloon[data-n="${n}"]`).classList.add("hint");
          return;
        }
        locked = true;
        sfx.balloon();
        burstEl(b, ["💖", "✨", "⭐", "🎉"], 14, 150);
        b.classList.remove("hint", "wobble");
        b.classList.add("boom");
        $("#sky").querySelectorAll(".balloon").forEach(o => { if (o !== b) o.classList.add("away"); });
        await sleep(350);
        const row = items(n, t, { hide: true });
        $("#reveal").append(row);
        if (!(await countAloud(v, row))) return;
        dance(row);
        if (await reward(v, wrong === 0, `${phrase(n, t)}. ${rnd(PRAISE)}`)) findRound();
      });
    }

    /* ---------- Hvor mange? Tryk på tingene og tæl ---------- */
    function countRound() {
      const v = ver, n = pick(), t = rnd(THINGS), opts = choices(n);
      const stage = scaffold();
      ask(`Hvor mange ${t.e}?`, `Hvor mange ${t.pl} er der? Tæl med!`);
      const row = items(n, t, { tappable: true });
      stage.innerHTML = `<div class="field" id="field"></div>
        <div class="answers" id="answers">${opts.map(o => `<button class="ans c${cc(o)}" data-n="${o}" type="button" aria-label="${o}">${o}</button>`).join("")}</div>`;
      $("#field").append(row);
      let counted = 0, wrong = 0, busy = false, idle = 0;

      const nudge = () => {
        clearTimeout(idle);
        row.querySelectorAll(".it.hint").forEach(x => x.classList.remove("hint"));
        idle = setTimeout(() => {
          if (v !== ver || busy) return;
          row.querySelector(".it:not([data-c])")?.classList.add("hint");
        }, 4500);
      };
      nudge();

      const mark = (el, i) => {
        el.classList.add("counted");
        el.dataset.c = i;
        el.insertAdjacentHTML("beforeend", `<i>${i}</i>`);
      };

      row.addEventListener("click", e => {
        const el = e.target.closest(".it");
        if (!el || busy || el.dataset.c) return;
        mark(el, ++counted);
        el.classList.remove("hop", "hint");
        void el.offsetWidth;
        el.classList.add("hop");
        sfx.note(counted);
        burstEl(el, ["✨", "💖"], 5, 60);
        speak(W[counted]);
        nudge();
      });

      async function autoCount() {
        row.querySelectorAll(".it").forEach(el => { el.classList.remove("counted", "hint"); delete el.dataset.c; el.querySelector("i")?.remove(); });
        counted = 0;
        for (const el of row.querySelectorAll(".it")) {
          mark(el, ++counted);
          el.classList.remove("hop");
          void el.offsetWidth;
          el.classList.add("hop");
          sfx.note(counted);
          await speak(W[counted]);
          if (v !== ver) return false;
          await sleep(100);
        }
        return true;
      }

      $("#answers").addEventListener("click", async e => {
        const b = e.target.closest(".ans");
        if (!b || busy) return;
        clearTimeout(idle);
        const m = Number(b.dataset.n);
        if (m !== n) {
          wrong++;
          sfx.oops();
          avatarDo("oops");
          b.classList.remove("shake");
          void b.offsetWidth;
          b.classList.add("shake");
          if (wrong === 1) {
            busy = true;
            await speak(`Det er ikke ${W[m]}. Lad os tælle sammen!`);
            if (v !== ver || !(await autoCount())) return;
            busy = false;
          } else {
            speak(`Det er ikke ${W[m]}. Prøv igen`);
            $(`.ans[data-n="${n}"]`).classList.add("hint");
          }
          return;
        }
        busy = true;
        $("#answers").querySelectorAll(".ans").forEach(c => c.classList.remove("hint"));
        b.classList.add("win");
        burstEl(b, ["💖", "✨", "⭐"], 12, 120);
        if (counted < n && !(await autoCount())) return;
        dance(row);
        if (await reward(v, wrong === 0, `${phrase(n, t)}. ${rnd(PRAISE)}`)) countRound();
      });
    }

    /* ---------- Start ---------- */
    Topbar.init({ kid: "riyana", controls: [$("#settings")] });

    function begin() {
      started = true;
      audioOk();
      $("#start").hidden = true;
      go(MODE);
    }
    $("#start").addEventListener("click", () => { sfx.giggle(); begin(); });
    // ?start springer startskærmen over (bruges til test)
    if (new URLSearchParams(location.search).has("start")) begin();
  </script>
</body>
