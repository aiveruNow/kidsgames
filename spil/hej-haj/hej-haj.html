<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f6c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hej Haj">
  <title>Hej Haj – Havet</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-synthesis: none;
      --ink: #2b2250;
      --soft: #7a6fa3;
      --gold: #f5b83d;
      --tamil: "Noto Sans Tamil", "Nirmala UI", "Latha", "Tamil Sangam MN", "Trebuchet MS", sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      height: 100vh;
      height: 100dvh;
      height: var(--app-h, 100dvh);
      min-width: 320px;
      margin: 0;
      overflow-y: auto;
      overscroll-behavior: none;
      color: var(--ink);
      background: #0b4f6c;
      -webkit-user-select: none;
      user-select: none;
    }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 6px #f5b83d99; }
    .ta { font-family: var(--tamil); }
    #bg { position: fixed; inset: 0; z-index: 0; background: center / cover no-repeat #0b4f6c; }

    .app { position: relative; z-index: 1; height: 100%; padding: calc(var(--tb-h, 54px) + 6px) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); overflow: hidden; }
    .screen { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

    .btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 8px 24px; border: 2px solid #ffffff55; border-radius: 20px; background: linear-gradient(#ffd54f, #ffb300); color: #4a2f00; font-size: 1.2rem; font-weight: 900; letter-spacing: .01em; box-shadow: 0 5px 0 #c98600, 0 12px 20px #0004; transition: transform .12s, box-shadow .12s, filter .12s; }
    .btn::after { content: ""; position: absolute; inset: 0 0 50% 0; background: linear-gradient(#ffffff59, #ffffff00); pointer-events: none; }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c98600, 0 4px 8px #0004; }
    .btn.green { background: linear-gradient(#7be08a, #2fb34e); color: #07350f; box-shadow: 0 5px 0 #1d8a37, 0 12px 20px #0004; }
    .btn.green:active { box-shadow: 0 1px 0 #1d8a37, 0 4px 8px #0004; }
    .btn.ghost { background: #0000004d; color: #fff; box-shadow: none; border: 2px solid #ffffff59; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .btn.ghost::after { display: none; }
    .btn.ghost:active { transform: scale(.98); background: #00000080; }
    .btn.big { min-height: 70px; font-size: 1.6rem; padding: 10px 36px; border-radius: 24px; }
    .back { flex: none; width: 46px; height: 46px; border: 2px solid #ffffff3d; border-radius: 15px; background: #0000004d; color: #fff; font-size: 1.5rem; font-weight: 900; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .back:active { background: #0000008c; transform: scale(.94); }

    /* Billeder. --ps er billedets størrelse */
    .pbox { container-type: inline-size; display: grid; place-items: center; aspect-ratio: 1; width: 100%; }
    .pbox > .pic { --ps: 90cqw; }
    .pic { width: var(--ps); height: var(--ps); display: grid; place-items: center; line-height: 1; }
    .pic svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 2px 2px #0002); }

    /* Forside */
    #home { align-items: center; padding-top: 10px; padding-bottom: 6px; }
    .hero { display: flex; align-items: center; gap: 14px; flex: none; margin-top: 2px; }
    .mascot { width: clamp(110px, 24vh, 170px); flex: none; padding: 0; border: 0; background: none; animation: bob 2.6s ease-in-out infinite; filter: drop-shadow(0 10px 14px #0006); }
    .mascot svg { width: 100%; height: auto; display: block; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
    .hero h1 { margin: 0; color: #fff; font-size: clamp(2.4rem, 10vw, 3.4rem); letter-spacing: -.02em; line-height: 1; text-shadow: 0 3px 0 #0006, 0 0 24px #7dd3fc88; }
    .hero .sub { margin: 4px 0 0; color: #ffe9a8; font-size: 1.2rem; font-weight: 800; text-shadow: 0 2px 0 #0005; }
    .temple { width: min(62vw, 34dvh, 300px); flex: none; filter: drop-shadow(0 10px 14px #0007); animation: glow 3s ease-in-out infinite alternate; opacity: .9; }
    .temple svg { width: 100%; height: auto; display: block; }
    @keyframes glow { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    .homebtns { display: grid; gap: 12px; width: min(100%, 420px); flex: none; }
    .tagline { margin: 0; color: #fff; font-weight: 800; text-align: center; text-shadow: 0 2px 0 #0006; }

    /* Ordbog */
    .head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 12px; flex: none; padding: 4px 0 6px; color: #fff; background: linear-gradient(#06384ee6, #06384e00); }
    .head h2 { margin: 0; font-size: clamp(1.4rem, 5vw, 2rem); text-shadow: 0 2px 0 #0005; }
    .head .tn { font-size: 1.05rem; font-weight: 700; color: #ffe9a8; }
    .dict { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; padding: 2px 2px 14px; }
    .card-w { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 0; padding: 8px 4px; border: 0; border-radius: 20px; background: #fffdf5; box-shadow: 0 0 0 2px #ffffff80, 0 4px 0 #0005; text-align: center; }
    .card-w:active { transform: translateY(2px); }
    .card-w .pbox { width: 72%; }
    .card-w .t { font-family: var(--tamil); font-size: 1.2rem; font-weight: 800; line-height: 1.25; }
    .card-w .r { font-size: .85rem; color: var(--soft); font-weight: 700; }
    .card-w .d { font-size: .8rem; color: #9b92bb; }
    .card-w .medal { position: absolute; top: 5px; right: 6px; display: flex; gap: 2px; }
    .medal i { width: 10px; height: 10px; border-radius: 50%; background: #d8d2e8; }
    .medal i.on { background: #f5b83d; box-shadow: 0 0 0 1px #b57b05; }
    .card-w.unseen { background: #00000040; box-shadow: none; min-height: 118px; }
    .card-w.unseen .q { display: grid; place-items: center; flex: 1; color: #fff9; font-size: 2.4rem; font-weight: 900; }

    /* Banen */
    #play { position: relative; gap: 0; overflow: hidden; }
    .hud { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 6; display: flex; align-items: center; gap: 10px; padding: 0; color: #fff; pointer-events: none; }
    .hud .back { width: 40px; height: 40px; font-size: 1.3rem; pointer-events: auto; }
    .hud .title { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 14px; background: #0000004d; font-size: 1.05rem; font-weight: 900; white-space: nowrap; text-shadow: 0 2px 0 #0006; }
    .prog { position: relative; flex: 1; min-width: 60px; height: 26px; border-radius: 999px; background: #0000004d; box-shadow: inset 0 0 0 2px #ffffff40; overflow: hidden; }
    .prog i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(#ffe08a, #f5b83d); transition: width .3s; }
    .prog span { position: absolute; inset: 0; display: grid; place-items: center; font-size: .85rem; font-weight: 900; color: #fff; text-shadow: 0 1px 2px #000a; font-variant-numeric: tabular-nums; }
    .pips { display: flex; gap: 2px; padding: 4px 8px; border-radius: 12px; background: #0000004d; }
    .pips svg { width: 20px; height: 20px; transition: opacity .3s, filter .3s; }
    .pips svg.off { opacity: .25; filter: grayscale(1); }
    #stage { position: relative; flex: 1; min-height: 0; touch-action: none; border-radius: 0; background: linear-gradient(#38bdf8, #1c88b8 45%, #0a4466); overflow: hidden; }
    #cv { position: absolute; inset: 0; display: block; }
    #startHint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 10px 22px; border-radius: 999px; background: linear-gradient(#ffe08a, #f5b83d); color: #4a2f00; font-weight: 900; white-space: nowrap; box-shadow: 0 5px 0 #b57b05, 0 10px 18px #0005; pointer-events: none; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .85; } 50% { opacity: 1; transform: translateX(-50%) scale(1.06); } }
    /* Under spillet fylder banen hele skærmen under topbaren (ingen ramme). Den er fast placeret (samme koordinater som baggrunden),
       så den også rækker helt ned på iPhone, hvor sidens højde ellers kan afvige fra det synlige. */
    body.playing .app { padding: 0; }
    body.playing #play { position: fixed; left: 0; right: 0; top: var(--tb-h, 54px); bottom: 0; height: auto; padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left); z-index: 1; }
    @media (max-width: 520px) {
      .hud { gap: 6px; }
      #startHint { font-size: .9rem; padding: 8px 16px; }
    }

    /* Ordkort, der dukker op under spillet */
    #wordPop { position: absolute; left: 50%; top: 58px; z-index: 5; display: flex; align-items: center; gap: 10px; max-width: calc(100% - 16px); min-width: 0; padding: 6px 16px 6px 8px; border: 3px solid var(--gold); border-radius: 22px; background: #fffdf5f2; box-shadow: 0 8px 20px #0006; color: var(--ink); pointer-events: none; transform: translateX(-50%); animation: popin .3s cubic-bezier(.2, 1.5, .4, 1); }
    #wordPop .pbox { width: 52px; flex: none; }
    #wordPop > div { min-width: 0; }
    #wordPop .tw { font-family: var(--tamil); font-size: 1.7rem; font-weight: 800; line-height: 1.2; }
    #wordPop .rm { display: block; font-size: .85rem; font-weight: 800; color: var(--soft); line-height: 1; }
    @keyframes popin { from { transform: translateX(-50%) translateY(-20px) scale(.85); opacity: 0; } }
    .mute-note { margin: 0; padding: 4px 12px; border-radius: 999px; background: #fff1c9; color: #7a4a00; box-shadow: inset 0 0 0 2px #f1d58a; font-size: .9rem; font-weight: 800; text-align: center; }
    .badge { display: inline-block; margin-bottom: 2px; padding: 1px 10px; border-radius: 999px; background: #dbeafe; color: #1e40af; font-size: .72rem; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; }
    .badge.new { background: #dcfce7; color: #166534; }

    /* Popups: pergamentkort med guldramme */
    .overlay { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: calc(var(--tb-h, 54px) + 10px) 10px 10px; background: radial-gradient(ellipse at 50% 40%, #04243688, #02101acc); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fadein .25s ease; }
    @keyframes fadein { from { opacity: 0; } }
    .card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(100%, 560px); max-height: 100%; padding: 18px 16px 16px; overflow-y: auto; border-radius: 32px; background: linear-gradient(#fffdf6, #fdf0cf); box-shadow: 0 0 0 4px #f5b83d, 0 0 0 7px #8a5a0f55, 0 24px 60px #000a, inset 0 2px 0 #fff; animation: rise .35s cubic-bezier(.2, 1.4, .4, 1); }
    .card::before { content: ""; position: absolute; left: 50%; top: -9px; width: 76px; height: 14px; border-radius: 999px; transform: translateX(-50%); background: linear-gradient(#ffe08a, #f5b83d); box-shadow: 0 2px 0 #b57b05; }
    @keyframes rise { from { transform: translateY(30px) scale(.9); opacity: 0; } }
    .card h3 { margin: 0; color: #5a3410; font-size: 1.55rem; letter-spacing: .01em; text-align: center; }
    .card > * { max-width: 100%; min-width: 0; }
    .why { display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 8px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 2px #f1d58a; font-size: .98rem; font-weight: 800; line-height: 1.25; color: #6b3a10; overflow-wrap: anywhere; }
    .why svg { width: 54px; height: 40px; flex: none; }
    .wordbtn { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 220px; max-width: 100%; padding: 8px 30px 12px; border: 0; border-radius: 26px; background: linear-gradient(#fff8d8, #ffe08a); box-shadow: 0 6px 0 #d6a93a, 0 14px 24px #0003, inset 0 2px 0 #fff; }
    .wordbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d6a93a, 0 4px 10px #0003; }
    .wordbtn .row { display: flex; align-items: center; gap: 12px; max-width: 100%; min-width: 0; }
    .wordbtn .spk { width: 30px; height: 30px; flex: none; animation: wiggle 1.2s ease-in-out infinite; }
    .wordbtn .tw { flex: 0 1 auto; padding-bottom: 2px; font-family: var(--tamil); font-size: clamp(2.4rem, 11vw, 3.8rem); font-weight: 800; line-height: 1.5; }
    .wordbtn .rm { margin-top: 2px; padding: 1px 12px; border-radius: 999px; background: #ffffffa6; font-size: 1.05rem; font-weight: 800; color: #8a6a12; }
    .wordbtn .tw.long { font-size: clamp(1.9rem, 9vw, 3rem); }
    .wordbtn .tw.xlong { font-size: clamp(1.5rem, 7vw, 2.4rem); }
    .card-w .t.long { font-size: .95rem; }
    .card-w .t.xlong { font-size: .78rem; }
    .mcard .t.long { font-size: clamp(1rem, 4vw, 1.4rem); }
    .mcard .t.xlong { font-size: clamp(.85rem, 3.4vw, 1.15rem); }
    #wordPop .tw.long { font-size: 1.35rem; }
    #wordPop .tw.xlong { font-size: 1.1rem; }
    @keyframes wiggle { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-12deg) scale(1.1); } 40% { transform: rotate(10deg) scale(1.1); } 60% { transform: rotate(0); } }
    .banner { min-height: 2em; padding: 2px 14px; font-size: 1.3rem; font-weight: 900; text-align: center; color: #2fb34e; overflow-wrap: anywhere; }
    .banner.bad { color: #b3261e; }
    .banner .tw { font-family: var(--tamil); }
    .banner:not(:empty) { border-radius: 999px; background: #e9ffee; box-shadow: inset 0 0 0 2px #8be0a0; animation: rise .3s cubic-bezier(.2, 1.4, .4, 1); }
    .banner.bad:not(:empty) { background: #fff0ee; box-shadow: inset 0 0 0 2px #ffb4ab; }
    .choices { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 12px; width: min(100%, 56dvh, max(190px, calc(100dvh - 370px))); }
    .choices.n3 { width: min(100%, 90dvh); }
    .tile { position: relative; container-type: inline-size; display: grid; place-items: center; aspect-ratio: 1; padding: 0; border: 0; border-radius: 26px; background: linear-gradient(#ffffff, #fbf1d6); box-shadow: 0 0 0 3px #e6d6a3, 0 7px 0 #d3bd7c, 0 14px 22px #0002; transition: transform .2s, opacity .3s; }
    .tile .pic { --ps: 78cqw; }
    .tile:active { transform: translateY(5px); box-shadow: 0 0 0 3px #e6d6a3, 0 2px 0 #d3bd7c; }
    .tile.right { background: linear-gradient(#e9ffee, #bff2cb); box-shadow: 0 0 0 4px #2fb34e, 0 7px 0 #1d8a37, 0 0 28px #2fb34e88; animation: yes .7s ease; }
    .tile.wrong { background: #fff1f0; box-shadow: 0 0 0 4px #ff8a80, 0 7px 0 #d9645a; animation: no .45s ease; }
    .tile.dim { opacity: .3; }
    .tile:disabled { cursor: default; }
    @keyframes yes { 0% { transform: scale(1); } 40% { transform: scale(1.12) rotate(-3deg); } 70% { transform: scale(1.06) rotate(3deg); } 100% { transform: scale(1.05); } }
    @keyframes no { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 50% { transform: translateX(8px); } 80% { transform: translateX(-4px); } }

    .mcards { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; justify-content: center; }
    .mcard { flex: 1 1 0; max-width: 190px; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 10px 6px 12px; border: 0; border-radius: 24px; background: linear-gradient(#fff, #fbf3dc); box-shadow: 0 0 0 3px #e6d6a3, 0 6px 0 #d3bd7c, 0 12px 18px #0002; text-align: center; animation: rise .4s cubic-bezier(.2, 1.4, .4, 1) both; }
    .mcard:nth-child(2) { animation-delay: .06s; }
    .mcard:nth-child(3) { animation-delay: .12s; }
    .mcard:nth-child(4) { animation-delay: .18s; }
    .mcard.on { background: linear-gradient(#fffbe6, #ffefb0); box-shadow: 0 0 0 4px #ffb300, 0 6px 0 #c98600, 0 0 26px #ffb30088; }
    .mcards.many .mcard { flex: 1 1 calc(50% - 10px); max-width: 170px; }
    .mcards.many .mcard .pbox { width: 62%; }
    .mcards.many .mcard .t { font-size: clamp(1.1rem, 4.4vw, 1.5rem); }
    .mcard .pbox { width: 86%; }
    .mcard .t { font-family: var(--tamil); font-size: clamp(1.3rem, 5vw, 1.9rem); font-weight: 800; line-height: 1.25; }
    .mcard .r { font-size: 1rem; font-weight: 800; color: var(--soft); }
    .mcard .d { font-size: .95rem; color: #9b92bb; font-weight: 700; }
    .hintline { margin: 0; color: var(--soft); font-weight: 700; text-align: center; }

    .doorart { width: 130px; flex: none; animation: glow 2s ease-in-out infinite alternate; }
    .doorart svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 14px #7dd3fc); }
    .stars3 { display: flex; gap: 6px; }
    .stars3 svg { width: clamp(52px, 14vw, 70px); height: auto; opacity: .25; filter: grayscale(1) drop-shadow(0 3px 0 #b57b0555); transform: scale(.6); }
    .stars3 svg.on { opacity: 1; filter: drop-shadow(0 3px 0 #b57b0555); animation: starpop .6s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: var(--d); }
    @keyframes starpop { from { transform: scale(0) rotate(-180deg); } to { transform: scale(1) rotate(0); } }
    .learned { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chip { display: flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0; padding: 4px 16px 4px 6px; border: 0; border-radius: 999px; background: #fff; box-shadow: 0 0 0 2px #e6d6a3, 0 3px 0 #d3bd7c; font-weight: 800; }
    .chip:active { transform: translateY(2px); }
    .chip .pbox { width: 36px; }
    .chip .ta { flex: 0 1 auto; font-size: 1.15rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .petal { position: fixed; top: -30px; z-index: 41; pointer-events: none; border-radius: 50% 0 50% 0; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

    /* Tamilsk tekst må aldrig stikke ud: den holdes på én linje og krympes af fitAll() */
    .card-w .t, .mcard .t, .wordbtn .tw, #wordPop .tw, .chip .ta { display: block; max-width: 100%; min-width: 0; white-space: nowrap; text-align: center; }

    #settings { display: grid; gap: 10px; }
    #settings label { display: grid; gap: 4px; font-weight: 800; color: #27426f; }
    #settings select, #settings button { min-height: 44px; padding: 6px 10px; border: 2px solid #dfe7f3; border-radius: 12px; background: #f7faff; color: #27426f; font: inherit; font-weight: 700; }

    @media (max-width: 380px) { .card { padding: 16px 10px 12px; } .choices { gap: 8px; } .btn { padding: 8px 16px; } .hud .title { padding: 4px 8px; } }
    @media (min-width: 700px) { .card { width: min(100%, 640px); padding: 22px 22px 20px; } .tile { border-radius: 30px; } .mcard .pbox { width: 78%; } .btn { font-size: 1.3rem; } }
    @media (min-width: 1000px) and (min-height: 700px) { .card { width: min(100%, 720px); } }
    @media (orientation: landscape) and (max-height: 560px) {
      #home { flex-direction: row; flex-wrap: wrap; justify-content: center; align-content: center; gap: 8px 22px; }
      .temple { display: none; }
      .mascot { width: 100px; }
      .hero h1 { font-size: 1.9rem; }
      .tagline { display: none; }
      .card { padding: 10px 12px; gap: 6px; border-radius: 26px; }
      .card::before { display: none; }
      .card h3 { font-size: 1.2rem; }
      .card.quiz { flex-direction: row; flex-wrap: nowrap; justify-content: center; align-items: center; width: min(100%, 900px); padding: 10px 14px; gap: 6px 16px; }
      .card.quiz .left { display: flex; flex-direction: column; align-items: center; flex: 1 1 250px; max-width: 360px; min-width: 0; gap: 6px; }
      .card.quiz .why { font-size: .82rem; }
      .card.quiz .banner { font-size: 1.05rem; min-height: 1.6em; }
      .why { padding: 4px 12px 4px 6px; }
      .why svg { width: 44px; height: 32px; }
      .choices, .choices.n3 { grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); width: auto; flex: 0 1 430px; min-width: 0; gap: 8px; }
      .choices.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .choices.n2 { flex-basis: 280px; }
      .tile { border-radius: 18px; }
      .wordbtn { min-width: 0; padding: 4px 18px 6px; }
      .wordbtn .tw { font-size: 2.4rem; }
      .mcards { gap: 8px; }
      .mcard { padding: 4px 4px 6px; }
      .mcard .pbox { width: min(78%, 22dvh); }
      .mcard .t { font-size: 1.4rem; }
      .hintline { display: none; }
      .btn.big { min-height: 56px; font-size: 1.3rem; }
      .doorart { width: 80px; }
    }
    @media (prefers-reduced-motion: reduce) { .mascot, .wordbtn .spk, .temple, .doorart, #startHint, .overlay, .card, .mcard, .banner, .tile, .stars3 svg.on { animation: none !important; } }
  </style>
</head>
<body>
  <div id="bg"></div>
  <main class="app">
    <section class="screen" id="home">
      <div class="hero">
        <button class="mascot" id="mascot" type="button" aria-label="Haj"></button>
        <div>
          <h1>Hej Haj</h1>
          <p class="sub">Spis de små. Flygt fra de store.</p>
        </div>
      </div>
      <div class="temple" id="temple"></div>
      <p class="tagline">Svøm rundt i det sunkne tempel, og lær tamilsk!</p>
      <div class="homebtns">
        <button class="btn green big" id="playBtn" type="button">▶ Spil</button>
        <button class="btn ghost" id="dictBtn" type="button">Min ordbog <span id="dictCount"></span></button>
      </div>
    </section>

    <section class="screen" id="dictScreen" hidden>
      <div class="head">
        <button class="back" id="dictBack" type="button" aria-label="Tilbage">←</button>
        <div><h2>Min ordbog</h2><div class="tn" id="dictSub"></div></div>
      </div>
      <div class="dict" id="dictBody"></div>
    </section>

    <section class="screen" id="play" hidden>
      <div class="hud">
        <button class="back" id="playBack" type="button" aria-label="Tilbage">←</button>
        <div class="title"><span id="playTitle"></span></div>
        <div class="prog" id="prog" aria-hidden="true"><i id="progFill"></i><span id="progText"></span></div>
        <div class="pips" id="pips" aria-hidden="true"></div>
      </div>
      <div id="stage"><canvas id="cv"></canvas><div id="wordPop" hidden></div><div id="startHint" hidden>Træk op og ned for at svømme!</div></div>
    </section>
  </main>

  <div class="overlay" id="meet" hidden>
    <div class="card">
      <h3 id="meetTitle">Nye ord!</h3>
      <div class="mcards" id="meetCards"></div>
      <p class="mute-note" id="meetNote" hidden></p>
      <p class="hintline">Tryk på et ord for at høre det igen.</p>
      <button class="btn green" id="meetGo" type="button">Lad os svømme! ▶</button>
    </div>
  </div>

  <div class="overlay" id="quiz" hidden>
    <div class="card quiz">
      <div class="left">
        <div class="why"><span id="quizIcon"></span><span id="quizWhy"></span></div>
        <button class="wordbtn" id="quizWord" type="button" aria-label="Hør ordet igen">
          <span class="row"><svg class="spk" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9z" fill="#8a6a12"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="#8a6a12" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span class="tw" id="quizTa"></span></span>
          <span class="rm" id="quizRom"></span>
        </button>
        <div class="banner" id="quizBanner"></div>
        <p class="mute-note" id="quizNote" hidden></p>
        <button class="btn" id="quizRetry" type="button" hidden>↻ Prøv banen igen</button>
      </div>
      <div class="choices" id="quizChoices"></div>
    </div>
  </div>

  <div class="overlay" id="done" hidden>
    <div class="card">
      <div class="doorart" id="doneArt"></div>
      <h3 id="doneTitle">Hajen er blevet stor!</h3>
      <div class="stars3" id="doneStars"></div>
      <div class="learned" id="doneWords"></div>
      <div class="actions">
        <button class="btn green" id="doneNext" type="button">Næste bane ▶</button>
        <button class="btn ghost" id="doneHome" type="button" style="color:#6b3a10;border-color:#d8c690;background:#fff6">Hjem</button>
      </div>
    </div>
  </div>

  <div id="settings" hidden>
    <label>Styring
      <select id="optControl">
        <option value="tryk">Tryk: hold for at stige, slip for at synke</option>
        <option value="traek">Træk: fingeren op og ned</option>
      </select>
    </label>
    <label>Fart
      <select id="optSpeed">
        <option value="rolig">Rolig</option>
        <option value="normal">Normal</option>
        <option value="hurtig">Hurtig</option>
      </select>
    </label>
    <label>Antal billeder i spørgsmål
      <select id="optChoices">
        <option value="auto">Automatisk (starter med 2)</option>
        <option value="2">Altid 2</option>
        <option value="3">Altid 3</option>
        <option value="4">Altid 4</option>
      </select>
    </label>
    <label>Udtale med latinske bogstaver
      <select id="optRom">
        <option value="1">Vis</option>
        <option value="0">Skjul</option>
      </select>
    </label>
    <button id="optReset" type="button">↺ Start forfra fra bane 1</button>
  </div>

  <script src="../../topbar.js"></script>
  <script src="../urundai/ord.js"></script>
  <script src="../urundai/laengder.js"></script>
  <script src="../urundai/billeder.js"></script>
  <script>
  (() => {
    "use strict";
    // Ord, billeder og lydklip er Urundais (samme tamilske ord, samme gentagelse). Ordstatistikken deles med Urundai.
    const R = window.UrundaiOrd;
    const Art = window.UrundaiArt;
    const WORDS = R.words;
    const ALL = Object.keys(WORDS);
    const $ = (id) => document.getElementById(id);
    const kid = "ari";
    const key = (name) => `haj-${kid}-${name}`;
    const WORDS_KEY = `urundai-${kid}-words`;
    const read = (name, fallback) => { try { const v = localStorage.getItem(key(name)); return v === null ? fallback : v; } catch { return fallback; } };
    const write = (name, value) => { try { localStorage.setItem(key(name), String(value)); } catch { /* ingen lagring */ } };
    const readWords = () => { try { return JSON.parse(localStorage.getItem(WORDS_KEY) || "") || {}; } catch { return {}; } };

    const wordState = readWords(); // id -> { box 0-3, seen, ok, bad, t }
    let stars = Number(read("stars", "0")) || 0;
    let nextLevel = Math.max(1, Number(read("level", "1")) || 1);
    let muted = !Topbar.soundOn();
    window.addEventListener("topbar:sound", (e) => { muted = !e.detail.on; if (muted) stopSpeech(); });

    const ws = (id) => wordState[id] || (wordState[id] = { box: 0, seen: false, ok: 0, bad: 0, t: 0 });
    const saveWords = () => { try { localStorage.setItem(WORDS_KEY, JSON.stringify(wordState)); } catch { /* ingen lagring */ } };
    const rnd = (n) => Math.floor(Math.random() * n);
    const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const seenCount = () => ALL.filter((id) => ws(id).seen).length;
    const seenIds = () => ALL.filter((id) => ws(id).seen);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // Gentagelse: ord, barnet er svagest til eller ikke har set længe, trækkes oftest (men altid med tilfældighed)
    function weight(id) {
      const st = ws(id);
      const stale = Math.min(3, (Date.now() - (st.t || 0)) / 600000);
      return Math.max(.6, 4 - st.box) + stale;
    }
    function pickWeighted(ids, n, exclude = []) {
      const pool = ids.filter((id) => !exclude.includes(id));
      const out = [];
      while (out.length < n && pool.length) {
        let r = Math.random() * pool.reduce((s, id) => s + weight(id), 0);
        let k = 0;
        for (; k < pool.length - 1; k++) { r -= weight(pool[k]); if (r <= 0) break; }
        out.push(pool.splice(k, 1)[0]);
      }
      return out;
    }

    const FACT = { rolig: .6, normal: .8, hurtig: 1 };
    let speedKey = FACT[read("fart", "")] ? read("fart", "") : "normal";
    let controlMode = read("styring", "tryk") === "traek" ? "traek" : "tryk";
    const hintText = () => (controlMode === "tryk" ? "Hold fingeren nede for at stige!" : "Træk op og ned for at svømme!");

    // ---------- Tegninger (haj og fisk) ----------
    // Samme former bruges i SVG (forside, popups) og på lærredet. Alt er tegnet med radius 1.
    const SHARK = {
      body: "M1.3 .1C1.1 -.35 .6 -.62 0 -.6C-.4 -.58 -.6 -.3 -.85 -.12L-1.35 -.62L-1.15 0L-1.3 .55L-.85 .14C-.5 .45 .3 .55 .8 .35C1.05 .25 1.2 .2 1.3 .1Z",
      belly: "M1.3 .1C1.2 .2 1.05 .25 .8 .35C.3 .55 -.5 .45 -.85 .14C-.4 .3 .4 .3 1.3 .1Z",
      dorsal: "M.15 -.58L-.3 -1.05L-.45 -.45Z",
      pect: "M.25 .3L-.25 .85L-.35 .28Z"
    };
    const sharkSvg = (id = "s") => `<svg viewBox="-1.5 -1.15 2.9 2.1" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="-.6" x2="0" y2=".5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2f7fc4"/><stop offset="1" stop-color="#5fc0ee"/></linearGradient></defs>` +
      `<path d="${SHARK.dorsal}" fill="#2a6fb0"/><path d="${SHARK.pect}" fill="#2a6fb0"/><path d="${SHARK.body}" fill="url(#${id})" stroke="#1f5a92" stroke-width=".05" stroke-linejoin="round"/>` +
      `<path d="${SHARK.belly}" fill="#f4fbff"/><circle cx=".8" cy="-.12" r=".12" fill="#fff"/><circle cx=".83" cy="-.12" r=".065" fill="#12263a"/>` +
      `<path d="M1.27 .13Q.95 .32 .6 .22" fill="none" stroke="#12263a" stroke-width=".04" stroke-linecap="round"/><path d="M.5 -.25Q.46 -.1 .5 .05M.38 -.26Q.34 -.1 .38 .04" fill="none" stroke="#1f5a92" stroke-width=".03" stroke-linecap="round"/></svg>`;
    const fishSvg = (color, angry) => `<svg viewBox="-1.7 -.95 3 1.9" aria-hidden="true"><path d="M-.75 0L-1.55 -.6Q-1.3 0 -1.55 .6Z" fill="${Art.dark(color, .2)}"/><ellipse rx="1" ry=".66" fill="${color}" stroke="${Art.dark(color, .35)}" stroke-width=".05"/><path d="M-.2 -.62Q.1 -1 .4 -.56Z" fill="${Art.dark(color, .2)}"/><circle cx=".5" cy="-.14" r=".2" fill="#fff"/><circle cx=".55" cy="-.14" r=".1" fill="#12263a"/>` +
      (angry ? `<path d="M.22 -.45L.78 -.28" stroke="#12263a" stroke-width=".1" stroke-linecap="round"/><path d="M.98 .06Q.7 .4 .3 .22" fill="none" stroke="#12263a" stroke-width=".07" stroke-linecap="round"/><path d="M.86 .16L.78 .3L.7 .2ZM.6 .22L.52 .34L.44 .22Z" fill="#fff"/>` : `<path d="M.9 .1Q.7 .3 .5 .2" fill="none" stroke="#12263a" stroke-width=".05" stroke-linecap="round"/>`) + `</svg>`;
    $("mascot").innerHTML = sharkSvg("sm");

    // ---------- Billeder til ordene ----------
    function pic(id) {
      const p = WORDS[id].pic;
      const el = document.createElement("div");
      el.className = "pic";
      if (p.color) el.innerHTML = Art.swatch(p.color);
      else if (p.count) el.innerHTML = Art.get(`n${p.count}`);
      else el.innerHTML = Art.get(p.art);
      return el;
    }
    function picBox(id) {
      const box = document.createElement("div");
      box.className = "pbox";
      box.append(pic(id));
      return box;
    }
    const starSvg = (cls = "") => `<svg class="${cls}" viewBox="0 0 100 96" aria-hidden="true"><polygon points="50,4 62,36 96,37 69,58 79,91 50,72 21,91 31,58 4,37 38,36" fill="#ffc933" stroke="#e08a00" stroke-width="5" stroke-linejoin="round"/></svg>`;
    // Lange tamilske ord får mindre skrift, så de kan være i kortene
    const lenCls = (txt) => (txt.length >= 11 ? "xlong" : txt.length >= 8 ? "long" : "");
    // Krymper tamilsk tekst, til den passer i sin ramme (aldrig ud over kanten)
    const FIT = ".card-w .t, .mcard .t, .wordbtn .tw, #wordPop .tw, .chip .ta";
    function fitAll() {
      for (const el of document.querySelectorAll(FIT)) {
        el.style.fontSize = "";
        if (!el.clientWidth) continue; // skjult
        let fs = parseFloat(getComputedStyle(el).fontSize);
        for (let i = 0; i < 30 && el.scrollWidth > el.clientWidth + 1 && fs > 10; i++) {
          fs *= .92;
          el.style.fontSize = `${fs.toFixed(1)}px`;
        }
      }
    }
    const fitSoon = () => { fitAll(); requestAnimationFrame(fitAll); setTimeout(fitAll, 250); };
    window.addEventListener("resize", fitSoon);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSoon);

    // ---------- Lyd ----------
    // Mobiler tillader kun lyd, hvis afspilleren er "låst op" af en berøring. Afvises et klip alligevel, gemmes det og spilles ved næste tryk.
    const clip = new Audio();
    clip.preload = "auto";
    const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
    let speechToken = 0;
    let speechDone = null;
    let unlocked = false;
    let pendingSpeech = null;
    function setNote(text) {
      for (const id of ["quizNote", "meetNote"]) {
        const el = $(id);
        if (el) { el.textContent = text; el.hidden = !text; }
      }
    }
    const refreshNote = () => setNote(muted ? "🔇 Lyden er slået fra. Slå den til i ⚙️." : pendingSpeech ? "🔈 Tryk på skærmen for at høre ordet." : "");
    function unlockAudio() {
      if (unlocked) return;
      unlocked = true;
      audio();
      try {
        clip.src = SILENT;
        const p = clip.play();
        if (p && p.catch) p.catch((err) => { if (err && err.name === "NotAllowedError") unlocked = false; });
      } catch { unlocked = false; }
    }
    function stopSpeech() {
      speechToken++;
      clip.onended = null;
      clip.onerror = null;
      clip.onplaying = null;
      clip.pause();
      if (speechDone) { const d = speechDone; speechDone = null; d(false); }
    }
    // Svarer true, når klippet er spillet til ende, og false, hvis noget andet afbrød det eller afspilningen blev afvist
    function speak(id) {
      stopSpeech();
      const token = speechToken;
      return new Promise((resolve) => {
        let finished = false;
        let safety = 0;
        let endTimer = 0;
        const finish = (ok) => {
          if (finished) return;
          finished = true;
          clearTimeout(safety);
          clearTimeout(endTimer);
          if (speechDone === done) speechDone = null;
          resolve(ok && token === speechToken);
        };
        const done = (ok) => finish(ok);
        speechDone = done;
        if (muted) { setTimeout(() => finish(true), 500); return; }
        clip.onended = () => finish(true);
        clip.onerror = () => setTimeout(() => finish(true), 300);
        // Stemmen lægger stilhed efter ordet: gå videre, så snart ordet er sagt
        const len = (window.UrundaiLaengder || {})[id];
        clip.onplaying = () => {
          clip.onplaying = null;
          if (len) endTimer = setTimeout(() => { if (token === speechToken) { clip.pause(); finish(true); } }, (len + .25) * 1000);
        };
        clip.src = `../urundai/lyd/${id}.mp3`;
        const p = clip.play();
        if (p && p.catch) {
          p.catch((err) => {
            if (token !== speechToken) return; // et nyt klip afbrød dette
            if (err && err.name === "NotAllowedError") { unlocked = false; pendingSpeech = id; refreshNote(); finish(false); } else setTimeout(() => finish(true), 300);
          });
        }
        if (pendingSpeech === id) { pendingSpeech = null; refreshNote(); }
        safety = setTimeout(() => finish(true), 6000);
      });
    }
    for (const ev of ["pointerdown", "touchend", "keydown"]) {
      document.addEventListener(ev, () => {
        unlockAudio();
        if (pendingSpeech) { const id = pendingSpeech; pendingSpeech = null; refreshNote(); speak(id); }
      }, true);
    }
    window.addEventListener("topbar:sound", refreshNote);
    let ac = null;
    function audio() {
      if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; } }
      if (ac && ac.state === "suspended") ac.resume();
      return ac;
    }
    function tone(freq, dur = .15, type = "sine", vol = .12, delay = 0, slide = 0) {
      if (muted) return;
      const a = audio();
      if (!a) return;
      const t = a.currentTime + delay;
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(a.destination);
      o.start(t);
      o.stop(t + dur + .03);
    }
    const sfx = {
      eat: () => { tone(420, .09, "square", .06, 0, 500); tone(760, .08, "square", .05, .06); },
      caught: () => { [440, 370, 311, 262, 196, 147].forEach((f, i) => tone(f, .16, "sawtooth", .08, i * .12)); },
      ready: () => { [392, 523, 659, 784].forEach((f, i) => tone(f, .16, "triangle", .08, i * .15)); },
      wrong: () => tone(220, .28, "triangle", .1, 0, -90),
      right: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, "triangle", .12, i * .09)),
      fanfare: () => [523, 659, 784, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .28, "triangle", .13, i * .12)),
      pop: () => { tone(480, .1, "triangle", .12, 0, 380); tone(760, .12, "triangle", .08, .08); }
    };
    const buzz = (ms) => { if (!muted && navigator.vibrate) navigator.vibrate(ms); };

    // ---------- Skærme ----------
    const SCREENS = ["home", "dictScreen", "play"];
    let screen = "home";
    function show(name) {
      screen = name;
      for (const s of SCREENS) $(s).hidden = s !== name;
      if (name === "play") resize();
      document.body.classList.toggle("playing", name === "play");
    }
    // Urundais junglescene i havfarver: bladene bliver til tang og tempeltårnene til ruiner
    const seaUri = (wide) => `url("${Art.dataUri(Art.scene("#38bdf8", "#0a4466", wide))}")`;
    const paintBg = () => { $("bg").style.backgroundImage = seaUri(innerWidth > innerHeight); };
    paintBg();
    window.addEventListener("resize", paintBg);
    $("temple").innerHTML = Art.gopuram();

    function renderHome() {
      $("playBtn").textContent = nextLevel > 1 ? `▶ Spil · bane ${nextLevel}` : "▶ Spil";
      $("dictCount").textContent = `(${seenCount()}/${ALL.length})`;
    }

    function renderDict() {
      const body = $("dictBody");
      body.replaceChildren();
      for (const id of ALL) {
        const st = ws(id);
        const card = document.createElement("button");
        card.type = "button";
        if (st.seen) {
          card.className = "card-w";
          card.append(picBox(id));
          card.insertAdjacentHTML("beforeend", `<span class="t ${lenCls(WORDS[id].ta)}">${WORDS[id].ta}</span><span class="r rom">${WORDS[id].rom}</span><span class="d">${WORDS[id].da}</span><span class="medal">${[1, 2, 3].map((n) => `<i class="${st.box >= n ? "on" : ""}"></i>`).join("")}</span>`);
          card.addEventListener("click", () => { audio(); speak(id); card.animate([{ transform: "scale(1)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 300 }); });
        } else {
          card.className = "card-w unseen";
          card.innerHTML = `<span class="q">?</span>`;
          card.disabled = true;
        }
        body.append(card);
      }
      $("dictSub").textContent = `${seenCount()} af ${ALL.length} ord`;
      applyRom();
    }

    // ---------- Banen ----------
    const stage = $("stage");
    const cv = $("cv");
    const ctx = cv.getContext("2d");
    let SW = 0;
    let SH = 0;
    let u = 1; // 1 % af den korteste side
    let time = 0;
    let state = "home"; // home, meet, ready, play, dying, quiz, won, done
    let G = null;
    let sh = null;
    let fish = [];
    let particles = [];
    let bubbles = [];
    const pointer = { active: false, y: 0, y0: 0, ty0: 0 };
    const keys = { y: 0, down: new Set() };

    const SMALL_COLORS = ["#ffd54f", "#ff8a65", "#81d4fa", "#a5d6a7", "#f48fb1", "#ce93d8", "#ffcc80", "#80cbc4"];
    const BIG_COLORS = ["#c62828", "#7b1fa2", "#d84315", "#455a64"];
    const R0 = 5.5; // hajens startradius i enheder (1 enhed = 1 % af den korteste side)
    const TOP = 50; // øverste pixels på banen er til HUD'en
    const SHARK_X = .2; // hajen står stille her (andel af bredden), og verden scroller mod venstre
    const sharkRadius = () => R0 * (1 + .5 * G.eaten / G.need) * u;
    let scrollX = 0;
    const GAIN = 1.5; // fingerens lodrette træk ganges, så en hel skærm ikke kræver et helt tommelfingerslag

    function resize() {
      const w = stage.clientWidth;
      // På iPhone kan banen række længere ned end det synlige (værktøjslinjer i Safari), så højden begrænses til det, der kan ses
      const vv = window.visualViewport;
      const visibleBottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
      const h = Math.floor(Math.min(stage.clientHeight, visibleBottom - stage.getBoundingClientRect().top));
      if (!w || h < 80) return;
      if (w === SW && h === SH) return;
      cv.style.height = `${h}px`;
      const first = !SW;
      const ox = SW || w;
      const oy = SH || h;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      SW = w;
      SH = h;
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      u = Math.min(SW, SH) / 100;
      if (!bubbles.length) for (let i = 0; i < 16; i++) bubbles.push({ x: Math.random() * SW, y: Math.random() * SH, r: .4 + Math.random() * 1.2, sp: 3 + Math.random() * 6 });
      if (sh) { sh.x = SW * SHARK_X; sh.y = clamp(sh.y * SH / oy, TOP + sh.R, SH - sh.R); sh.ty = sh.y; }
      for (const f of fish) { f.x *= SW / ox; f.y = clamp(f.y * SH / oy, TOP + f.r, SH - f.r); }
      if (first && G) { sh.R = sharkRadius(); sh.x = SW * SHARK_X; sh.y = sh.ty = (TOP + SH) / 2; fish = []; fillFish(); }
    }

    const fishCounts = () => ({ small: 8, big: Math.min(5, 1 + Math.floor((G.n - 1) / 2)) });
    const homing = () => Math.min(.6, .12 * (G.n - 1));
    // Mere tid på en smal telefonskærm: fiskene er 15 % langsommere, og bane 1 har kun én langsom stor fisk
    const speedFactor = () => FACT[speedKey] * Math.min(1.25, 1 + .03 * (G.n - 1)) * (SW < SH ? .85 : 1);

    // Alle fisk kommer ind fra højre og svømmer mod venstre. spread = fordelt ud over banen ved start (kun til højre for hajen).
    function spawnFish(big, spread) {
      // Store fisk er altid mindst 1,2 × hajens slutstørrelse
      const r = (big ? (1.2 + Math.random() * .3) * R0 * 1.5 : (.45 + Math.random() * .4) * R0 * (1 + .5 * G.eaten / G.need)) * u;
      let f = null;
      for (let tries = 0; tries < 24; tries++) {
        const x = spread ? SW * .45 + Math.random() * SW * .9 : SW + r * 2.4 + Math.random() * 8 * u;
        const y = TOP + r + Math.random() * Math.max(1, SH - TOP - 2 * r);
        f = { x, y, r, face: -1, big, phase: Math.random() * 6.28, freq: 1 + Math.random() * 1.5, amp: (big ? 1.5 : 3.5) * u * Math.random(), speed: (big ? 22 + Math.random() * 11 : 20 + Math.random() * 12) * u, color: big ? BIG_COLORS[rnd(BIG_COLORS.length)] : SMALL_COLORS[rnd(SMALL_COLORS.length)] };
        // to store fisk må ikke ligge oven i hinanden, så der altid er et hul at svømme igennem
        if (!fish.some((o) => o.big && big && Math.abs(o.x - x) < r * 3 && Math.abs(o.y - y) < (o.r + r) * 1.4)) break;
      }
      fish.push(f);
    }
    function fillFish() {
      const c = fishCounts();
      for (let i = 0; i < c.small; i++) spawnFish(false, true);
      for (let i = 0; i < c.big; i++) spawnFish(true, true);
    }

    function loadLevel(n, keepWords, keepReview) {
      const fresh = keepWords || shuffle(ALL.filter((id) => !ws(id).seen)).slice(0, 2);
      G = {
        n, need: Math.min(22, 8 + 2 * n), eaten: 0, caught: 0, grace: 0, wonT: 0, dyT: 0,
        newWords: fresh,
        reviewWords: keepReview || pickWeighted(seenIds(), 2, fresh),
        bigColor: BIG_COLORS[0]
      };
      sh = { x: SW * SHARK_X, y: (TOP + SH) / 2, ty: (TOP + SH) / 2, vy: 0, face: 1, tilt: 0, R: R0 * u, chew: 0 };
      resetActors();
      $("playTitle").textContent = `Bane ${n}`;
      renderFoot();
    }

    function resetActors() {
      sh.x = SW * SHARK_X;
      sh.y = sh.ty = (TOP + SH) / 2;
      sh.vy = 0;
      sh.R = sharkRadius();
      fish = [];
      particles = [];
      fillFish();
      G.grace = 0;
    }

    function startLevel(n) {
      show("play");
      loadLevel(n);
      if (G.newWords.length || G.reviewWords.length) showMeet(G.newWords, G.reviewWords);
      else beginReady();
    }

    function beginReady() {
      state = "ready";
      resize();
      $("startHint").textContent = hintText();
      $("startHint").hidden = false;
      sfx.ready();
      const w = pickWeighted(seenIds(), 1)[0];
      if (w) setTimeout(() => { if (state === "ready") wordPop(w); }, 500);
    }

    // Ordkort under spillet: gentagelse uden at afbryde
    let popTimer = 0;
    function wordPop(id) {
      const el = $("wordPop");
      const w = WORDS[id];
      el.replaceChildren(picBox(id));
      el.insertAdjacentHTML("beforeend", `<div><span class="tw ${lenCls(w.ta)}">${w.ta}</span><span class="rm rom">${w.rom}</span></div>`);
      el.hidden = false;
      el.style.animation = "none";
      void el.offsetWidth;
      el.style.animation = "";
      applyRom();
      ws(id).t = Date.now();
      speak(id);
      clearTimeout(popTimer);
      popTimer = setTimeout(hidePop, 2800);
    }
    function hidePop() { clearTimeout(popTimer); $("wordPop").hidden = true; }

    function renderFoot() {
      const lit = Math.max(0, 3 - G.caught);
      $("pips").innerHTML = [0, 1, 2].map((i) => starSvg(i < lit ? "" : "off")).join("");
      renderProg();
    }
    function renderProg() {
      $("progFill").style.width = `${Math.round(100 * G.eaten / G.need)}%`;
      $("progText").textContent = `🐟 ${G.eaten} / ${G.need}`;
    }

    // ---------- Mød ordene ----------
    let meetToken = 0;
    function showMeet(newIds, reviewIds) {
      state = "meet";
      $("startHint").hidden = true;
      hidePop();
      const ids = [...newIds, ...reviewIds];
      const cards = $("meetCards");
      cards.replaceChildren();
      cards.classList.toggle("many", ids.length > 2);
      const els = ids.map((id) => {
        const w = WORDS[id];
        const c = document.createElement("button");
        c.type = "button";
        c.className = "mcard";
        const isNew = newIds.includes(id);
        c.insertAdjacentHTML("beforeend", `<span class="badge ${isNew ? "new" : ""}">${isNew ? "Nyt" : "Gentag"}</span>`);
        c.append(picBox(id));
        c.insertAdjacentHTML("beforeend", `<span class="t ${lenCls(w.ta)}">${w.ta}</span><span class="r rom">${w.rom}</span><span class="d">${w.da}</span>`);
        c.addEventListener("click", () => { flash(c); speak(id); });
        cards.append(c);
        return c;
      });
      $("meetTitle").textContent = newIds.length ? "Nye ord!" : "Øv ordene igen!";
      const flash = (c) => { els.forEach((e) => e.classList.toggle("on", e === c)); };
      applyRom();
      refreshNote();
      $("meet").hidden = false;
      const token = ++meetToken;
      (async () => {
        await new Promise((r) => setTimeout(r, 450));
        for (let i = 0; i < ids.length && token === meetToken; i++) {
          flash(els[i]);
          const ok = await speak(ids[i]);
          if (!ok || token !== meetToken) return;
          await new Promise((r) => setTimeout(r, 350));
        }
        if (token === meetToken) flash(null);
      })();
    }
    $("meetGo").addEventListener("click", () => {
      meetToken++;
      stopSpeech();
      audio();
      for (const id of [...G.newWords, ...G.reviewWords]) { const st = ws(id); st.t = Date.now(); if (G.newWords.includes(id)) st.seen = true; }
      saveWords();
      $("meet").hidden = true;
      beginReady();
    });

    // ---------- Spillet ----------
    function eat(f) {
      fish.splice(fish.indexOf(f), 1);
      G.eaten++;
      sh.chew = .25;
      burst(f.x, f.y, 10, [f.color, "#fff", "#bae6fd"]);
      sfx.eat();
      buzz(15);
      renderProg();
      if (G.eaten >= G.need) { win(); return; }
      spawnFish(false, false);
      if (G.eaten % 4 === 0) { const w = pickWeighted(seenIds(), 1)[0]; if (w) wordPop(w); }
    }

    function caught(f) {
      state = "dying";
      hidePop();
      stopSpeech();
      G.caught++;
      G.dyT = 0;
      G.bigColor = f.color;
      renderFoot();
      sfx.caught();
      buzz(60);
      burst(sh.x, sh.y, 14, ["#7dd3fc", "#fff"]);
    }

    function win() {
      state = "won";
      hidePop();
      G.wonT = 0;
      sfx.fanfare();
      confetti();
    }

    // To måder at styre på (⚙️): "tryk" = let tyngdekraft, hold fingeren for at stige og slip for at synke (som Big Shark), "traek" = træk op og ned.
    // Hajen står stille i siden og svømmer kun op og ned.
    function moveShark(dt) {
      const floor = SH - sh.R * .7 - 2.6 * u;
      const prev = sh.y;
      if (controlMode === "tryk") {
        const up = pointer.active || keys.y < 0;
        sh.vy += (up ? -80 : 65) * u * dt; // stigning mens man holder, ellers sagte fald
        sh.vy -= sh.vy * 2.2 * dt; // vandmodstand, så det føles blødt
        sh.vy = clamp(sh.vy, -45 * u, 40 * u);
        sh.y += sh.vy * dt;
        if (sh.y < TOP + sh.R) { sh.y = TOP + sh.R; sh.vy = Math.max(0, sh.vy); }
        if (sh.y > floor) { sh.y = floor; sh.vy = Math.min(0, sh.vy); }
        sh.ty = sh.y;
      } else {
        if (pointer.active) sh.ty = sh.ty0 + GAIN * (pointer.y - pointer.y0);
        else if (keys.y) sh.ty += keys.y * 60 * u * dt;
        sh.ty = clamp(sh.ty, TOP + sh.R, SH - sh.R * .7);
        const vmax = 110 * u;
        sh.y = clamp(sh.y + clamp((sh.ty - sh.y) * 12, -vmax, vmax) * dt, TOP + sh.R, SH - sh.R * .7);
        sh.vy = (sh.y - prev) / Math.max(dt, 1e-3);
      }
      sh.tilt += (clamp(sh.vy / (60 * u), -.6, .6) - sh.tilt) * Math.min(1, dt * 8);
    }

    function updateFish(dt) {
      const f0 = speedFactor();
      const h = homing();
      scrollX += 9 * u * f0 * dt;
      for (const f of [...fish]) {
        f.x -= f.speed * f0 * (f.big && G.n === 1 ? .6 : 1) * dt;
        let vy = Math.cos(time * f.freq + f.phase) * f.amp * f.freq;
        if (f.big && h && f.x > sh.x) vy += clamp(sh.y - f.y, -8 * u, 8 * u) * h;
        f.y = clamp(f.y + vy * dt, TOP + f.r * .8, SH - f.r * .8);
        if (f.x < -f.r * 2.6) {
          fish.splice(fish.indexOf(f), 1);
          spawnFish(f.big, false);
        }
      }
    }

    function collide() {
      const sr = sh.R * .8;
      for (const f of [...fish]) {
        const d = Math.hypot(f.x - sh.x, f.y - sh.y);
        const fr = f.r * .75;
        if (f.big) { if (G.grace <= 0 && d < sr + fr * .7) { caught(f); return; } }
        else if (d < sr + fr + sh.R * .45) { eat(f); if (state !== "play") return; }
      }
    }

    function update(dt) {
      time += dt;
      for (const b of bubbles) { b.y -= b.sp * u * dt; b.x -= (state === "play" ? 6 : 1.5) * u * dt; if (b.y < -b.r * u || b.x < -5) { b.y = SH + b.r * u; b.x = SW * (.3 + Math.random() * .8); } }
      for (const p of particles) { p.x += p.vx * u * dt * 6; p.y += p.vy * u * dt * 6; p.vy -= dt * .4; p.life -= dt * 1.4; }
      particles = particles.filter((p) => p.life > 0);
      if (!G || !sh) return;
      sh.R += (sharkRadius() - sh.R) * Math.min(1, dt * 6);
      sh.chew = Math.max(0, sh.chew - dt);
      if (state === "play") {
        G.grace = Math.max(0, G.grace - dt);
        moveShark(dt);
        updateFish(dt);
        collide();
      } else if (state === "ready") {
        if (controlMode !== "tryk") moveShark(dt); // med tyngdekraft hænger hajen stille, til spillet starter
      } else if (state === "dying") {
        G.dyT += dt;
        sh.vy = sh.vy * .9 - 3 * u * dt;
        sh.y += sh.vy * dt;
        if (G.dyT > 1.1) openQuiz();
      } else if (state === "won") {
        G.wonT += dt;
        moveShark(dt);
        scrollX += 9 * u * dt;
        for (const f of fish) { if (f.big) { f.x -= f.speed * 2.5 * dt; f.y -= 6 * u * dt; } }
        if (G.wonT > 2.2) levelDone();
      }
    }

    // ---------- Quiz (når man bliver ædt) ----------
    let quiz = null;
    let lastTarget = null;
    function choiceCount() {
      const v = read("valg", "auto");
      if (v !== "auto") return Number(v);
      return nextLevel <= 1 ? 2 : nextLevel === 2 ? 3 : 4;
    }
    function pickTarget() {
      const known = ALL.filter((id) => ws(id).seen || G.newWords.includes(id));
      let pool = known.length ? known : ALL;
      if (pool.length > 1) pool = pool.filter((id) => id !== lastTarget);
      return pickWeighted(pool, 1)[0] || pool[0];
    }
    // De forkerte billeder er mest ord, barnet har mødt, så det skal kende forskel på dem
    function pickDistractors(target, count) {
      const others = ALL.filter((id) => id !== target);
      const known = shuffle(others.filter((id) => ws(id).seen));
      const unknown = shuffle(others.filter((id) => !ws(id).seen));
      const fromKnown = Math.min(known.length, Math.ceil(count * .7));
      const out = [...known.slice(0, fromKnown), ...unknown.slice(0, count - fromKnown)];
      for (const id of known.slice(fromKnown)) if (out.length < count) out.push(id);
      return out;
    }

    function openQuiz() {
      state = "quiz";
      pointer.active = false;
      $("startHint").hidden = true;
      hidePop();
      const target = pickTarget();
      lastTarget = target;
      const n = Math.min(choiceCount(), ALL.length);
      const options = shuffle([target, ...pickDistractors(target, n - 1)]);
      quiz = { target, options, locked: false, idle: 0 };
      const w = WORDS[target];
      $("quizTa").textContent = w.ta;
      $("quizTa").className = `tw ${lenCls(w.ta)}`;
      $("quizRom").textContent = w.rom;
      $("quizBanner").textContent = "";
      $("quizBanner").className = "banner";
      $("quizRetry").hidden = true;
      $("quizIcon").innerHTML = fishSvg(G.bigColor, true);
      $("quizWhy").textContent = "Du blev ædt af en stor fisk! Svar rigtigt for at svømme videre.";
      const box = $("quizChoices");
      box.replaceChildren();
      box.className = `choices n${n}`;
      box.style.setProperty("--n", n);
      box.style.setProperty("--cols", n === 3 ? 3 : 2);
      for (const id of options) {
        const t = document.createElement("button");
        t.type = "button";
        t.className = "tile";
        t.dataset.id = id;
        t.setAttribute("aria-label", WORDS[id].da);
        t.append(pic(id));
        t.addEventListener("click", () => answer(id, t));
        box.append(t);
      }
      applyRom();
      refreshNote();
      sfx.pop();
      $("quiz").hidden = false;
      setTimeout(() => { if (quiz && quiz.target === target) speak(target); }, 380);
    }

    function record(id, ok) {
      const st = ws(id);
      if (ok) { st.ok++; st.box = Math.min(3, st.box + 1); } else { st.bad++; st.box = Math.max(0, st.box - 1); }
      st.seen = true;
      st.t = Date.now();
      saveWords();
    }

    function answer(id, tile) {
      if (!quiz || quiz.locked) return;
      quiz.locked = true;
      const q = quiz;
      const ok = id === q.target;
      record(q.target, ok);
      const tiles = [...$("quizChoices").children];
      tiles.forEach((t) => { t.disabled = true; });
      if (ok) {
        tile.classList.add("right");
        tiles.forEach((t) => { if (t !== tile) t.classList.add("dim"); });
        const praise = Object.keys(R.praise)[rnd(Object.keys(R.praise).length)];
        $("quizBanner").innerHTML = `<span class="tw">${R.praise[praise].ta}</span> ${R.praise[praise].da}`;
        sfx.right();
        buzz(30);
        const minimum = new Promise((r) => setTimeout(r, 1500));
        const spoken = speak(id).then((done) => (done ? speak(`ros-${praise}`) : false));
        Promise.all([minimum, spoken]).then(() => { if (quiz === q) closeQuiz(true); });
      } else {
        tile.classList.add("wrong");
        tiles.forEach((t) => {
          if (t.dataset.id === q.target) t.classList.add("right");
          else if (t !== tile) t.classList.add("dim");
        });
        const w = WORDS[q.target];
        $("quizBanner").className = "banner bad";
        $("quizBanner").innerHTML = `<span class="tw">${w.ta}</span> = ${w.da}`;
        sfx.wrong();
        speak(id).then((done) => (done ? new Promise((r) => setTimeout(r, 300)).then(() => speak(q.target)) : false));
        $("quizRetry").hidden = false;
      }
    }
    $("quizRetry").addEventListener("click", () => { if (quiz && quiz.locked) closeQuiz(false); });
    $("quizWord").addEventListener("click", () => { audio(); if (quiz) speak(quiz.target); });
    setInterval(() => {
      if (!quiz || quiz.locked || $("quiz").hidden) return;
      if (++quiz.idle >= 9) { quiz.idle = 0; speak(quiz.target); }
    }, 1000);

    function closeQuiz(ok) {
      quiz = null;
      stopSpeech();
      $("quiz").hidden = true;
      if (!ok) { restartLevel(); return; }
      resetActors();
      beginReady();
    }

    // Forkert svar: samme bane forfra, og hajen er lille igen
    function restartLevel() {
      loadLevel(G.n, G.newWords, G.reviewWords);
      beginReady();
    }

    // ---------- Banen er klaret ----------
    function levelDone() {
      state = "done";
      const got = G.caught === 0 ? 3 : G.caught === 1 ? 2 : 1;
      stars += got;
      write("stars", stars);
      Topbar.refreshStars(true);
      nextLevel = G.n + 1;
      write("level", nextLevel);
      $("doneArt").innerHTML = sharkSvg("sd");
      $("doneTitle").textContent = G.caught === 0 ? "Helt perfekt! Hajen er blevet stor!" : "Hajen er blevet stor!";
      const row = $("doneStars");
      row.replaceChildren();
      for (let i = 0; i < 3; i++) {
        const holder = document.createElement("span");
        holder.innerHTML = starSvg(i < got ? "on" : "");
        if (i < got) holder.firstChild.style.setProperty("--d", `${.25 + i * .25}s`);
        row.append(holder.firstChild);
      }
      const words = $("doneWords");
      words.replaceChildren();
      for (const id of G.newWords) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.append(picBox(id));
        chip.insertAdjacentHTML("beforeend", `<span class="ta">${WORDS[id].ta}</span>`);
        chip.addEventListener("click", () => { audio(); speak(id); });
        words.append(chip);
      }
      $("done").hidden = false;
      fitSoon();
    }
    function confetti() {
      const colors = ["#fbbf24", "#f472b6", "#7dd3fc", "#fde047", "#34d399", "#fff"];
      for (let i = 0; i < 30; i++) {
        const s = document.createElement("span");
        const size = 10 + rnd(12);
        s.className = "petal";
        s.style.cssText = `left:${rnd(100)}vw;width:${size}px;height:${size}px;background:${colors[rnd(colors.length)]};animation-duration:${2.2 + Math.random() * 2}s;animation-delay:${Math.random() * .8}s`;
        document.body.append(s);
        setTimeout(() => s.remove(), 5200);
      }
    }
    $("doneNext").addEventListener("click", () => { $("done").hidden = true; startLevel(nextLevel); });
    $("doneHome").addEventListener("click", () => { $("done").hidden = true; goHome(); });

    function goHome() {
      stopSpeech();
      hidePop();
      meetToken++;
      quiz = null;
      $("quiz").hidden = true;
      $("meet").hidden = true;
      $("startHint").hidden = true;
      pointer.active = false;
      state = "home";
      G = null;
      sh = null;
      fish = [];
      renderHome();
      show("home");
    }
    $("playBack").addEventListener("click", goHome);

    // ---------- Tegning ----------
    function burst(x, y, n, colors) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = .4 + Math.random() * 1.2;
        particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - .2, life: 1, c: colors[rnd(colors.length)], s: (.5 + Math.random() * 1.1) * u });
      }
    }

    function drawFish(f) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.scale(f.face, 1);
      const r = f.r;
      const pulse = .5 + .5 * Math.sin(time * 5 + f.phase);
      // Glød: grøn = kan spises, rød = farlig
      const gr = ctx.createRadialGradient(0, 0, r * .5, 0, 0, r * (f.big ? 2.1 + pulse * .3 : 1.7));
      gr.addColorStop(0, f.big ? `rgba(255,40,40,${.28 + .2 * pulse})` : "rgba(120,255,140,.32)");
      gr.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(0, 0, r * 2.4, 0, 6.3);
      ctx.fill();
      ctx.scale(r, r);
      const dark = Art.dark(f.color, .25);
      const wag = Math.sin(time * 9 + f.phase) * .22;
      ctx.lineJoin = "round";
      ctx.fillStyle = dark;
      ctx.save();
      ctx.translate(-.75, 0);
      ctx.rotate(wag);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-.8, -.6); ctx.quadraticCurveTo(-.55, 0, -.8, .6); ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.moveTo(-.2, -.6); ctx.quadraticCurveTo(.1, -1, .4, -.54); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = f.color;
      ctx.strokeStyle = Art.dark(f.color, .35);
      ctx.lineWidth = .05;
      ctx.beginPath();
      ctx.ellipse(0, 0, 1, .66, 0, 0, 6.3);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.28)";
      ctx.beginPath();
      ctx.ellipse(.05, .22, .8, .3, 0, 0, 6.3);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(.5, -.14, .2, 0, 6.3);
      ctx.fill();
      ctx.fillStyle = "#12263a";
      ctx.beginPath();
      ctx.arc(.55, -.14, .1, 0, 6.3);
      ctx.fill();
      ctx.strokeStyle = "#12263a";
      ctx.lineCap = "round";
      if (f.big) {
        ctx.lineWidth = .1;
        ctx.beginPath(); ctx.moveTo(.22, -.45); ctx.lineTo(.78, -.28); ctx.stroke();
        ctx.lineWidth = .07;
        ctx.beginPath(); ctx.moveTo(.98, .06); ctx.quadraticCurveTo(.7, .4, .3, .22); ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.moveTo(.86, .16); ctx.lineTo(.78, .3); ctx.lineTo(.7, .2); ctx.moveTo(.6, .22); ctx.lineTo(.52, .34); ctx.lineTo(.44, .22); ctx.fill();
      } else {
        ctx.lineWidth = .05;
        ctx.beginPath(); ctx.moveTo(.9, .1); ctx.quadraticCurveTo(.7, .3, .5, .2); ctx.stroke();
      }
      ctx.restore();
    }

    const P2 = {};
    const path = (name) => P2[name] || (P2[name] = new Path2D(SHARK[name]));
    function drawShark() {
      const r = sh.R;
      ctx.save();
      ctx.translate(sh.x, sh.y);
      if (state === "dying") { ctx.rotate(G.dyT * 7); ctx.globalAlpha = Math.max(0, 1 - G.dyT / 1.2); }
      ctx.scale(sh.face, 1);
      ctx.rotate(sh.tilt);
      const bite = sh.chew > 0 ? 1 + .12 * Math.sin(sh.chew * 12.6) : 1;
      ctx.scale(r * bite, r);
      ctx.lineJoin = "round";
      ctx.fillStyle = "#2a6fb0";
      ctx.fill(path("dorsal"));
      ctx.fill(path("pect"));
      const g = ctx.createLinearGradient(0, -.6, 0, .5);
      g.addColorStop(0, "#2f7fc4");
      g.addColorStop(1, "#5fc0ee");
      ctx.fillStyle = g;
      ctx.strokeStyle = "#1f5a92";
      ctx.lineWidth = .05;
      ctx.fill(path("body"));
      ctx.stroke(path("body"));
      ctx.fillStyle = "#f4fbff";
      ctx.fill(path("belly"));
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(.8, -.12, .12, 0, 6.3); ctx.fill();
      ctx.fillStyle = "#12263a";
      ctx.beginPath(); ctx.arc(.83, -.12, .065, 0, 6.3); ctx.fill();
      ctx.strokeStyle = "#12263a";
      ctx.lineWidth = .04;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(1.27, .13); ctx.quadraticCurveTo(.95, sh.chew > 0 ? .5 : .32, .6, .22); ctx.stroke();
      ctx.strokeStyle = "#1f5a92";
      ctx.lineWidth = .03;
      ctx.beginPath(); ctx.moveTo(.5, -.25); ctx.quadraticCurveTo(.46, -.1, .5, .05); ctx.moveTo(.38, -.26); ctx.quadraticCurveTo(.34, -.1, .38, .04); ctx.stroke();
      ctx.restore();
    }

    const wrap = (x, w) => ((x % w) + w) % w;
    // Baggrund der scroller mod venstre i flere lag (langsomt langt væk, hurtigere tæt på): ruiner, tang og sand
    function drawFarLayers() {
      const T = 70 * u;
      const cnt = Math.ceil(SW / T) + 2;
      ctx.fillStyle = "rgba(8,64,100,.42)";
      for (let i = 0; i < cnt; i++) {
        const x = wrap(i * T - scrollX * .3, cnt * T) - T;
        const base = SH - 2 * u;
        const tiers = [[26, 5], [21, 5], [16, 5], [11, 4], [6, 4]];
        let y = base;
        for (const [w, h] of tiers) { y -= h * u; ctx.fillRect(x - w * u / 2 + 18 * u, y, w * u, h * u + 1); }
        ctx.beginPath(); ctx.arc(x + 18 * u, y, 3 * u, Math.PI, 0); ctx.fill();
      }
    }
    function drawNearLayers() {
      const S = 17 * u;
      const cnt = Math.ceil(SW / S) + 3;
      ctx.lineCap = "round";
      for (let i = 0; i < cnt; i++) {
        const x = wrap(i * S - scrollX * .8, cnt * S) - S;
        const h = (6 + (i * 37) % 7) * u;
        const sway = Math.sin(time * 1.6 + i) * u * 1.2;
        ctx.strokeStyle = i % 2 ? "#2e9a4f" : "#1f7a3d";
        ctx.lineWidth = u * 1.6;
        ctx.beginPath(); ctx.moveTo(x, SH - 2 * u); ctx.quadraticCurveTo(x + sway, SH - 2 * u - h * .55, x + sway * 1.6, SH - 2 * u - h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + u * 2.2, SH - 2 * u); ctx.quadraticCurveTo(x + u * 2.2 - sway, SH - 2 * u - h * .4, x + u * 2.2 - sway * 1.3, SH - 2 * u - h * .75); ctx.stroke();
      }
      ctx.fillStyle = "#d8b865";
      ctx.beginPath();
      ctx.moveTo(0, SH);
      for (let xx = 0; xx <= SW + 8; xx += 8) ctx.lineTo(xx, SH - 2.6 * u + Math.sin((xx + scrollX * .8) / (9 * u)) * u * .8);
      ctx.lineTo(SW + 8, SH);
      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, SW, SH);
      // Lysstråler, ruiner og bobler
      ctx.save();
      for (let i = 0; i < 3; i++) {
        const x = SW * (.2 + i * .3) + Math.sin(time * .3 + i) * u * 6;
        const g = ctx.createLinearGradient(x, 0, x + SW * .15, SH);
        g.addColorStop(0, "rgba(255,255,255,.16)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + SW * .1, 0); ctx.lineTo(x + SW * .3, SH); ctx.lineTo(x + SW * .1, SH); ctx.fill();
      }
      drawFarLayers();
      ctx.strokeStyle = "rgba(255,255,255,.5)";
      ctx.fillStyle = "rgba(255,255,255,.12)";
      ctx.lineWidth = 1.5;
      for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r * u, 0, 6.3); ctx.fill(); ctx.stroke(); }
      drawNearLayers();
      ctx.restore();
      if (!G || !sh) return;
      for (const f of fish) drawFish(f);
      // Advarsel: en rød pil ved højre kant, før en stor fisk svømmer ind
      for (const f of fish) {
        if (!f.big || f.x < SW + f.r * .6) continue;
        const ex = SW - u * 5;
        const ey = clamp(f.y, TOP + u * 4, SH - u * 6);
        const pulse = .6 + .4 * Math.sin(time * 10);
        ctx.save();
        ctx.translate(ex, ey);
        ctx.scale(-1, 1);
        ctx.globalAlpha = pulse;
        ctx.fillStyle = "#ff3b30";
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = Math.max(2, u * .5);
        ctx.beginPath();
        ctx.moveTo(u * 3.6, 0); ctx.lineTo(-u * 2.4, -u * 3.4); ctx.lineTo(-u * 2.4, u * 3.4); ctx.closePath();
        ctx.stroke(); ctx.fill();
        ctx.restore();
      }
      drawShark();
      // Pulserende ring om hajen, så den er let at finde (stærkest før start)
      if (state === "ready" || state === "play") {
        const pulse = .5 + .5 * Math.sin(time * 5);
        ctx.save();
        ctx.strokeStyle = `rgba(255,224,138,${state === "ready" ? .55 + .4 * pulse : .38 + .2 * pulse})`;
        ctx.lineWidth = Math.max(2, u * .6);
        ctx.beginPath();
        ctx.arc(sh.x, sh.y, sh.R * (1.45 + .12 * pulse), 0, 6.3);
        ctx.stroke();
        ctx.restore();
      }
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.s * p.life, 0, 6.3); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(.05, (now - last) / 1000);
      last = now;
      if (screen === "play" && !SW) resize();
      if (screen === "play" && SW > 0) { update(dt); draw(); }
      requestAnimationFrame(frame);
    }

    // ---------- Styring: træk fingeren op og ned, så svømmer hajen op og ned (hajen står stille i siden) ----------
    const setPointer = (e) => { pointer.y = e.clientY - cv.getBoundingClientRect().top; };
    const startPlay = () => { if (state === "ready") { state = "play"; G.grace = 1.5; $("startHint").hidden = true; } };
    stage.addEventListener("pointerdown", (e) => {
      if (!G) return;
      pointer.active = true;
      setPointer(e);
      pointer.y0 = pointer.y;
      sh.ty0 = sh.ty;
      if (controlMode === "tryk" && state !== "quiz") sh.vy = Math.min(sh.vy, -30 * u); // et tryk giver straks et lille løft
      try { stage.setPointerCapture(e.pointerId); } catch { /* ikke vigtigt */ }
      startPlay();
    });
    stage.addEventListener("pointermove", (e) => { if (pointer.active) setPointer(e); });
    const endPointer = () => { pointer.active = false; };
    stage.addEventListener("pointerup", endPointer);
    stage.addEventListener("pointercancel", endPointer);
    const KEYMAP = { ArrowUp: -1, ArrowDown: 1, w: -1, s: 1 };
    function syncKeys() {
      keys.y = 0;
      for (const k of keys.down) keys.y += KEYMAP[k];
      keys.y = clamp(keys.y, -1, 1);
    }
    document.addEventListener("keydown", (e) => {
      if (screen !== "play" || !KEYMAP[e.key]) return;
      e.preventDefault();
      keys.down.add(e.key);
      syncKeys();
      startPlay();
    });
    document.addEventListener("keyup", (e) => { keys.down.delete(e.key); syncKeys(); });

    // ---------- Indstillinger og start ----------
    function applyRom() {
      const hide = read("rom", "1") === "0";
      for (const el of document.querySelectorAll(".rom, #quizRom")) el.style.display = hide ? "none" : "";
      fitSoon();
    }
    $("optSpeed").value = speedKey;
    $("optControl").value = controlMode;
    $("optControl").addEventListener("change", (e) => { controlMode = e.target.value === "traek" ? "traek" : "tryk"; write("styring", controlMode); if (sh) { sh.vy = 0; sh.ty = sh.y; } $("startHint").textContent = hintText(); });
    $("optChoices").value = read("valg", "auto");
    $("optRom").value = read("rom", "1");
    $("optSpeed").addEventListener("change", (e) => { write("fart", e.target.value); speedKey = e.target.value; });
    $("optChoices").addEventListener("change", (e) => write("valg", e.target.value));
    $("optRom").addEventListener("change", (e) => { write("rom", e.target.value); applyRom(); });
    $("optReset").addEventListener("click", () => {
      nextLevel = 1;
      write("level", 1);
      Topbar.closeMenu();
      if (screen === "play") goHome(); else renderHome();
    });

    $("mascot").addEventListener("click", (e) => { audio(); sfx.pop(); e.currentTarget.animate([{ transform: "scale(1)" }, { transform: "scale(1.15) rotate(8deg)" }, { transform: "scale(1)" }], { duration: 380 }); });
    $("playBtn").addEventListener("click", () => { audio(); startLevel(nextLevel); });
    $("dictBtn").addEventListener("click", () => { renderDict(); show("dictScreen"); $("dictScreen").scrollTop = 0; });
    $("dictBack").addEventListener("click", () => { stopSpeech(); renderHome(); show("home"); });

    // Siden følger den højde, der faktisk kan ses (iPhone-Safari tæller nogle gange værktøjslinjerne med)
    const fitViewport = () => {
      const vv = window.visualViewport;
      document.documentElement.style.setProperty("--app-h", `${Math.round(vv ? vv.height : window.innerHeight)}px`);
    };
    fitViewport();
    window.addEventListener("resize", fitViewport);
    window.addEventListener("orientationchange", () => setTimeout(fitViewport, 300));
    if (window.visualViewport) visualViewport.addEventListener("resize", fitViewport);
    new ResizeObserver(() => { if (screen === "play") resize(); }).observe(stage);
    window.addEventListener("resize", () => { if (screen === "play") resize(); });
    if (window.visualViewport) { visualViewport.addEventListener("resize", () => { if (screen === "play") resize(); }); visualViewport.addEventListener("scroll", () => { if (screen === "play") resize(); }); }

    Topbar.init({ kid, controls: [$("settings")] });
    renderHome();
    requestAnimationFrame(frame);

    // Testværktøj: ?l=<bane> åbner en bane direkte. window.__haj giver adgang til tilstanden, og tick(sek) kører spillet frem.
    const qs = new URLSearchParams(location.search);
    window.__haj = {
      get G() { return G; }, get sh() { return sh; }, get fish() { return fish; }, get state() { return state; }, get quiz() { return quiz; },
      pointer, answer, closeQuiz, startLevel, speak, wordState, ALL,
      get SW() { return SW; }, get SH() { return SH; },
      tick(sec) { for (let i = 0; i < sec * 60; i++) update(1 / 60); draw(); },
      win, caught, eat, get stars() { return stars; }
    };
    if (qs.has("l")) startLevel(Math.max(1, Number(qs.get("l")) || 1));
  })();
  </script>
</body>
</html>
