<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#dff5ff">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-title" content="Kaninens Farvehave">
  <title>Kaninens Farvehave</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #35523b;
      font-synthesis: none;
      --ink: #35523b;
      --green: #378753;
      --sun: #ffe27a;
      --choice-h: clamp(100px, 19vh, 150px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      height: 100vh;
      height: 100dvh;
      min-width: 320px;
      margin: 0;
      overflow-y: auto;
      overscroll-behavior: none;
      background: #e6f8ff;
    }
    button, select { font: inherit; }
    button { color: inherit; }

    .app {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      height: 100%;
      padding: calc(var(--tb-h, 54px) + 7px) 10px 10px;
      overflow: hidden;
    }
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: none;
      min-height: 36px;
      padding: 0 4px;
      color: #356548;
      font-size: clamp(.95rem, 3.4vw, 1.15rem);
      font-weight: 900;
    }
    .progress { display: flex; align-items: center; gap: 5px; }
    .step {
      display: grid;
      place-items: center;
      width: clamp(24px, 7vw, 32px);
      aspect-ratio: 1;
      border: 2px solid #a9cbb1;
      border-radius: 50%;
      background: #ffffffa8;
      color: #a9cbb1;
      font-size: clamp(.8rem, 3vw, 1rem);
      transition: transform .25s, background .25s, color .25s;
    }
    .step.done { transform: scale(1.12); border-color: #efb82e; background: #fff2aa; color: #bd7800; }

    .field {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      border: 4px solid #fff;
      border-radius: 30px;
      background: linear-gradient(180deg, #84d2ff 0%, #bde8ff 30%, #e7f8ff 52%, #a8dd88 52%, #78c66d 100%);
      box-shadow: 0 10px 24px #527b6b26, inset 0 0 0 1px #79bd8b;
      isolation: isolate;
    }
    .scene, .fliers, .fx { position: absolute; inset: 0; pointer-events: none; }
    .scene { z-index: 0; overflow: hidden; }
    .fliers { z-index: 5; }
    .fx { z-index: 7; }
    [data-toy] { pointer-events: auto; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .scene svg { display: block; overflow: visible; }

    .sun {
      position: absolute;
      top: 17%;
      right: 6%;
      width: clamp(60px, 15vmin, 108px);
      aspect-ratio: 1;
      filter: drop-shadow(0 0 14px #fff3a6b0);
    }
    .sun svg { width: 100%; height: 100%; animation: sunBreath 4s ease-in-out infinite alternate; }
    .sun-rays { transform-box: fill-box; transform-origin: center; }
    .sun .eye { fill: #8a5a1c; }
    .sun .smile { fill: none; stroke: #8a5a1c; stroke-width: 2.6; stroke-linecap: round; }
    .sun .grin { fill: #b8473a; stroke: #8a5a1c; stroke-width: 1.6; stroke-linejoin: round; opacity: 0; }
    .sun.cheer .grin { opacity: 1; }
    .sun.cheer .smile { opacity: 0; }
    .sun.cheer svg { animation: sunPop .9s cubic-bezier(.2, 1.5, .4, 1); }

    .cloud {
      position: absolute;
      top: 24%;
      left: -30%;
      width: clamp(90px, 24vw, 170px);
      animation: cloudDrift 52s linear infinite;
    }
    .cloud svg { width: 100%; height: auto; filter: drop-shadow(0 6px 5px #5a8cb326); transform-origin: 50% 90%; }
    .cloud.c2 { top: 35%; left: 62%; width: clamp(70px, 18vw, 130px); animation: cloudDriftBack 70s linear infinite; }
    .cloud.c3 { top: 29%; left: 8%; width: clamp(60px, 15vw, 110px); animation: cloudDrift 80s -34s linear infinite; }
    .cloud.squish svg { animation: cloudSquish .7s cubic-bezier(.2, 1.4, .4, 1); }

    .mountains { position: absolute; right: 0; bottom: 43%; left: 0; width: 100%; height: clamp(56px, 15%, 120px); }
    .land { position: absolute; right: 0; bottom: 0; left: 0; width: 100%; height: 50%; }
    .rainbow { position: absolute; right: 14%; bottom: 40%; left: 14%; width: 72%; height: auto; opacity: .9; pointer-events: none; }
    .rainbow path { pointer-events: stroke; fill: none; stroke-width: 9.5; }
    .rainbow.shimmer { animation: rainbowShimmer .9s ease-in-out; }

    .prop { position: absolute; transform-origin: 50% 100%; }
    .prop svg { width: 100%; height: auto; }
    .tree { width: clamp(46px, 12vmin, 94px); }
    .tree svg { animation: treeSway 6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
    .tree.apple { bottom: 41%; left: 24%; }
    .tree.blossom { bottom: 42%; left: 69%; }
    .tree.pine { bottom: 41%; left: 86%; width: clamp(34px, 9vmin, 72px); }
    .windmill { bottom: 42%; left: 1%; width: clamp(50px, 12.5vmin, 100px); }
    .blades { transform-box: view-box; transform-origin: 50px 44px; }
    .bush { width: clamp(36px, 9.5vmin, 74px); }
    .bush.b1 { bottom: 40%; left: 14%; }
    .bush.b2 { bottom: 39%; left: 58%; }
    .prop.shake { animation: propShake .9s ease-in-out; }
    .wild { position: absolute; width: clamp(16px, 4.2vmin, 32px); }
    .wild svg { width: 100%; height: auto; animation: wildSway 3s ease-in-out infinite alternate; animation-delay: calc(var(--d) * -1s); transform-origin: 50% 100%; }
    .wild.wiggle svg { animation: wildWiggle .7s ease-in-out; }
    .planted-flower.wiggle { transform-origin: 50% 100%; animation: wildWiggle .7s ease-in-out; }

    .decor-item {
      position: absolute;
      margin-left: -.55em;
      font-size: clamp(1.8rem, 6.5vmin, 3.4rem);
      line-height: 1;
      transform-origin: 50% 100%;
      filter: drop-shadow(0 3px 2px #315d3840);
      animation: decorSway 2.5s ease-in-out infinite alternate;
    }
    .rainbow-draw path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: rainbowDraw 1.2s ease-out forwards; animation-delay: calc(var(--i) * .12s); }

    .butterfly {
      --bw: clamp(28px, 6.4vmin, 44px);
      position: absolute;
      top: 0;
      left: 0;
      width: var(--bw);
      height: calc(var(--bw) * .85);
      margin: calc(var(--bw) * -.425) 0 0 calc(var(--bw) * -.5);
      will-change: transform;
    }
    .butterfly::before { content: ""; position: absolute; inset: -14px; }
    .butterfly svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 3px 2px #315d3838); }
    .butterfly.blue { --w1: #6ab8ff; --w2: #c3e5ff; --w3: #3d7fcf; }
    .butterfly.pink { --w1: #ff8fbf; --w2: #ffd2e6; --w3: #d65c93; }
    .bf-up, .bf-low { stroke: var(--w3); stroke-width: 1.2; stroke-linejoin: round; }
    .bf-up { fill: var(--w1); }
    .bf-low { fill: var(--w2); }
    .bf-dot { fill: #fff; opacity: .85; }
    .bf-wing { transform-box: view-box; transform-origin: 20px 17px; animation: bfFlap .16s ease-in-out infinite alternate; }
    .butterfly.perched .bf-wing { animation: bfRest 1.9s ease-in-out infinite alternate; }
    .bee { position: absolute; top: 0; left: 0; margin: -.6em 0 0 -.6em; font-size: clamp(1.2rem, 3.6vmin, 2rem); line-height: 1; will-change: transform; }
    .bee::before { content: ""; position: absolute; inset: -10px; }
    .bird { position: absolute; top: 0; left: 0; width: clamp(28px, 6.4vmin, 44px); will-change: transform; }
    .bird::before { content: ""; position: absolute; inset: -12px; }
    .bird svg { display: block; width: 100%; height: auto; overflow: visible; }
    .bird .wing { transform-box: view-box; transform-origin: 20px 14px; animation: birdFlap .3s ease-in-out infinite alternate; }
    .particle { position: absolute; font-size: clamp(.95rem, 2.8vmin, 1.5rem); line-height: 1; pointer-events: none; will-change: transform, opacity; filter: drop-shadow(0 2px 1px #00000022); }

    .speech {
      position: absolute;
      z-index: 6;
      top: 6%;
      left: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: min(88%, 580px);
      min-height: 64px;
      padding: 9px 12px 9px 18px;
      border: 3px solid #fff;
      border-radius: 24px;
      background: #fffffff2;
      box-shadow: 0 6px 16px #416e5a25;
      text-align: center;
      transform: translateX(-50%);
    }
    .speech::after {
      content: "";
      position: absolute;
      bottom: -11px;
      left: 50%;
      width: 20px;
      height: 20px;
      border-right: 3px solid #fff;
      border-bottom: 3px solid #fff;
      background: #fffffff2;
      transform: translateX(-50%) rotate(45deg);
    }
    .message {
      flex: 1 1 auto;
      min-width: 0;
      font-size: clamp(1.05rem, 4vw, 1.55rem);
      font-weight: 900;
      line-height: 1.15;
    }
    .repeat {
      position: relative;
      z-index: 1;
      display: grid;
      flex: none;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 2px solid #cfe8d2;
      border-radius: 15px;
      background: #f3fff2;
      font-size: 1.35rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .repeat:active { transform: scale(.92); }
    .repeat:focus-visible, .choice:focus-visible, .big-btn:focus-visible { outline: 4px solid #367be8; outline-offset: 3px; }

    .bunny {
      position: absolute;
      z-index: 4;
      bottom: 40%;
      left: 50%;
      width: clamp(100px, 23vmin, 174px);
      height: auto;
      aspect-ratio: 180 / 190;
      margin-left: calc(clamp(100px, 23vmin, 174px) / -2);
      transform-origin: 50% 100%;
      overflow: visible;
      pointer-events: none;
    }
    .bunny-shadow {
      position: absolute;
      z-index: 3;
      bottom: 40%;
      left: 50%;
      width: 80px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, #2d5a3a73 0%, #2d5a3a38 55%, #2d5a3a00 74%);
      pointer-events: none;
    }
    .bunny .part { transform-box: view-box; }
    .bunny .torso { transform-origin: 88px 178px; animation: breathe 3.4s ease-in-out infinite; }
    .bunny .head-look { transform-origin: 88px 120px; transform: translate(calc(var(--lx, 0) * 2px), calc(var(--ly, 0) * 1.5px)) rotate(calc(var(--lx, 0) * 4deg)); transition: transform .35s ease-out; }
    .bunny .head { transform-origin: 88px 120px; animation: headIdle 7s ease-in-out infinite; }
    .bunny .ear.left { transform-origin: 64px 76px; animation: earFlickL 7s ease-in-out infinite; }
    .bunny .ear.right { transform-origin: 120px 77px; animation: earFlickR 9s -4s ease-in-out infinite; }
    .bunny .eyes { transform: translate(calc(var(--ex, 0) * 1px), calc(var(--ey, 0) * 1px)); transition: transform .25s ease-out; }
    .bunny .blink { animation: blink 4.6s infinite; }
    .bunny .blink.l { transform-origin: 70px 87px; }
    .bunny .blink.r { transform-origin: 108px 87px; }
    .bunny .nose { transform-origin: 89px 102px; animation: noseTwitch 3.6s infinite; }
    .bunny .whiskers.l { --w: 1; transform-origin: 66px 106px; animation: whiskerTwitch 3.6s infinite; }
    .bunny .whiskers.r { --w: -1; transform-origin: 112px 106px; animation: whiskerTwitch 3.6s infinite; }
    .bunny .tail { transform-origin: 139px 150px; animation: tailWag 6s ease-in-out infinite; }
    .bunny .arm { transition: transform .3s ease-out; }
    .bunny .arm.left { transform-origin: 58px 124px; }
    .bunny .arm.right { transform-origin: 118px 124px; }
    .bunny .mouth-open { opacity: 0; }
    .bunny.happy .mouth-open { opacity: 1; }
    .bunny.happy .mouth-smile { opacity: 0; }
    .bunny .can, .bunny .dirt, .bunny .drops { opacity: 0; transition: opacity .2s; }
    .bunny .can { transform-origin: 120px 140px; }

    .bunny.catching .arm.left { transform: rotate(48deg); }
    .bunny.catching .arm.right { transform: rotate(-48deg); }
    .bunny.catching .torso { animation: catchTorso .45s ease-out; }
    .bunny.catching .head-look { transform: translateY(-3px); }

    .bunny.digging .torso { animation: digTorso .3s ease-in-out infinite alternate; }
    .bunny.digging .head-look { transform: translateY(6px); }
    .bunny.digging .eyes { transform: translateY(3px); }
    .bunny.digging .arm.left { animation: pawScratch .3s ease-in-out infinite alternate; }
    .bunny.digging .arm.right { animation: pawScratch .3s -.15s ease-in-out infinite alternate; }
    .bunny.digging .dirt { opacity: 1; }
    .bunny .dirt circle { animation: dirtFly .6s ease-out infinite; animation-delay: calc(var(--i) * -.12s); }

    .bunny.watering .arm.left { transform: rotate(-16deg); }
    .bunny.watering .arm.right { transform: rotate(16deg); }
    .bunny.watering .head-look { transform: translate(2px, 3px) rotate(3deg); }
    .bunny.watering .eyes { transform: translate(-1px, 3px); }
    .bunny.watering .can { opacity: 1; animation: canTip 1s ease-in-out both; }
    .bunny.watering .drops { opacity: 1; }
    .bunny .drops circle { animation: dropFall .45s ease-in infinite; animation-delay: calc(var(--i) * -.15s); }

    .bunny.nope .head-look { animation: headNope .6s ease-in-out; }

    .bunny.dance { animation: bunnyDance 1.2s ease-in-out infinite; }
    .bunny.dance .arm.left { animation: armCheerL .3s ease-in-out infinite alternate; }
    .bunny.dance .arm.right { animation: armCheerR .3s -.15s ease-in-out infinite alternate; }

    .plot.wet::before { background: linear-gradient(#7c5636, #59391f); }
    .plot.wet::after { content: ""; position: absolute; bottom: 3px; width: clamp(24px, 6vmin, 40px); height: 11px; border: 2px solid #a8dcf0; border-radius: 50%; animation: ripple .55s ease-out 2; pointer-events: none; }
    .fly-flower { position: fixed; z-index: 8; pointer-events: none; filter: drop-shadow(0 6px 4px #315d3840); }
    .fly-flower .flower { display: block; width: 100%; height: auto; overflow: visible; }

    .choices {
      position: absolute;
      z-index: 6;
      right: 3%;
      bottom: 3%;
      left: 3%;
      display: grid;
      grid-template-columns: repeat(var(--choice-count, 3), minmax(0, 270px));
      justify-content: center;
      align-items: end;
      gap: clamp(8px, 2.4vw, 18px);
    }
    .choice {
      position: relative;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: clamp(3px, 1vh, 8px);
      min-width: 0;
      min-height: var(--choice-h);
      padding: 8px 6px 10px;
      border: 4px solid #fff;
      border-radius: 26px;
      background: linear-gradient(180deg, var(--c-light, #fff) 0%, var(--c-mid, #f4f4f4) 100%);
      box-shadow: 0 8px 0 var(--c-dark, #518e5c), 0 14px 18px #1f3d2940, inset 0 -10px 18px var(--c-glow, #ffffff55);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .15s, box-shadow .15s, border-color .15s, background .15s, opacity .3s, filter .3s;
      animation: choiceIn .55s cubic-bezier(.2, 1.35, .4, 1) backwards;
      animation-delay: calc(var(--n, 0) * 90ms);
    }
    .choice::before {
      content: "";
      position: absolute;
      top: 5px;
      right: 12px;
      left: 12px;
      height: 32%;
      border-radius: 20px 20px 50% 50% / 20px 20px 60% 60%;
      background: linear-gradient(180deg, #ffffffb8, #ffffff00);
      pointer-events: none;
    }
    .choice:active:not(:disabled) { transform: translateY(5px) scale(.97); box-shadow: 0 3px 0 var(--c-dark, #518e5c), 0 6px 10px #1f3d2933, inset 0 -6px 12px var(--c-glow, #ffffff55); }
    @media (hover: hover) {
      .choice:hover:not(:disabled) { transform: translateY(-4px); box-shadow: 0 12px 0 var(--c-dark, #518e5c), 0 20px 22px #1f3d2940, inset 0 -10px 18px var(--c-glow, #ffffff55); }
    }
    .choice:disabled { cursor: default; }
    .choice-art { position: relative; display: grid; place-items: center; }
    .choice-art::before {
      content: "";
      position: absolute;
      width: 138%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #ffffffd0 42%, #ffffff00 70%);
    }
    .choice .flower { position: relative; width: calc(var(--choice-h) * .52); height: auto; overflow: visible; filter: drop-shadow(0 5px 3px #35523b2e); transform-origin: 50% 80%; animation: choiceFlower 2.4s ease-in-out infinite alternate; }
    .choice:nth-child(2) .flower { animation-delay: -.8s; }
    .choice:nth-child(3) .flower { animation-delay: -1.6s; }
    .choice .petal { transform-box: fill-box; transform-origin: center; transition: transform .25s; }
    .choice:hover .petal { transform: scale(1.07); }
    .choice-name {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: .45em;
      max-width: 100%;
      padding: .18em .85em .24em;
      overflow: hidden;
      border-radius: 99px;
      background: #fff;
      box-shadow: 0 2px 0 #00000014, inset 0 0 0 2px var(--c-light, #eee);
      color: var(--c-ink, #385840);
      font-size: clamp(.8rem, calc(9vw / var(--choice-count, 2)), 1.5rem);
      font-weight: 900;
      line-height: 1.15;
      text-overflow: ellipsis;
      text-transform: capitalize;
    }
    .choice-name::before { content: ""; flex: none; width: .72em; height: .72em; border-radius: 50%; background: var(--c, #888); box-shadow: inset 0 -2px 0 #00000026, 0 0 0 2px #fff, 0 0 0 3px var(--c-light, #eee); }
    @media (max-width: 520px) {
      .choices[data-count="3"] .choice-name { padding: .15em .55em .2em; font-size: clamp(.76rem, 3.4vw, 1.1rem); }
      .choices[data-count="3"] .choice-name::before { display: none; }
    }
    .choices.picked .choice:not(.correct) { opacity: .45; filter: saturate(.6); transform: scale(.95); }
    .choice.correct {
      border-color: #fff3b0;
      background: linear-gradient(180deg, #fffbe3, #ffeb9a);
      box-shadow: 0 8px 0 #e0a800, 0 0 0 6px #fff3b866, 0 0 30px #ffd54f;
      animation: choiceWin .55s ease;
    }
    .choice.correct::after { content: "⭐"; position: absolute; top: -16px; right: -8px; font-size: clamp(1.5rem, 5vmin, 2.2rem); filter: drop-shadow(0 3px 2px #8a5a1c55); animation: starPop .6s cubic-bezier(.2, 1.6, .4, 1) both; }
    .choice.wrong { border-color: #ffb6a8; background: linear-gradient(180deg, #fff6f3, #ffdcd3); box-shadow: 0 8px 0 #d98b7c, 0 14px 18px #1f3d2933; animation: choiceOops .42s ease; }

    .storage-note {
      position: absolute;
      z-index: 8;
      right: 10px;
      bottom: 2px;
      left: 10px;
      color: #7a3d32;
      font-size: .82rem;
      font-weight: 800;
      text-align: center;
      text-shadow: 0 1px #fff;
    }
    .voice-note {
      position: absolute;
      z-index: 7;
      top: calc(6% + 74px);
      left: 50%;
      width: max-content;
      max-width: 90%;
      margin: 0;
      padding: 6px 12px;
      border: 2px solid #fff;
      border-radius: 14px;
      background: #fff9e8;
      color: #765c28;
      font-size: clamp(.78rem, 2.8vw, .95rem);
      font-weight: 800;
      text-align: center;
      transform: translateX(-50%);
    }
    .flower-bed {
      position: absolute;
      z-index: 5;
      right: 7%;
      bottom: calc(3% + var(--choice-h) + 12px);
      left: 7%;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: end;
      gap: clamp(4px, 2vw, 14px);
      height: clamp(44px, 8vh, 64px);
      pointer-events: none;
    }
    .plot { position: relative; display: grid; place-items: end center; min-width: 0; height: 100%; }
    .plot::before {
      content: "";
      position: absolute;
      bottom: 2px;
      width: clamp(28px, 7vmin, 48px);
      height: 13px;
      border-radius: 50%;
      background: linear-gradient(#a77a4a, #765034);
      box-shadow: inset 0 3px 4px #57391f66, 0 2px 2px #315d3833;
    }
    .plot .seed {
      position: absolute;
      z-index: 1;
      bottom: 9px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e6c46c;
      box-shadow: 0 0 0 2px #fff4bd88;
    }
    .planted-flower {
      position: absolute;
      z-index: 1;
      bottom: 4px;
      width: clamp(48px, 12vmin, 70px);
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 4px 2px #315d3840);
    }
    .planted-flower .stem { stroke-dasharray: 34; stroke-dashoffset: 34; animation: stemGrow .55s ease-out forwards; }
    .planted-flower .leaf { transform-box: fill-box; transform-origin: 0 100%; animation: leafGrow .35s .25s cubic-bezier(.2, 1.5, .4, 1) both; }
    .planted-flower .bloom { transform-box: fill-box; transform-origin: 50% 75%; animation: bloomPop .65s .35s cubic-bezier(.2, 1.5, .4, 1) both; }
    .plot .sparkle { position: absolute; z-index: 2; top: 0; left: 50%; font-size: clamp(.8rem, 3vmin, 1.2rem); animation: sparkleBurst .8s ease-out both; }
    .reward {
      position: fixed;
      z-index: 75;
      top: 50%;
      left: 50%;
      display: grid;
      justify-items: center;
      gap: 3px;
      min-width: min(76vw, 330px);
      padding: 14px 20px;
      border: 4px solid #fff;
      border-radius: 26px;
      background: linear-gradient(145deg, #fffbe1, #fff);

    @keyframes blink { 0%, 44%, 50%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.08); } }
    @keyframes noseTwitch { 0%, 22%, 100% { transform: scale(1); } 4% { transform: scale(1.14, 1.1) translateY(-.6px); } 8% { transform: scale(.95); } 12% { transform: scale(1.12, 1.08); } 16% { transform: scale(1); } }

    @keyframes tailWag { 0%, 78%, 100% { transform: rotate(0) scale(1); } 82% { transform: rotate(10deg) scale(1.1); } 86% { transform: rotate(-8deg); } 90% { transform: rotate(7deg) scale(1.06); } 94% { transform: rotate(-3deg); } }
    @keyframes choiceIn { from { opacity: 0; transform: translateY(34px) scale(.78); } 65% { opacity: 1; transform: translateY(-5px) scale(1.03); } to { opacity: 1; transform: translateY(0) scale(1); } }

    @keyframes rewardFloat { to { transform: translateY(-7px) rotate(5deg); } }
    @keyframes cardIn { from { opacity: 0; transform: scale(.82) translateY(18px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    @media (max-height: 560px) {
      .app { gap: 4px; padding-bottom: 5px; }

      .speech { top: 4%; min-height: 52px; padding: 5px 8px 5px 12px; }

      :root { --choice-h: clamp(82px, 18vh, 106px); }

    @media (prefers-reduced-motion: reduce) {

  <script src="../topbar.js"></script>
  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const COLORS = [
        { id: "red", name: "rød", flower: "røde", hex: "#ef5350" },
        { id: "yellow", name: "gul", flower: "gule", hex: "#ffca28" },
        { id: "blue", name: "blå", flower: "blå", hex: "#42a5f5" },
        { id: "green", name: "grøn", flower: "grønne", hex: "#66bb6a" },
        { id: "orange", name: "orange", flower: "orange", hex: "#fb8c32" },
        { id: "purple", name: "lilla", flower: "lilla", hex: "#ab75d1" },
        { id: "brown", name: "brun", flower: "brune", hex: "#a66b42" },
        { id: "pink", name: "lyserød", flower: "lyserøde", hex: "#f17aa7" }
      ];
      const DECORATIONS = [
        { id: "butterfly", icon: "🦋", name: "en sommerfugl" },
        { id: "sunflower", icon: "🌻", name: "en solsikke" },
        { id: "mushroom", icon: "🍄", name: "en lille svamp" },
        { id: "rainbow", icon: "🌈", name: "en regnbue" },
        { id: "ladybug", icon: "🐞", name: "en mariehøne" },
        { id: "tulip", icon: "🌷", name: "en tulipan" },
        { id: "bee", icon: "🐝", name: "en lille bi" },
        { id: "flower", icon: "💐", name: "en blomsterbuket" }
      ];
      const ROUNDS = 5;
      const STAR_KEY = "farvehave-stars";
      const DECOR_KEY = "farvehave-decor";
      const COLORS_KEY = "farvehave-colors";
      const steps = [];
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let totalStars = 0;
      let sessionStars = 0;
      let round = 0;
      let target = null;
      let lastTarget = "";
      let busy = false;
      let muted = !Topbar.soundOn();
      let voice = null;
      let voiceToken = 0;
      let activeAudio = null;
      let unlocked = [];
      let storageFailed = false;
      let rewardTimer = 0;
      let bunnySpot = 0;
      let bunnyMotions = [];

      const progress = $("progress");
      const message = $("message");
      const choices = $("choices");
      const bunny = $("bunny");
      const shadow = $("bunnyShadow");
      const flowerBed = $("flowerBed");
      const colorCount = $("colorCount");
      const reward = $("reward");
      const storageNote = $("storageNote");
      const voiceNote = $("voiceNote");

      function storageError(error) {
        storageFailed = true;
        console.error("Farvehavens fremskridt kunne ikke gemmes.", error);
        storageNote.textContent = "Fremskridtet kunne ikke gemmes på denne enhed.";
        storageNote.hidden = false;
      }

      function readNumber(key, fallback) {
        try {
          const value = Number(localStorage.getItem(key));
          return Number.isInteger(value) && value >= 0 ? value : fallback;
        } catch (error) {
          storageError(error);
          return fallback;
        }
      }

      function saveValue(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (error) {
          storageError(error);
        }
      }

      function loadDecor() {
        try {
          const saved = localStorage.getItem(DECOR_KEY);
          if (!saved) return [];
          const values = JSON.parse(saved);
          if (!Array.isArray(values)) throw new TypeError("Farvehavens samling har et ugyldigt format.");
          return [...new Set(values.filter((id) => DECORATIONS.some((item) => item.id === id)))];
        } catch (error) {
          storageError(error);
          return [];
        }
      }

      function shuffle(items) {
        const result = items.slice();
        for (let i = result.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function paintProgress() {
        $("roundLabel").textContent = `Blomster ${round} af ${ROUNDS}`;
        flowerBed.setAttribute("aria-label", `Pjuskes blomsterbed: ${round} af ${ROUNDS} blomster plantet`);
        steps.forEach((step, index) => step.classList.toggle("done", index < round));
      }

      // ---------- Landskabet: ting man kan trykke på, en sommerfugl der flyver og lander, fugle og belønninger ----------
      const field = $("field");
      const scene = $("scene");
      const fliers = $("fliers");
      const fx = $("fx");
      const rainbow = $("rainbow");
      const DECOR_SLOTS = {
        sunflower: { x: 35, y: 41 },
        mushroom: { x: 47, y: 40 },
        ladybug: { x: 54, y: 36 },
        tulip: { x: 63, y: 41 },
        flower: { x: 78, y: 40 }
      };
      const WILD_FLOWERS = [[5, 35, "#ff8fb5"], [10, 41, "#ffffff"], [21, 34, "#ffd84d"], [33, 38, "#b197fc"], [43, 34, "#ff8fb5"], [51, 39, "#ffd84d"], [66, 35, "#ffffff"], [76, 36, "#ff8f6b"], [83, 41, "#b197fc"], [93, 36, "#ffd84d"]];
      const fliersList = [];
      const decorNodes = new Map();
      let particleCount = 0;
      let sunSpin = null;
      let bladeSpin = null;
      let birdTimer = 0;

      function toField(clientX, clientY) {
        const rect = field.getBoundingClientRect();
        return { x: clientX - rect.left - field.clientLeft, y: clientY - rect.top - field.clientTop };
      }

      function pointOn(el, px = 50, py = 50) {
        const rect = el.getBoundingClientRect();
        return toField(rect.left + rect.width * px / 100, rect.top + rect.height * py / 100);
      }

      function burst(x, y, glyphs, count = 5, options = {}) {
        if (reduceMotion || particleCount > 48) return;
        const { spread = 60, rise = 46, fall = 70, duration = 1100, spin = 90 } = options;
        for (let i = 0; i < count; i++) {
          const piece = document.createElement("span");
          piece.className = "particle";
          piece.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
          piece.style.left = `${x}px`;
          piece.style.top = `${y}px`;
          fx.append(piece);
          particleCount += 1;
          const dx = (Math.random() - .5) * 2 * spread;
          const up = rise * (.6 + Math.random() * .6);
          const down = fall * (.8 + Math.random() * .4);
          const turn = (Math.random() - .5) * 2 * spin;
          const motion = piece.animate([
            { transform: "translate(-50%, -50%) scale(.3) rotate(0deg)", opacity: 0 },
            { transform: `translate(calc(-50% + ${dx * .55}px), calc(-50% - ${up}px)) scale(1) rotate(${turn * .5}deg)`, opacity: 1, offset: .35 },
            { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${down}px)) scale(.9) rotate(${turn}deg)`, opacity: 0 }
          ], { duration: duration * (.8 + Math.random() * .5), delay: i * 40, easing: "cubic-bezier(.3, .6, .5, 1)" });
          motion.onfinish = motion.oncancel = () => {
            piece.remove();
            particleCount -= 1;
          };
        }
      }

      function wobble(el, className, ms) {
        el.classList.remove(className);
        void el.getBoundingClientRect();
        el.classList.add(className);
        window.clearTimeout(el._wobbleTimer);
        el._wobbleTimer = window.setTimeout(() => el.classList.remove(className), ms);
      }

      // Sætter en uendelig animation op i fart og lader den falde til ro igen.
      function boost(animation, rate) {
        if (!animation) return;
        window.clearInterval(animation._calm);
        animation.playbackRate = rate;
        animation._calm = window.setInterval(() => {
          animation.playbackRate = Math.max(1, animation.playbackRate * .88);
          if (animation.playbackRate <= 1.02) {
            animation.playbackRate = 1;
            window.clearInterval(animation._calm);
          }
        }, 120);
      }

      function bounce(el, spin) {
        if (reduceMotion) return;
        el.animate([
          { transform: "scale(1, 1) rotate(0deg)" },
          { transform: "scale(1.18, .78) rotate(0deg)", offset: .18 },
          { transform: `translateY(-26px) scale(.92, 1.12) rotate(${spin ? 180 : -8}deg)`, offset: .5 },
          { transform: `translateY(0) scale(1.12, .86) rotate(${spin ? 360 : 6}deg)`, offset: .78 },
          { transform: "scale(1, 1) rotate(0deg)" }
        ], { duration: 700, easing: "ease-out" });
      }

      const TOYS = {
        sun(el) {
          wobble(el, "cheer", 1500);
          boost(sunSpin, 10);
          const c = pointOn(el);
          burst(c.x, c.y, ["✨", "⭐", "💛"], 6, { spread: 70, rise: 40, fall: 30 });
        },
        cloud(el) {
          wobble(el, "squish", 700);
          const rect = el.getBoundingClientRect();
          const c = toField(rect.left + rect.width / 2, rect.top + rect.height * .8);
          burst(c.x, c.y, ["💧"], 6, { spread: rect.width * .35, rise: 2, fall: 120, duration: 1000 });
        },
        tree(el) {
          wobble(el, "shake", 900);
          const rect = el.getBoundingClientRect();
          const c = toField(rect.left + rect.width * .5, rect.top + rect.height * .35);
          burst(c.x, c.y, (el.dataset.bits || "🍃").split(","), 5, { spread: rect.width * .45, rise: 4, fall: rect.height * .6, duration: 1500 });
        },
        bush(el) {
          wobble(el, "shake", 900);
          const c = pointOn(el, 50, 40);
          burst(c.x, c.y, (el.dataset.bits || "🍃").split(","), 4, { spread: 36, rise: 18, fall: 40 });
        },
        windmill(el) {
          boost(bladeSpin, 16);
          const c = pointOn(el, 50, 37);
          burst(c.x, c.y, ["💨"], 3, { spread: 56, rise: 10, fall: -8 });
        },
        wild(el) {
          wobble(el, "wiggle", 700);
          const c = pointOn(el, 50, 25);
          burst(c.x, c.y, ["🌸", "✨"], 3, { spread: 30, rise: 28, fall: 18 });
        },
        planted(el) {
          wobble(el, "wiggle", 700);
          const c = pointOn(el, 50, 30);
          burst(c.x, c.y, ["✨", "💛"], 3, { spread: 30, rise: 30, fall: 12 });
        },
        rainbow(el) {
          wobble(el, "shimmer", 900);
          for (let i = 0; i < 3; i++) {
            const c = pointOn(el, 14 + Math.random() * 72, 8 + Math.random() * 24);
            burst(c.x, c.y, ["✨", "⭐"], 2, { spread: 22, rise: 14, fall: 22 });
          }
        },
        decor(el) {
          const id = el.dataset.decor;
          bounce(el, id === "ladybug");
          const c = pointOn(el, 50, 30);
          const bits = { sunflower: ["🌼", "✨"], mushroom: ["✨", "💨"], ladybug: ["✨", "❤️"], tulip: ["🌸", "✨"], flower: ["💖", "✨"] }[id] || ["✨"];
          burst(c.x, c.y, bits, 4, { spread: 36, rise: 38, fall: 20 });
        },
        butterfly(el) {
          const c = pointOn(el);
          burst(c.x, c.y, ["✨"], 3, { spread: 24, rise: 18, fall: 8, duration: 800 });
          flyAway(el._flier, .26);
        },
        bee(el) {
          const c = pointOn(el);
          burst(c.x, c.y, ["💨", "✨"], 3, { spread: 24, rise: 12, fall: 8, duration: 800 });
          wander(el._flier, .34);
        },
        bird(el) {
          if (el._looping) return;
          el._looping = true;
          const c = pointOn(el);
          burst(c.x, c.y, ["♪", "♫"], 3, { spread: 34, rise: 42, fall: -10 });
          if (reduceMotion) { el._looping = false; return; }
          const loop = el.firstElementChild.animate([
            { transform: "rotate(0deg) translateY(0)" },
            { transform: "rotate(-180deg) translateY(-14px)", offset: .5 },
            { transform: "rotate(-360deg) translateY(0)" }
          ], { duration: 900, easing: "ease-in-out" });
          loop.onfinish = () => { el._looping = false; };
        }
      };

      function bunnyJoy() {
        if (busy || bunnyMotions.length || reduceMotion) return;
        const motion = bunny.animate([
          { transform: "translateY(0) scale(1, 1)", offset: 0 },
          { transform: "translateY(0) scale(1.08, .88)", offset: .15 },
          { transform: "translateY(-26px) scale(.95, 1.08)", offset: .45 },
          { transform: "translateY(0) scale(1.08, .9)", offset: .75 },
          { transform: "translateY(0) scale(1, 1)", offset: 1 }
        ], { duration: 700, easing: "ease-out" });
        bunnyMotions.push(motion);
        motion.onfinish = motion.oncancel = () => { bunnyMotions = bunnyMotions.filter((item) => item !== motion); };
        bunny.classList.add("happy");
        window.setTimeout(() => { if (!busy) bunny.classList.remove("happy"); }, 1500);
        const c = pointOn(bunny, 50, 6);
        burst(c.x, c.y, ["❤️", "💕", "✨"], 4, { spread: 46, rise: 52, fall: -6 });
        scareBunnyPerchers();
      }

      field.addEventListener("pointerdown", (event) => {
        if (event.target.closest(".choice, .speech, .repeat")) return;
        const toy = event.target.closest("[data-toy]");
        const rect = bunny.getBoundingClientRect();
        const onBunny = event.clientX > rect.left + rect.width * .12 && event.clientX < rect.right - rect.width * .12
          && event.clientY > rect.top && event.clientY < rect.bottom;
        if (onBunny && !(toy && ["butterfly", "bee"].includes(toy.dataset.toy))) {
          bunnyJoy();
          return;
        }
        if (toy && TOYS[toy.dataset.toy]) TOYS[toy.dataset.toy](toy);
      });

      // ---- Sommerfugle og bier: de flyver i svajende kurver og sætter sig på ting i landskabet ----
      function currentPoint(flier) {
        const rect = flier.el.getBoundingClientRect();
        return toField(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }

      function place(flier, point) {
        flier.x = point.x;
        flier.y = point.y;
        flier.el.style.transform = `translate(${point.x}px, ${point.y}px)`;
      }

      function perchPoint(spot) {
        if (spot.key === "bunny") {
          const rect = bunny.getBoundingClientRect();
          return toField(rect.left + rect.width * .79, rect.top + rect.height * .27);
        }
        if (!spot.key.isConnected) return null;
        const rect = spot.key.getBoundingClientRect();
        if (!rect.width) return null;
        const [px, py] = spot.key.dataset.perch.split(",").map(Number);
        return toField(rect.left + rect.width * px / 100, rect.top + rect.height * py / 100);
      }

      function perchOptions() {
        const spots = [...scene.querySelectorAll("[data-perch]")].map((el) => ({ key: el }));
        if (!busy) spots.push({ key: "bunny" });
        const limit = toField(0, document.querySelector(".speech").getBoundingClientRect().bottom).y + 8;
        return spots
          .map((spot) => ({ spot, point: perchPoint(spot) }))
          .filter(({ point }) => point && point.y > limit && point.x > 10 && point.x < field.clientWidth - 10);
      }

      function pickPerch(flier) {
        const taken = fliersList.filter((other) => other !== flier && other.spot).map((other) => other.spot.key);
        const origin = currentPoint(flier);
        const options = perchOptions().filter(({ spot }) => !taken.includes(spot.key) && !(flier.spot && flier.spot.key === spot.key));
        const far = options.filter(({ point }) => Math.hypot(point.x - origin.x, point.y - origin.y) > Math.min(field.clientWidth * .18, 120));
        const pool = far.length ? far : options;
        return pool[Math.floor(Math.random() * pool.length)] || null;
      }

      function flyTo(flier, target, speed = .11) {
        window.clearTimeout(flier.timer);
        const from = currentPoint(flier);
        if (flier.motion) flier.motion.cancel();
        flier.motion = null;
        flier.spot = null;
        if (reduceMotion) {
          arrive(flier, target);
          return;
        }
        const dx = target.point.x - from.x;
        const dy = target.point.y - from.y;
        const dist = Math.hypot(dx, dy) || 1;
        const duration = Math.min(6000, Math.max(1400, dist / speed));
        const steps = Math.max(10, Math.round(duration / 55));
        const nx = -dy / dist;
        const ny = dx / dist;
        const bend = (Math.random() - .5) * Math.min(180, dist * .7);
        const sway = flier.kind === "bee" ? 6 : 9 + Math.random() * 7;
        const cycles = Math.max(2, Math.round(dist / 90));
        const bobs = Math.max(2, Math.round(dist / 60));
        const frames = [];
        let previousX = from.x;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const ease = t * t * (3 - 2 * t);
          const envelope = Math.sin(Math.PI * t);
          const side = bend * envelope + Math.sin(2 * Math.PI * cycles * t) * sway * envelope;
          const x = from.x + dx * ease + nx * side;
          const y = from.y + dy * ease + ny * side + Math.sin(2 * Math.PI * bobs * t) * 6 * envelope;
          const tilt = i === steps ? 0 : Math.max(-24, Math.min(24, (x - previousX) * 4));
          previousX = x;
          frames.push({ transform: `translate(${x}px, ${y}px) rotate(${tilt}deg)` });
        }
        flier.el.classList.remove("perched");
        flier.el.classList.add("flying");
        flier.motion = flier.el.animate(frames, { duration, fill: "forwards" });
        flier.motion.onfinish = () => arrive(flier, target);
      }

      function arrive(flier, target) {
        place(flier, target.point);
        if (flier.motion) {
          flier.motion.cancel();
          flier.motion = null;
        }
        if (flier.kind === "bee") {
          flier.timer = window.setTimeout(() => wander(flier), 150 + Math.random() * 600);
          return;
        }
        flier.spot = target.spot;
        flier.el.classList.remove("flying");
        flier.el.classList.add("perched");
        if (target.spot.key === "bunny") {
          const rect = flier.el.getBoundingClientRect();
          lookAt(rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
        flier.timer = window.setTimeout(() => flyAway(flier), 3500 + Math.random() * 4500);
      }

      function flyAway(flier, speed) {
        if (flier.kind === "bee") {
          wander(flier, speed);
          return;
        }
        const option = pickPerch(flier);
        if (!option) {
          flier.timer = window.setTimeout(() => flyAway(flier), 1500);
          return;
        }
        flyTo(flier, option, speed);
      }

      function wander(flier, speed = .17) {
        const point = { x: field.clientWidth * (.08 + Math.random() * .84), y: field.clientHeight * (.3 + Math.random() * .3) };
        flyTo(flier, { point }, speed);
      }

      function scareBunnyPerchers() {
        fliersList.forEach((flier) => {
          if (flier.spot && flier.spot.key === "bunny") flyAway(flier, .24);
        });
      }

      function refreshPerched() {
        fliersList.forEach((flier) => {
          if (!flier.spot || flier.motion) return;
          const point = perchPoint(flier.spot);
          if (point) place(flier, point);
        });
      }

      function addButterfly(variant, fresh) {
        const el = document.createElement("div");
        el.className = `butterfly ${variant} perched`;
        el.dataset.toy = "butterfly";
        el.innerHTML = `<svg viewBox="0 0 40 34" focusable="false" aria-hidden="true">
          <g class="bf-wing l">
            <path class="bf-up" d="M20 16C15 3 3 1 2 10c-1 7 9 9 18 7z"/>
            <path class="bf-low" d="M20 18C12 19 5 23 8 29c3 5 10 0 12-9z"/>
            <circle class="bf-dot" cx="9" cy="10" r="2.6"/><circle class="bf-dot" cx="12" cy="26" r="1.8"/>
          </g>
          <g class="bf-wing r">
            <path class="bf-up" d="M20 16c5-13 17-15 18-6 1 7-9 9-18 7z"/>
            <path class="bf-low" d="M20 18c8 1 15 5 12 11-3 5-10 0-12-9z"/>
            <circle class="bf-dot" cx="31" cy="10" r="2.6"/><circle class="bf-dot" cx="28" cy="26" r="1.8"/>
          </g>
          <ellipse cx="20" cy="18" rx="1.9" ry="8.5" fill="#4a3b52"/>
          <path d="M19 10C17 5 14 3 12 3M21 10c2-5 5-7 7-7" fill="none" stroke="#4a3b52" stroke-width="1.2" stroke-linecap="round"/>
        </svg>`;
        fliers.append(el);
        const flier = { el, kind: "butterfly", spot: null, motion: null, timer: 0, x: 0, y: 0 };
        el._flier = flier;
        fliersList.push(flier);
        requestAnimationFrame(() => {
          if (fresh) {
            place(flier, { x: field.clientWidth / 2, y: field.clientHeight * .4 });
            flier.timer = window.setTimeout(() => flyAway(flier, .2), 300);
            return;
          }
          const first = pickPerch(flier);
          if (first) arrive(flier, first);
          else place(flier, { x: field.clientWidth * .5, y: field.clientHeight * .3 });
          window.clearTimeout(flier.timer);
          flier.timer = window.setTimeout(() => flyAway(flier), 1500 + Math.random() * 2000);
        });
        return el;
      }

      function addBee(fresh) {
        const el = document.createElement("span");
        el.className = "bee";
        el.dataset.toy = "bee";
        el.textContent = "🐝";
        fliers.append(el);
        const flier = { el, kind: "bee", spot: null, motion: null, timer: 0, x: 0, y: 0 };
        el._flier = flier;
        fliersList.push(flier);
        requestAnimationFrame(() => {
          place(flier, { x: field.clientWidth * (fresh ? .5 : .3), y: field.clientHeight * .4 });
          wander(flier);
        });
        return el;
      }

      // ---- Fugle der flyver forbi i en blød bølge; et tryk giver en lille loop og toner ----
      function scheduleBird(delay) {
        window.clearTimeout(birdTimer);
        birdTimer = window.setTimeout(spawnBird, delay);
      }

      function spawnBird() {
        if (reduceMotion || document.hidden) {
          scheduleBird(8000);
          return;
        }
        const width = field.clientWidth;
        const height = field.clientHeight;
        const direction = Math.random() < .5 ? 1 : -1;
        const baseY = height * (.26 + Math.random() * .1);
        const bird = document.createElement("div");
        bird.className = "bird";
        bird.dataset.toy = "bird";
        bird.innerHTML = `<svg viewBox="0 0 40 24" focusable="false" aria-hidden="true">
          <g class="wing"><path d="M20 14C14 4 6 3 1 6c6 1 10 5 19 8z" fill="#5d7ea6"/></g>
          <g class="wing"><path d="M20 14c6-10 14-11 19-8-6 1-10 5-19 8z" fill="#5d7ea6"/></g>
          <ellipse cx="20" cy="15" rx="5.2" ry="3.4" fill="#7ea3cc"/><circle cx="25" cy="13" r="2.7" fill="#7ea3cc"/><path d="M27 12.4l5 1.2-5 1.2z" fill="#f5a742"/>
        </svg>`;
        fliers.append(bird);
        const duration = 11000 + Math.random() * 5000;
        const frames = [];
        for (let i = 0; i <= 28; i++) {
          const t = i / 28;
          const x = direction > 0 ? -60 + (width + 120) * t : width + 60 - (width + 120) * t;
          const y = baseY + Math.sin(t * Math.PI * 5) * 12 - Math.sin(t * Math.PI) * 14;
          frames.push({ transform: `translate(${x}px, ${y}px) scaleX(${direction})` });
        }
        const flight = bird.animate(frames, { duration, easing: "linear" });
        flight.onfinish = () => {
          bird.remove();
          scheduleBird(7000 + Math.random() * 9000);
        };
      }

      function showRainbow(fresh) {
        rainbow.removeAttribute("hidden");
        if (fresh && !reduceMotion) rainbow.classList.add("rainbow-draw");
      }

      function popIn(el) {
        if (!reduceMotion) {
          el.animate([
            { transform: "scale(0) rotate(-20deg)", opacity: 0 },
            { transform: "scale(1.3) rotate(8deg)", opacity: 1, offset: .6 },
            { transform: "scale(1) rotate(0deg)", opacity: 1 }
          ], { duration: 800, easing: "cubic-bezier(.2, 1.4, .4, 1)" });
        }
        const c = pointOn(el, 50, 30);
        burst(c.x, c.y, ["✨", "⭐"], 6, { spread: 50, rise: 40, fall: 20 });
      }

      function paintDecor(freshId) {
        unlocked.forEach((id) => {
          if (decorNodes.has(id)) return;
          const item = DECORATIONS.find((decoration) => decoration.id === id);
          if (!item) return;
          const fresh = id === freshId;
          if (id === "butterfly") {
            decorNodes.set(id, addButterfly("pink", fresh));
            return;
          }
          if (id === "bee") {
            decorNodes.set(id, addBee(fresh));
            return;
          }
          if (id === "rainbow") {
            showRainbow(fresh);
            decorNodes.set(id, rainbow);
            return;
          }
          const slot = DECOR_SLOTS[id];
          if (!slot) return;
          const el = document.createElement("span");
          el.className = "decor-item";
          el.dataset.toy = "decor";
          el.dataset.decor = id;
          el.dataset.perch = "50,14";
          el.textContent = item.icon;
          el.style.left = `${slot.x}%`;
          el.style.bottom = `${slot.y}%`;
          scene.append(el);
          decorNodes.set(id, el);
          if (fresh) popIn(el);
        });
      }

      function buildScenery() {
        $("sunRays").innerHTML = Array.from({ length: 12 }, (_, i) => `<rect x="-3" y="-47" width="6" height="15" rx="3" fill="#ffd95e" transform="rotate(${i * 30})"/>`).join("");
        $("wilds").innerHTML = WILD_FLOWERS.map(([x, y, color], i) => `<span class="wild" data-toy="wild" data-perch="50,30" style="left:${x}%;bottom:${y}%;--d:${(i % 5) * .6}"><svg viewBox="0 0 24 40" focusable="false" aria-hidden="true"><path d="M12 39Q11 27 12 16" fill="none" stroke="#4fa05a" stroke-width="2.4" stroke-linecap="round"/><path d="M12 31Q5 29 4 23Q10 23 12 30Z" fill="#5fb36a"/><g fill="${color}" stroke="#00000014" stroke-width=".6"><circle cx="12" cy="7.5" r="4.2"/><circle cx="16.8" cy="11" r="4.2"/><circle cx="15" cy="16.6" r="4.2"/><circle cx="9" cy="16.6" r="4.2"/><circle cx="7.2" cy="11" r="4.2"/></g><circle cx="12" cy="12" r="3.2" fill="#ffcf40"/></svg></span>`).join("");
        if (!reduceMotion) {
          sunSpin = $("sunRays").animate([{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: 60000, iterations: Infinity });
          bladeSpin = $("blades").animate([{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: 16000, iterations: Infinity });
        }
        addButterfly("blue", false);
        scheduleBird(3500);
      }

      function resetFlowerBed() {
        flowerBed.replaceChildren();
        for (let i = 0; i < ROUNDS; i++) {
          const plot = document.createElement("span");
          plot.className = "plot";
          plot.setAttribute("aria-hidden", "true");
          plot.innerHTML = '<span class="seed"></span>';
          flowerBed.append(plot);
        }
        flowerBed.setAttribute("aria-label", `Pjuskes blomsterbed: ${round} af ${ROUNDS} blomster plantet`);
      }

      function plantFlower(color, index) {
        const plot = flowerBed.children[index];
        if (!plot) return;
        plot.classList.add("planted");
        plot.innerHTML = `<svg class="planted-flower" data-toy="planted" viewBox="0 0 60 78" aria-hidden="true" focusable="false">
          <path class="stem" d="M30 43v29" fill="none" stroke="#388653" stroke-width="4" stroke-linecap="round"/>
          <path class="leaf" d="M30 61C14 47 10 60 28 66z" fill="#58ad62"/>
          <path class="leaf" d="M30 55c15-16 22-4 3 6z" fill="#70c875"/>
          <g class="bloom">
            <g fill="${color.hex}" stroke="#fff" stroke-width="1.5">
              <circle cx="30" cy="17" r="8"/><circle cx="39" cy="24" r="8"/>
              <circle cx="35" cy="35" r="8"/><circle cx="25" cy="35" r="8"/>
              <circle cx="21" cy="24" r="8"/>
            </g>
            <circle cx="30" cy="27" r="7" fill="#ffe17c"/>
            <circle cx="28" cy="26" r="1" fill="#8a6930"/><circle cx="32" cy="26" r="1" fill="#8a6930"/>
            <path d="M28 29q2 2 4 0" fill="none" stroke="#8a6930" stroke-width="1" stroke-linecap="round"/>
          </g>
        </svg><span class="sparkle" aria-hidden="true">✨</span>`;
        flowerBed.setAttribute("aria-label", `Pjuskes blomsterbed: ${index + 1} af ${ROUNDS} blomster plantet`);
      }

      function flowerSvg(color) {
        return `<svg class="flower" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <g class="petal" fill="${color.hex}" stroke="#ffffff" stroke-width="3">
            <circle cx="50" cy="23" r="18"/><circle cx="75" cy="42" r="18"/>
            <circle cx="65" cy="70" r="18"/><circle cx="35" cy="70" r="18"/>
            <circle cx="25" cy="42" r="18"/>
          </g>
          <circle cx="50" cy="49" r="15" fill="#ffe17c" stroke="#fff" stroke-width="3"/>
          <circle cx="45" cy="46" r="1.8" fill="#8a6930"/><circle cx="55" cy="46" r="1.8" fill="#8a6930"/>
          <path d="M46 53q4 4 8 0" fill="none" stroke="#8a6930" stroke-width="2" stroke-linecap="round"/>
        </svg>`;
      }

      function mixColor(hex, target, amount) {
        const value = parseInt(hex.slice(1), 16);
        const channels = [value >> 16, (value >> 8) & 255, value & 255];
        return `rgb(${channels.map((channel, i) => Math.round(channel + (target[i] - channel) * amount)).join(", ")})`;
      }

      function renderChoices() {
        const numberOfChoices = totalStars < 5 ? 2 : 3;
        const options = shuffle([target, ...shuffle(activeColors.filter((color) => color.id !== target.id)).slice(0, numberOfChoices - 1)]);
        choices.style.setProperty("--choice-count", options.length);
        choices.dataset.count = options.length;
        choices.classList.remove("picked");
        choices.replaceChildren();
        options.forEach((color, index) => {
          const button = document.createElement("button");
          button.className = "choice";
          button.type = "button";
          button.setAttribute("aria-label", color.name);
          button.style.setProperty("--n", index);
          button.style.setProperty("--c", color.hex);
          button.style.setProperty("--c-light", mixColor(color.hex, [255, 255, 255], .82));
          button.style.setProperty("--c-mid", mixColor(color.hex, [255, 255, 255], .5));
          button.style.setProperty("--c-glow", mixColor(color.hex, [255, 255, 255], .3));
          button.style.setProperty("--c-dark", mixColor(color.hex, [24, 40, 30], .36));
          button.style.setProperty("--c-ink", mixColor(color.hex, [20, 30, 20], .62));
          button.innerHTML = `<span class="choice-art">${flowerSvg(color)}</span><span class="choice-name">${color.name}</span>`;
          button.addEventListener("click", () => chooseColor(color, button));
          choices.append(button);
        });
      }

      let activeColors = COLORS.slice(0, 4);
      function chooseTarget() {
        const available = activeColors.filter((color) => color.id !== lastTarget);
        target = available[Math.floor(Math.random() * available.length)] || activeColors[0];
        lastTarget = target.id;
      }

      function askQuestion() {
        if (round >= ROUNDS) {
          finishSession();
          return;
        }
        resetBunny();
        busy = false;
        paintProgress();
        chooseTarget();
        renderChoices();
        message.textContent = `Find den ${target.flower} blomst!`;
        readOut(`Find den ${target.flower} blomst.`);
      }

      function beginSession() {
        round = 0;
        sessionStars = 0;
        lastTarget = "";
        bunny.classList.remove("dance");
        resetBunny();
        resetFlowerBed();
        bunnySpot = 0;
        placeBunny(0);
        activeColors = COLORS.slice(0, Number(colorCount.value) || 4);
        $("finishScreen").hidden = true;
        $("startScreen").hidden = true;
        $("choices").hidden = false;
        paintProgress();
        askQuestion();
      }

      // Pjuske står bag blomsterbedet med fødderne ved jordhøjen i det plot, hun skal plante i, og flytter sig kun ét plot ad gangen.
      function placeBunny(index) {
        const plot = flowerBed.children[index];
        if (!plot) return;
        const field = $("field");
        const fieldRect = field.getBoundingClientRect();
        const border = field.clientLeft;
        const plotRect = plot.getBoundingClientRect();
        const style = getComputedStyle(bunny);
        const width = parseFloat(style.width) || bunny.getBoundingClientRect().width;
        const height = parseFloat(style.height) || bunny.getBoundingClientRect().height;
        const centre = plotRect.left + plotRect.width / 2 - fieldRect.left - border;
        const x = Math.min(Math.max(centre, width / 2 + 6), field.clientWidth - width / 2 - 6);
        const bottom = fieldRect.bottom - border - plotRect.bottom + 2;
        const shadowWidth = width * .62;
        const shadowHeight = shadowWidth * .17;
        bunny.style.left = `${x}px`;
        bunny.style.bottom = `${bottom}px`;
        shadow.style.left = `${x}px`;
        shadow.style.bottom = `${bottom + height * .063 - shadowHeight / 2}px`;
        shadow.style.width = `${shadowWidth}px`;
        shadow.style.height = `${shadowHeight}px`;
        shadow.style.marginLeft = `${-shadowWidth / 2}px`;
      }

      // To hop med forberedelse, udstrækning i luften og blød landing. Ørerne hænger bagefter og skyggen følger jorden.
      function hopToSpot(index) {
        scareBunnyPerchers();
        const before = bunny.getBoundingClientRect();
        placeBunny(index);
        bunnySpot = index;
        const after = bunny.getBoundingClientRect();
        const dx = before.left - after.left;
        const dy = before.top - after.top;
        if (reduceMotion || (!dx && !dy)) return;
        const hop = Math.min(44, Math.max(26, Math.abs(dx) * .2));
        const at = (progress, lift, scale) => `translate(${dx * (1 - progress)}px, ${dy * (1 - progress) - lift}px) scale(${scale})`;
        const duration = 950;
        bunny.style.animation = "none";
        bunnyMotions = [
          bunny.animate([
            { transform: at(0, 0, "1, 1"), offset: 0, easing: "ease-out" },
            { transform: at(0, 0, "1.08, .86"), offset: .1, easing: "cubic-bezier(.2, .7, .4, 1)" },
            { transform: at(.25, hop, ".94, 1.12"), offset: .24, easing: "cubic-bezier(.6, 0, .8, .4)" },
            { transform: at(.5, 0, "1.09, .88"), offset: .4, easing: "ease-out" },
            { transform: at(.5, 0, "1, 1"), offset: .46, easing: "ease-out" },
            { transform: at(.5, 0, "1.07, .89"), offset: .54, easing: "cubic-bezier(.2, .7, .4, 1)" },
            { transform: at(.75, hop * .9, ".95, 1.1"), offset: .67, easing: "cubic-bezier(.6, 0, .8, .4)" },
            { transform: at(1, 0, "1.1, .87"), offset: .82, easing: "ease-out" },
            { transform: at(1, 0, ".98, 1.03"), offset: .92, easing: "ease-in-out" },
            { transform: at(1, 0, "1, 1"), offset: 1 }
          ], { duration })
        ];
        bunnyMotions.push(shadow.animate([
          { transform: `translateX(${dx}px) scale(1)`, opacity: 1, offset: 0 },
          { transform: `translateX(${dx * .75}px) scale(.72)`, opacity: .55, offset: .24 },
          { transform: `translateX(${dx * .5}px) scale(1.1)`, opacity: 1, offset: .4 },
          { transform: `translateX(${dx * .5}px) scale(1)`, opacity: 1, offset: .5 },
          { transform: `translateX(${dx * .25}px) scale(.74)`, opacity: .55, offset: .67 },
          { transform: "translateX(0) scale(1.1)", opacity: 1, offset: .82 },
          { transform: "translateX(0) scale(1)", opacity: 1, offset: 1 }
        ], { duration }));
        bunny.querySelectorAll(".ear").forEach((ear) => {
          const side = ear.classList.contains("left") ? -1 : 1;
          bunnyMotions.push(ear.animate([
            { transform: "rotate(0deg)", offset: 0 },
            { transform: `rotate(${side * 4}deg)`, offset: .1 },
            { transform: `rotate(${side * 13}deg)`, offset: .22 },
            { transform: `rotate(${side * -6}deg)`, offset: .34 },
            { transform: `rotate(${side * 11}deg)`, offset: .42 },
            { transform: "rotate(0deg)", offset: .52 },
            { transform: `rotate(${side * 13}deg)`, offset: .66 },
            { transform: `rotate(${side * -6}deg)`, offset: .78 },
            { transform: `rotate(${side * 9}deg)`, offset: .86 },
            { transform: `rotate(${side * -2}deg)`, offset: .94 },
            { transform: "rotate(0deg)", offset: 1 }
          ], { duration, easing: "ease-in-out" }));
        });
        const done = () => { if (bunny.style.animation === "none") bunny.style.animation = ""; };
        bunnyMotions[0].onfinish = done;
        bunnyMotions[0].oncancel = done;
      }

      function resetBunny() {
        bunnyMotions.forEach((motion) => motion.cancel());
        bunnyMotions = [];
        bunny.style.animation = "";
        bunny.classList.remove("digging", "watering", "catching", "nope", "happy");
      }

      // Pjuske følger fingeren eller musen med øjne og hoved.
      function lookAt(x, y) {
        const rect = bunny.getBoundingClientRect();
        const reach = Math.max(rect.width * 2.4, 180);
        const nx = Math.max(-1, Math.min(1, (x - (rect.left + rect.width / 2)) / reach));
        const ny = Math.max(-1, Math.min(1, (y - (rect.top + rect.height * .42)) / reach));
        bunny.style.setProperty("--lx", nx.toFixed(2));
        bunny.style.setProperty("--ly", ny.toFixed(2));
        bunny.style.setProperty("--ex", (nx * 3.2).toFixed(2));
        bunny.style.setProperty("--ey", (ny * 2.4).toFixed(2));
      }

      function shakeNo() {
        bunny.classList.remove("nope");
        void bunny.getBoundingClientRect();
        bunny.classList.add("nope");
        window.setTimeout(() => bunny.classList.remove("nope"), 650);
      }

      function flySeed(choice, color) {
        if (reduceMotion) return;
        const source = (choice.querySelector(".flower") || choice).getBoundingClientRect();
        const bunnyRect = bunny.getBoundingClientRect();
        const size = Math.min(source.width, 64);
        const fromX = source.left + source.width / 2;
        const fromY = source.top + source.height / 2;
        const dx = bunnyRect.left + bunnyRect.width * .64 - fromX;
        const dy = bunnyRect.top + bunnyRect.height * .66 - fromY;
        const fly = document.createElement("div");
        fly.className = "fly-flower";
        fly.setAttribute("aria-hidden", "true");
        fly.style.width = `${size}px`;
        fly.style.left = `${fromX - size / 2}px`;
        fly.style.top = `${fromY - size / 2}px`;
        fly.innerHTML = flowerSvg(color);
        document.body.append(fly);
        const arc = Math.max(46, Math.abs(dy) * .3);
        const motion = fly.animate([
          { transform: "translate(0, 0) scale(1) rotate(0)", opacity: 1, offset: 0 },
          { transform: `translate(${dx * .5}px, ${dy * .5 - arc}px) scale(1.15) rotate(150deg)`, opacity: 1, offset: .5 },
          { transform: `translate(${dx}px, ${dy}px) scale(.3) rotate(320deg)`, opacity: .9, offset: 1 }
        ], { duration: 600, easing: "ease-in-out", fill: "forwards" });
        motion.onfinish = () => fly.remove();
        motion.oncancel = () => fly.remove();
      }

      function beginPlanting(color, index, choice, decoration) {
        const plot = flowerBed.children[index];
        if (!plot) return;
        const later = (action, delay) => window.setTimeout(action, reduceMotion ? 0 : delay);
        resetBunny();
        scareBunnyPerchers();
        flySeed(choice, color);
        later(() => bunny.classList.add("catching", "happy"), 520);
        later(() => {
          bunny.classList.remove("catching");
          bunny.classList.add("digging");
          message.textContent = `Pjuske graver et lille hul til den ${color.flower} blomst.`;
        }, 700);
        later(() => {
          bunny.classList.remove("digging");
          bunny.classList.add("watering");
          plot.classList.add("wet");
          message.textContent = "Nu vander Pjuske sin blomst!";
        }, 1580);
        later(() => {
          bunny.classList.remove("watering");
          plantFlower(color, index);
          message.textContent = `Se! Den ${color.flower} blomst vokser!`;
        }, 2600);
        if (index + 1 < ROUNDS) {
          later(() => hopToSpot(index + 1), 2680);
          later(() => {
            const grown = plot.getBoundingClientRect();
            lookAt(grown.left + grown.width / 2, grown.top);
          }, 3500);
        }
        if (decoration) later(() => showReward(decoration), 3400);
      }

      function awardStar() {
        totalStars += 1;
        sessionStars += 1;
        saveValue(STAR_KEY, String(totalStars));
        Topbar.refreshStars(true);
        return totalStars % 3 === 0 ? unlockDecoration() : null;
      }

      function unlockDecoration() {
        const next = DECORATIONS.find((item) => !unlocked.includes(item.id));
        if (!next) return null;
        unlocked.push(next.id);
        saveValue(DECOR_KEY, JSON.stringify(unlocked));
        return next;
      }

      function showReward(item) {
        if (!item) return;
        paintDecor(item.id);
        $("rewardIcon").textContent = item.icon;
        $("rewardText").textContent = `En ny ven: ${item.name}!`;
        reward.hidden = false;
        clearTimeout(rewardTimer);
        rewardTimer = window.setTimeout(() => { reward.hidden = true; }, 1350);
      }

      function chooseColor(color, button) {
        if (busy) return;
        busy = true;
        choices.querySelectorAll("button").forEach((choice) => { choice.disabled = true; });
        if (color.id !== target.id) {
          button.classList.add("wrong");
          shakeNo();
          message.textContent = `Du valgte ${color.name}. Find den ${target.flower} blomst!`;
          readOut(`Du valgte ${color.name}. Find den ${target.flower} blomst.`);
          window.setTimeout(() => {
            button.classList.remove("wrong");
            choices.querySelectorAll("button").forEach((choice) => { choice.disabled = false; });
            busy = false;
          }, 850);
          return;
        }

        button.classList.add("correct");
        choices.classList.add("picked");
        const flowerIndex = round;
        const decoration = awardStar();
        round += 1;
        paintProgress();
        message.textContent = `Ja! Pjuske planter en ${color.name} blomst!`;
        readOut(`Ja! Nu planter Pjuske en ${color.name} blomst!`);
        beginPlanting(color, flowerIndex, button, decoration);
        window.setTimeout(askQuestion, reduceMotion ? 1100 : decoration ? 4850 : 4300);
      }

      function finishSession() {
        busy = true;
        resetBunny();
        $("choices").hidden = true;
        $("roundLabel").textContent = "Haven er fuld af farver!";
        message.textContent = "Pjuske siger tusind tak!";
        bunny.classList.add("dance", "happy");
        $("finishStars").textContent = "⭐".repeat(sessionStars);
        $("finishText").textContent = `Du hjalp Pjuske med at plante ${sessionStars} blomster. Kom og leg igen!`;
        $("finishScreen").hidden = false;
        readOut("Hvor er du dygtig! Tak for hjælpen, siger Pjuske.");
      }

      function findDanishVoice() {
        if (!("speechSynthesis" in window)) return;
        voice = speechSynthesis.getVoices().find((item) => item.lang && item.lang.toLowerCase().startsWith("da")) || null;
      }

      function stopVoice() {
        voiceToken += 1;
        if ("speechSynthesis" in window) speechSynthesis.cancel();
        if (activeAudio) {
          activeAudio.pause();
          activeAudio = null;
        }
      }

      function voiceUnavailable(token) {
        if (token !== voiceToken || muted) return;
        console.warn("Dansk oplæsning kunne ikke afspilles.");
        voiceNote.hidden = false;
        $("repeat").title = "Oplæsning virker ikke lige nu – prøv igen";
      }

      function playOnline(text, token) {
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=da&q=${encodeURIComponent(text)}`;
        let audio;
        try {
          audio = new Audio(url);
        } catch (error) {
          console.error("Kunne ikke starte dansk oplæsning.", error);
          voiceUnavailable(token);
          return;
        }
        let failed = false;
        const fail = () => {
          if (failed) return;
          failed = true;
          if (activeAudio === audio) activeAudio = null;
          voiceUnavailable(token);
        };
        activeAudio = audio;
        audio.onended = () => { if (activeAudio === audio) activeAudio = null; };
        audio.onerror = fail;
        try {
          const playPromise = audio.play();
          if (playPromise && typeof playPromise.catch === "function") playPromise.catch(fail);
        } catch (error) {
          console.error("Kunne ikke afspille dansk oplæsning.", error);
          fail();
        }
      }

      function readOut(text) {
        stopVoice();
        if (muted) return;
        voiceNote.hidden = true;
        const token = voiceToken;
        if ("speechSynthesis" in window && voice) {
          try {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "da-DK";
            utterance.voice = voice;
            utterance.rate = .88;
            utterance.onerror = () => {
              if (token === voiceToken && !muted) playOnline(text, token);
            };
            speechSynthesis.speak(utterance);
          } catch (error) {
            console.warn("Dansk tale på enheden kunne ikke startes.", error);
            playOnline(text, token);
          }
          return;
        }
        playOnline(text, token);
      }

      for (let i = 0; i < ROUNDS; i++) {
        const step = document.createElement("span");
        step.className = "step";
        step.textContent = "★";
        step.setAttribute("aria-hidden", "true");
        progress.append(step);
        steps.push(step);
      }

      totalStars = readNumber(STAR_KEY, 0);
      unlocked = loadDecor();
      resetFlowerBed();
      const savedColors = readNumber(COLORS_KEY, 4);
      colorCount.value = [4, 6, 8].includes(savedColors) ? String(savedColors) : "4";
      colorCount.addEventListener("change", () => saveValue(COLORS_KEY, colorCount.value));

      $("startBtn").addEventListener("click", beginSession);
      $("againBtn").addEventListener("click", beginSession);
      $("repeat").addEventListener("click", () => {
        if (target) readOut(`Find den ${target.name} blomst.`);
      });
      paintProgress();
      buildScenery();
      paintDecor();
      placeBunny(bunnySpot);
      if ("ResizeObserver" in window) {
        new ResizeObserver(() => {
          placeBunny(bunnySpot);
          refreshPerched();
        }).observe($("field"));
      }
      window.addEventListener("resize", () => {
        placeBunny(bunnySpot);
        refreshPerched();
      });
      window.addEventListener("load", () => {
        placeBunny(bunnySpot);
        refreshPerched();
      });
      let lookFrame = 0;
      const followPointer = (event) => {
        const { clientX, clientY } = event;
        if (lookFrame) cancelAnimationFrame(lookFrame);
        lookFrame = requestAnimationFrame(() => {
          lookFrame = 0;
          lookAt(clientX, clientY);
        });
      };
      window.addEventListener("pointermove", followPointer, { passive: true });
      window.addEventListener("pointerdown", followPointer, { passive: true });
      Topbar.init({ kid: "riyana", controls: [$("settings")] });
      findDanishVoice();
      if ("speechSynthesis" in window) speechSynthesis.addEventListener("voiceschanged", findDanishVoice);
      window.addEventListener("topbar:sound", (event) => {
        muted = !event.detail.on;
        if (muted) stopVoice();
      });
    })();
  </script>
</body>
</html>
