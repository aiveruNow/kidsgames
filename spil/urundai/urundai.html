<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#145a2c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Urundai">
  <title>Urundai – Tempelhaven</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-synthesis: none;
      --ink: #2b2250;
      --soft: #7a6fa3;
      --gold: #f5b83d;
      --tamil: "Noto Sans Tamil", "Nirmala UI", "Latha", "Tamil Sangam MN", "Trebuchet MS", sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      height: 100vh;
      height: 100dvh;
      min-width: 320px;
      margin: 0;
      overflow-y: auto;
      overscroll-behavior: none;
      color: var(--ink);
      background: #145a2c;
      -webkit-user-select: none;
      user-select: none;
    }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 6px #f5b83d99; }
    .ta { font-family: var(--tamil); }
    #bg { position: fixed; inset: 0; z-index: 0; background: center / cover no-repeat #145a2c; }

    .app { position: relative; z-index: 1; height: 100%; padding: calc(var(--tb-h, 54px) + 6px) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); overflow: hidden; }
    .screen { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

    .btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 8px 24px; border: 2px solid #ffffff55; border-radius: 20px; background: linear-gradient(#ffd54f, #ffb300); color: #4a2f00; font-size: 1.2rem; font-weight: 900; letter-spacing: .01em; box-shadow: 0 5px 0 #c98600, 0 12px 20px #0004; transition: transform .12s, box-shadow .12s, filter .12s; }
    .btn::after { content: ""; position: absolute; inset: 0 0 50% 0; background: linear-gradient(#ffffff59, #ffffff00); pointer-events: none; }
    .btn:hover { filter: brightness(1.05); }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c98600, 0 4px 8px #0004; }
    .btn.green { background: linear-gradient(#7be08a, #2fb34e); color: #07350f; box-shadow: 0 5px 0 #1d8a37, 0 12px 20px #0004; }
    .btn.green:active { box-shadow: 0 1px 0 #1d8a37, 0 4px 8px #0004; }
    .btn.ghost { background: #0000004d; color: #fff; box-shadow: none; border: 2px solid #ffffff59; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .btn.ghost::after { display: none; }
    .btn.ghost:active { transform: scale(.98); background: #00000080; }
    .btn.big { min-height: 70px; font-size: 1.6rem; padding: 10px 36px; border-radius: 24px; }
    .back { flex: none; width: 46px; height: 46px; border: 2px solid #ffffff3d; border-radius: 15px; background: #0000004d; color: #fff; font-size: 1.5rem; font-weight: 900; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .back:active { background: #0000008c; transform: scale(.94); }

    /* Billeder. --ps er billedets størrelse */
    .pbox { container-type: inline-size; display: grid; place-items: center; aspect-ratio: 1; width: 100%; }
    .pbox > .pic { --ps: 90cqw; }
    .pic { width: var(--ps); height: var(--ps); display: grid; place-items: center; line-height: 1; }
    .pic svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 2px 2px #0002); }

    /* Forside */
    #home { align-items: center; padding-top: 10px; padding-bottom: 6px; }
    .hero { display: flex; align-items: center; gap: 14px; flex: none; margin-top: 2px; }
    .mascot { position: relative; width: clamp(76px, 16vh, 112px); aspect-ratio: 1; border: 0; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #ffd08a, #ff8a3d 48%, #d9480f); box-shadow: 0 8px 0 #8a2f08, 0 14px 22px #0005, inset 0 0 0 3px #fff9; animation: bounce 1.6s ease-in-out infinite; }
    .mascot .eye { position: absolute; top: 34%; width: 19%; height: 25%; border-radius: 50%; background: #fff; }
    .mascot .eye::after { content: ""; position: absolute; left: 30%; top: 42%; width: 45%; height: 50%; border-radius: 50%; background: #1c1233; }
    .mascot .eye.l { left: 25%; }
    .mascot .eye.r { right: 25%; }
    .mascot .mouth { position: absolute; left: 36%; right: 36%; bottom: 22%; height: 16%; border-bottom: 4px solid #5a1c05; border-radius: 0 0 50% 50%; }
    @keyframes bounce { 0%, 100% { transform: translateY(0) scaleY(1); } 45% { transform: translateY(-12px) scaleY(1.04); } 60% { transform: translateY(0) scaleY(.92); } }
    .hero h1 { margin: 0; color: #fff; font-size: clamp(2.2rem, 9vw, 3.2rem); letter-spacing: -.02em; line-height: 1; text-shadow: 0 3px 0 #0006; }
    .hero .sub { margin: 4px 0 0; color: #ffe9a8; font-size: 1.4rem; font-weight: 800; text-shadow: 0 2px 0 #0005; }
    .temple { width: min(62vw, 34dvh, 300px); flex: none; filter: drop-shadow(0 10px 14px #0007); animation: glow 3s ease-in-out infinite alternate; }
    .temple svg { width: 100%; height: auto; display: block; }
    @keyframes glow { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    .homebtns { display: grid; gap: 12px; width: min(100%, 420px); flex: none; }
    .tagline { margin: 0; color: #fff; font-weight: 800; text-align: center; text-shadow: 0 2px 0 #0006; }

    /* Ordbog */
    .head { display: flex; align-items: center; gap: 12px; flex: none; color: #fff; }
    .head h2 { margin: 0; font-size: clamp(1.4rem, 5vw, 2rem); text-shadow: 0 2px 0 #0005; }
    .head .tn { font-size: 1.05rem; font-weight: 700; color: #ffe9a8; }
    .dict { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; padding: 2px 2px 14px; }
    .card-w { position: relative; display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border: 0; border-radius: 20px; background: #fffdf5; box-shadow: 0 4px 0 #0004; text-align: center; }
    .card-w:active { transform: translateY(2px); }
    .card-w .pbox { width: 72%; }
    .card-w .t { font-family: var(--tamil); font-size: 1.2rem; font-weight: 800; line-height: 1.25; }
    .card-w .r { font-size: .85rem; color: var(--soft); font-weight: 700; }
    .card-w .d { font-size: .8rem; color: #9b92bb; }
    .card-w .medal { position: absolute; top: 5px; right: 6px; display: flex; gap: 2px; }
    .medal i { width: 10px; height: 10px; border-radius: 50%; background: #d8d2e8; }
    .medal i.on { background: #f5b83d; box-shadow: 0 0 0 1px #b57b05; }
    .card-w.unseen { background: #00000040; box-shadow: none; min-height: 118px; }
    .card-w.unseen .q { display: grid; place-items: center; flex: 1; color: #fff9; font-size: 2.4rem; font-weight: 900; }

    /* Bane */
    #play { gap: 6px; overflow: hidden; }
    .hud { display: flex; align-items: center; gap: 10px; flex: none; color: #fff; }
    .hud .back { width: 40px; height: 40px; font-size: 1.3rem; }
    .hud .title { display: flex; align-items: center; gap: 6px; font-size: 1.05rem; font-weight: 900; white-space: nowrap; text-shadow: 0 2px 0 #0006; margin-right: auto; }
    .score { display: grid; text-align: right; line-height: 1.05; }
    .score span { font-size: .62rem; letter-spacing: .12em; color: #ffe9a8; font-weight: 900; }
    .score b { font-size: 1.15rem; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 #0006; }
    #stage { position: relative; flex: 1; min-height: 0; touch-action: none; border-radius: 20px; background: center / cover no-repeat #145a2c; box-shadow: inset 0 0 0 3px #ffffff30, 0 6px 18px #0005; overflow: hidden; }
    #cv { position: absolute; inset: 0; display: block; }
    #startHint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 8px 18px; border-radius: 999px; background: #000000a6; color: #fff; font-weight: 900; white-space: nowrap; pointer-events: none; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; transform: translateX(-50%) scale(1.06); } }
    .pips { display: flex; gap: 2px; }
    .pips svg { width: 20px; height: 20px; transition: opacity .3s, filter .3s; }
    .pips svg.off { opacity: .25; filter: grayscale(1); }
    .fruits svg { width: 24px; height: 24px; display: block; }
    @media (max-width: 520px) {
      .app { padding-left: 4px; padding-right: 4px; padding-bottom: 4px; }
      #stage { border-radius: 14px; }
      .hud { gap: 6px; }
      .score b { font-size: 1rem; }
    }

    /* Ordkort, der dukker op under spillet (gentagelse uden at afbryde) */
    #wordPop { position: absolute; left: 50%; top: 8px; z-index: 5; display: flex; align-items: center; gap: 10px; max-width: calc(100% - 16px); padding: 6px 16px 6px 8px; border: 3px solid var(--gold); border-radius: 22px; background: #fffdf5f2; box-shadow: 0 8px 20px #0006; color: var(--ink); pointer-events: none; transform: translateX(-50%); animation: popin .3s cubic-bezier(.2, 1.5, .4, 1); }
    #wordPop .pbox { width: 52px; flex: none; }
    #wordPop .tw { font-family: var(--tamil); font-size: 1.7rem; font-weight: 800; line-height: 1.2; }
    #wordPop .rm { display: block; font-size: .85rem; font-weight: 800; color: var(--soft); line-height: 1; }
    @keyframes popin { from { transform: translateX(-50%) translateY(-20px) scale(.85); opacity: 0; } }
    .mute-note { margin: 0; padding: 4px 12px; border-radius: 999px; background: #fee2e2; color: #991b1b; font-size: .9rem; font-weight: 800; text-align: center; }
    .badge { display: inline-block; margin-bottom: 2px; padding: 0 8px; border-radius: 999px; background: #dbeafe; color: #1e40af; font-size: .72rem; font-weight: 900; }
    .badge.new { background: #dcfce7; color: #166534; }

    /* Overlays */
    .overlay { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: calc(var(--tb-h, 54px) + 10px) 10px 10px; background: #0a1a10a8; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
    .card { display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(100%, 560px); max-height: 100%; padding: 14px; overflow-y: auto; border-radius: 30px; background: linear-gradient(#fffdf5, #fdf2d4); border: 4px solid var(--gold); box-shadow: 0 20px 50px #0007; animation: rise .35s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes rise { from { transform: translateY(30px) scale(.9); opacity: 0; } }
    .card h3 { margin: 0; font-size: 1.5rem; text-align: center; }
    .why { display: flex; align-items: center; gap: 10px; font-weight: 800; color: #6b3a10; }
    .why svg { width: 54px; height: 54px; flex: none; }
    .wordbtn { display: flex; flex-direction: column; align-items: center; min-width: 220px; padding: 6px 26px 8px; border: 0; border-radius: 24px; background: linear-gradient(#fff4cc, #ffe08a); box-shadow: 0 5px 0 #d6a93a; }
    .wordbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #d6a93a; }
    .wordbtn .row { display: flex; align-items: center; gap: 12px; }
    .wordbtn .spk { width: 30px; height: 30px; animation: wiggle 1.2s ease-in-out infinite; }
    .wordbtn .tw { font-family: var(--tamil); font-size: clamp(2.4rem, 11vw, 3.8rem); font-weight: 800; line-height: 1.25; }
    .wordbtn .rm { font-size: 1.15rem; font-weight: 800; color: #8a6a12; margin-top: -4px; }
    .card-w .t.long { font-size: .95rem; }
    .card-w .t.xlong { font-size: .78rem; }
    .mcard .t.long { font-size: clamp(1rem, 4vw, 1.4rem); }
    .mcard .t.xlong { font-size: clamp(.85rem, 3.4vw, 1.15rem); }
    .wordbtn .tw.long { font-size: clamp(1.9rem, 9vw, 3rem); }
    .wordbtn .tw.xlong { font-size: clamp(1.5rem, 7vw, 2.4rem); }
    #wordPop .tw.long { font-size: 1.35rem; }
    #wordPop .tw.xlong { font-size: 1.1rem; }
    @keyframes wiggle { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-12deg) scale(1.1); } 40% { transform: rotate(10deg) scale(1.1); } 60% { transform: rotate(0); } }
    .banner { min-height: 1.5em; font-size: 1.35rem; font-weight: 900; text-align: center; color: #2fb34e; }
    .banner.bad { color: #b3261e; }
    .banner .tw { font-family: var(--tamil); }
    .choices { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 10px; width: min(100%, 52dvh); }
    .choices.n3 { width: min(100%, 86dvh); }
    .tile { position: relative; container-type: inline-size; display: grid; place-items: center; aspect-ratio: 1; padding: 0; border: 4px solid #eadfbf; border-radius: 24px; background: linear-gradient(#fff, #fbf3dc); box-shadow: 0 5px 0 #d8c690; transition: transform .2s, opacity .3s, border-color .2s; }
    .tile .pic { --ps: 78cqw; }
    .tile:active { transform: translateY(3px) scale(.98); box-shadow: 0 2px 0 #d8c690; }
    .tile.right { border-color: #2fb34e; background: linear-gradient(#e9ffee, #bff2cb); animation: yes .7s ease; }
    .tile.wrong { border-color: #ff8a80; background: #fff1f0; animation: no .45s ease; }
    .tile.dim { opacity: .3; }
    .tile:disabled { cursor: default; }
    @keyframes yes { 0% { transform: scale(1); } 40% { transform: scale(1.12) rotate(-3deg); } 70% { transform: scale(1.06) rotate(3deg); } 100% { transform: scale(1.05); } }
    @keyframes no { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 50% { transform: translateX(8px); } 80% { transform: translateX(-4px); } }

    .mcards { display: flex; gap: 10px; width: 100%; justify-content: center; }
    .mcard { flex: 1 1 0; max-width: 190px; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 8px 4px 10px; border: 4px solid #eadfbf; border-radius: 22px; background: linear-gradient(#fff, #fbf3dc); box-shadow: 0 4px 0 #d8c690; text-align: center; }
    .mcard.on { border-color: #ffb300; background: linear-gradient(#fffbe6, #ffefb0); animation: yes .7s ease; }
    .mcards { flex-wrap: wrap; }
    .mcards.many .mcard { flex: 1 1 calc(50% - 10px); max-width: 170px; }
    .mcards.many .mcard .pbox { width: 62%; }
    .mcards.many .mcard .t { font-size: clamp(1.1rem, 4.4vw, 1.5rem); }
    .mcard .pbox { width: 86%; }
    .mcard .t { font-family: var(--tamil); font-size: clamp(1.3rem, 5vw, 1.9rem); font-weight: 800; line-height: 1.25; }
    .mcard .r { font-size: 1rem; font-weight: 800; color: var(--soft); }
    .mcard .d { font-size: .95rem; color: #9b92bb; font-weight: 700; }
    .hintline { margin: 0; color: var(--soft); font-weight: 700; text-align: center; }

    .doorart { width: 110px; flex: none; animation: glow 2s ease-in-out infinite alternate; }
    .doorart svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 14px #ffd54f); }
    .stars3 { display: flex; gap: 6px; }
    .stars3 svg { width: clamp(52px, 14vw, 70px); height: auto; opacity: .25; filter: grayscale(1); transform: scale(.6); }
    .stars3 svg.on { opacity: 1; filter: none; animation: starpop .6s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: var(--d); }
    @keyframes starpop { from { transform: scale(0) rotate(-180deg); } to { transform: scale(1) rotate(0); } }
    .learned { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chip { display: flex; align-items: center; gap: 6px; padding: 4px 14px 4px 6px; border: 0; border-radius: 999px; background: #fff; box-shadow: 0 2px 0 #d8c690; font-weight: 800; }
    .chip .pbox { width: 36px; }
    .chip .ta { font-size: 1.15rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .petal { position: fixed; top: -30px; z-index: 41; pointer-events: none; border-radius: 50% 0 50% 0; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

    #settings { display: grid; gap: 10px; }

    /* ===== Designløft (UI/UX-pas): popups, knapper, HUD og kort ===== */
    .overlay { background: radial-gradient(ellipse at 50% 40%, #0a1a1088, #04100acc); animation: fadein .25s ease; }
    @keyframes fadein { from { opacity: 0; } }
    .card { position: relative; border: 0; border-radius: 32px; padding: 18px 16px 16px; gap: 12px; background: linear-gradient(#fffdf6, #fdf0cf); box-shadow: 0 0 0 4px #f5b83d, 0 0 0 7px #8a5a0f55, 0 24px 60px #000a, inset 0 2px 0 #fff; }
    .card::before { content: ""; position: absolute; left: 50%; top: -9px; width: 76px; height: 14px; border-radius: 999px; transform: translateX(-50%); background: linear-gradient(#ffe08a, #f5b83d); box-shadow: 0 2px 0 #b57b05; }
    .card h3 { color: #5a3410; font-size: 1.55rem; letter-spacing: .01em; }
    .why { gap: 10px; padding: 6px 16px 6px 8px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 2px #f1d58a; font-size: .98rem; line-height: 1.25; }
    .why svg { width: 46px; height: 46px; }
    .wordbtn { position: relative; padding: 8px 30px 12px; border-radius: 26px; background: linear-gradient(#fff8d8, #ffe08a); box-shadow: 0 6px 0 #d6a93a, 0 14px 24px #0003, inset 0 2px 0 #fff; }
    .wordbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d6a93a, 0 4px 10px #0003; }
    .wordbtn .tw { line-height: 1.5; padding-bottom: 2px; }
    .wordbtn .rm { margin-top: 2px; padding: 1px 12px; border-radius: 999px; background: #ffffffa6; font-size: 1.05rem; }
    .banner { min-height: 2em; padding: 2px 14px; font-size: 1.3rem; }
    .banner:not(:empty) { border-radius: 999px; background: #e9ffee; box-shadow: inset 0 0 0 2px #8be0a0; animation: rise .3s cubic-bezier(.2, 1.4, .4, 1); }
    .banner.bad:not(:empty) { background: #fff0ee; box-shadow: inset 0 0 0 2px #ffb4ab; }
    .choices { gap: 12px; width: min(100%, 56dvh, max(190px, calc(100dvh - 370px))); }
    .choices.n3 { width: min(100%, 90dvh); }
    .screen { overflow-x: hidden; }
    .tile { border: 0; border-radius: 26px; background: linear-gradient(#ffffff, #fbf1d6); box-shadow: 0 0 0 3px #e6d6a3, 0 7px 0 #d3bd7c, 0 14px 22px #0002; }
    .tile:hover { transform: translateY(-2px); }
    .tile:active { transform: translateY(5px); box-shadow: 0 0 0 3px #e6d6a3, 0 2px 0 #d3bd7c; }
    .tile.right { box-shadow: 0 0 0 4px #2fb34e, 0 7px 0 #1d8a37, 0 0 28px #2fb34e88; }
    .tile.wrong { box-shadow: 0 0 0 4px #ff8a80, 0 7px 0 #d9645a; }
    .mcard { border: 0; border-radius: 24px; padding: 10px 6px 12px; box-shadow: 0 0 0 3px #e6d6a3, 0 6px 0 #d3bd7c, 0 12px 18px #0002; animation: rise .4s cubic-bezier(.2, 1.4, .4, 1) both; }
    .mcard:nth-child(2) { animation-delay: .06s; }
    .mcard:nth-child(3) { animation-delay: .12s; }
    .mcard:nth-child(4) { animation-delay: .18s; }
    .mcard.on { box-shadow: 0 0 0 4px #ffb300, 0 6px 0 #c98600, 0 0 26px #ffb30088; }
    .badge { padding: 1px 10px; font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; }
    .chip { border: 0; padding: 4px 16px 4px 6px; box-shadow: 0 0 0 2px #e6d6a3, 0 3px 0 #d3bd7c; }
    .chip:active { transform: translateY(2px); }
    .doorart { width: 120px; }
    .stars3 svg { filter: drop-shadow(0 3px 0 #b57b0555); }
    .hud { padding: 2px 0; }
    .hud .title { padding: 5px 12px; border-radius: 14px; background: #0000004d; }
    .score { padding: 3px 10px; border-radius: 12px; background: #0000004d; min-width: 56px; }
    .score span { font-size: .6rem; }
    .score b { font-size: 1.1rem; }
    .pips { padding: 4px 8px; border-radius: 12px; background: #0000004d; }
    #stage { box-shadow: inset 0 0 0 3px #ffffff30, 0 0 0 3px #f5b83d55, 0 10px 26px #0007; }
    #startHint { padding: 10px 22px; background: linear-gradient(#ffe08a, #f5b83d); color: #4a2f00; box-shadow: 0 5px 0 #b57b05, 0 10px 18px #0005; }
    .hero h1 { text-shadow: 0 3px 0 #0006, 0 0 24px #f5b83d55; }
    .card-w { border: 0; box-shadow: 0 0 0 2px #ffffff80, 0 4px 0 #0005; }
    .dict { gap: 12px; }
    .head { position: sticky; top: 0; z-index: 3; padding: 4px 0 6px; background: linear-gradient(#0a2a1be6, #0a2a1b00); }
    .mute-note { background: #fff1c9; color: #7a4a00; box-shadow: inset 0 0 0 2px #f1d58a; }

    /* ===== Design 2027 (samme sprog som Hej Haj): glas, dybde, rolige farver og blød bevægelse i popups ===== */
    .overlay .btn { border: 0; border-radius: 18px; min-height: 56px; padding: 10px 26px; background: linear-gradient(135deg, #fde68a, #fbbf24); color: #3b2a00; font-weight: 800; letter-spacing: 0; box-shadow: 0 10px 24px #fbbf2459, inset 0 1px 0 #ffffff99; transition: transform .25s cubic-bezier(.2, .9, .3, 1.4), box-shadow .2s, filter .2s; }
    .overlay .btn::after { display: none; }
    .overlay .btn:active { transform: scale(.96); box-shadow: 0 4px 12px #fbbf244d; }
    .overlay .btn.green { background: linear-gradient(135deg, #bef264, #4ade80 55%, #2dd4bf); color: #052e16; box-shadow: 0 12px 28px #4ade8066, inset 0 1px 0 #ffffff8c; }
    .overlay .btn.green:active { box-shadow: 0 4px 12px #4ade8055; }

    .overlay { background: radial-gradient(80% 55% at 50% 0%, #4ade8030, transparent 65%), #030f08c7; backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); }
    .card { color: #fff; border: 1px solid #ffffff2b; background: linear-gradient(165deg, #ffffff29, #ffffff0a 45%), #0a2a1cb8; box-shadow: 0 40px 90px #0000008c, 0 0 0 1px #ffffff0a, inset 0 1px 0 #ffffff47; backdrop-filter: blur(30px) saturate(1.5); -webkit-backdrop-filter: blur(30px) saturate(1.5); animation: sheetIn .55s cubic-bezier(.16, 1, .3, 1); }

    @keyframes sheetIn { from { transform: translateY(26px) scale(.96); opacity: 0; filter: blur(6px); } }

    .wordbtn { gap: 6px; min-width: 240px; padding: 14px 28px; background: linear-gradient(180deg, #ffffff22, #ffffff0a); border: 1px solid #ffffff33; border-radius: 28px; box-shadow: 0 16px 40px #0000004d, inset 0 1px 0 #ffffff33; color: #fff; transition: transform .25s cubic-bezier(.2, .9, .3, 1.4); }
    .wordbtn:active { transform: scale(.97); box-shadow: 0 8px 20px #0000004d, inset 0 1px 0 #ffffff33; }
    .wordbtn .tw { background: linear-gradient(180deg, #fff 25%, #fde68a); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; line-height: 1.5; filter: drop-shadow(0 4px 20px #fde68a59); }

    .wave i:nth-child(2) { animation-delay: .12s !important; }

    .wave i:nth-child(5) { animation-delay: .48s !important; }
    @keyframes wv { 0%, 100% { height: 6px; } 50% { height: 20px; } }
    .banner { color: #86efac; font-size: 1.1rem; font-weight: 800; }
    .banner:not(:empty) { background: #22c55e29; border: 1px solid #22c55e66; box-shadow: none; border-radius: 999px; }
    .banner.bad { color: #fecdd3; }
    .banner.bad:not(:empty) { background: #fb718529; border-color: #fb718566; box-shadow: none; }
    .mute-note { background: #fbbf2424; color: #fde68a; box-shadow: none; border: 1px solid #fbbf2455; }
    .tile { border: 0; border-radius: 26px; background: linear-gradient(180deg, #fff, #f3f8e6); box-shadow: 0 14px 30px #00000059, inset 0 -4px 0 #3f6b1a20; transition: transform .25s cubic-bezier(.2, .9, .3, 1.4), box-shadow .25s, opacity .3s, filter .3s; }
    .tile:hover { transform: translateY(-3px); }

    .tile.right { background: linear-gradient(180deg, #f2fff9, #c6f6df); box-shadow: 0 0 0 4px #34d399, 0 0 44px #34d39999, 0 14px 30px #00000059; animation: yes .6s ease; }
    .tile.right::after { content: "✓"; position: absolute; top: 8px; right: 8px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #22c55e; color: #fff; font-size: 16px; font-weight: 900; box-shadow: 0 4px 10px #0004; }
    .tile.wrong { background: linear-gradient(180deg, #fff6f7, #ffe0e4); box-shadow: 0 0 0 4px #fb7185, 0 0 40px #fb718580; }

    .mcard { border: 0; background: linear-gradient(180deg, #fff, #f3f8e6); box-shadow: 0 14px 30px #0000004d; color: #14281b; }

    .chip .pbox { background: #fff; border-radius: 12px; padding: 2px; }
    #wordPop { background: #0a2a1c94; backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); border: 1px solid #ffffff38; color: #fff; box-shadow: 0 14px 34px #00000059; }
    #wordPop .pbox { background: #fff; border-radius: 16px; padding: 3px; }

    @media (max-width: 380px) { .card { padding: 16px 10px 12px; } .choices { gap: 8px; } .btn { padding: 8px 16px; } .hud .title { padding: 4px 8px; } }

    /* Tamilsk tekst må aldrig stikke ud: den holdes på én linje og krympes af fitAll() til den passer i sin ramme */
    .card-w .t, .mcard .t, .wordbtn .tw, #wordPop .tw, .chip .ta { display: block; max-width: 100%; min-width: 0; white-space: nowrap; text-align: center; }

    @media (min-width: 1000px) and (min-height: 700px) { .card { width: min(100%, 720px); } }

    }
    #settings label { display: grid; gap: 4px; font-weight: 800; color: #27426f; }
    #settings select, #settings button { min-height: 44px; padding: 6px 10px; border: 2px solid #dfe7f3; border-radius: 12px; background: #f7faff; color: #27426f; font: inherit; font-weight: 700; }

    @media (orientation: landscape) and (max-height: 560px) {
      #home { flex-direction: row; flex-wrap: wrap; justify-content: center; align-content: center; gap: 8px 22px; }
      .temple { width: 22dvh; }

      .wordbtn { min-width: 0; padding: 4px 18px 6px; }

      .mcards { gap: 8px; }
      .mcard .pbox { width: min(78%, 22dvh); }
      .mcard { padding: 4px 4px 6px; }
      .mcard .t { font-size: 1.4rem; }
      .hintline { display: none; }
      #meet .eyebrow { display: none; }

    }
    @media (prefers-reduced-motion: reduce) { .mascot, .wordbtn .spk, .temple, .doorart, #startHint, .overlay, .card, .mcard, .banner, .tile, .stars3 svg.on { animation: none !important; } }

</head>
<body>
  <div id="bg"></div>
  <main class="app">
    <section class="screen" id="home">
      <div class="hero">
        <button class="mascot" id="mascot" type="button" aria-label="Urundai"><span class="eye l"></span><span class="eye r"></span><span class="mouth"></span></button>

          <h1>Urundai</h1>

      <div class="homebtns">

    <section class="screen" id="dictScreen" hidden>
      <div class="head">

  <div class="overlay" id="meet" hidden>

  <div class="overlay" id="quiz" hidden>

        <button class="wordbtn" id="quizWord" type="button" aria-label="Hør ordet igen">
          <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>

        <button class="btn" id="quizRetry" type="button" hidden>↻ Prøv banen igen</button>

      <div class="learned" id="doneWords"></div>
      <div class="actions">
        <button class="btn green" id="doneNext" type="button">Næste bane ▶</button>
        <button class="btn ghost" id="doneHome" type="button">Hjem</button>
      </div>

  </div>

  <div id="settings" hidden>
    <label>Fart
      <select id="optSpeed">
        <option value="rolig">Rolig</option>
        <option value="normal">Normal</option>
        <option value="hurtig">Hurtig (som originalen)</option>
      </select>
    </label>
    <label>Antal billeder i spørgsmål
      <select id="optChoices">
        <option value="auto">Automatisk (starter med 2)</option>
        <option value="2">Altid 2</option>
        <option value="3">Altid 3</option>
        <option value="4">Altid 4</option>
      </select>
    </label>
    <label>Udtale med latinske bogstaver
      <select id="optRom">
        <option value="1">Vis</option>
        <option value="0">Skjul</option>
      </select>
    </label>
    <button id="optReset" type="button">↺ Start forfra fra bane 1</button>
  </div>

  <script src="../../topbar.js"></script>
  <script src="ord.js"></script>
  <script src="laengder.js"></script>
  <script src="billeder.js"></script>
  <script>
  (() => {
    "use strict";
    const R = window.UrundaiOrd;
    const Art = window.UrundaiArt;
    const WORDS = R.words;
    const ALL = Object.keys(WORDS);
    const $ = (id) => document.getElementById(id);
    const kid = new URLSearchParams(location.search).get("barn") === "riyana" ? "riyana" : "ari";
    const key = (name) => `urundai-${kid}-${name}`;
    const read = (name, fallback) => { try { const v = localStorage.getItem(key(name)); return v === null ? fallback : v; } catch { return fallback; } };
    const write = (name, value) => { try { localStorage.setItem(key(name), String(value)); } catch { /* ingen lagring */ } };
    const readJSON = (name, fallback) => { try { return JSON.parse(read(name, "")) || fallback; } catch { return fallback; } };

    const wordState = readJSON("words", {}); // id -> { box 0-3, seen, ok, bad }
    let stars = Number(read("stars", "0")) || 0;
    let nextLevel = Math.max(1, Number(read("level", "1")) || 1);
    let hiScore = Number(read("rekord", "0")) || 0;
    let muted = !Topbar.soundOn();
    window.addEventListener("topbar:sound", (e) => { muted = !e.detail.on; if (muted) stopSpeech(); });

    const ws = (id) => wordState[id] || (wordState[id] = { box: 0, seen: false, ok: 0, bad: 0, t: 0 });
    const saveWords = () => write("words", JSON.stringify(wordState));
    const rnd = (n) => Math.floor(Math.random() * n);
    const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const seenCount = () => ALL.filter((id) => ws(id).seen).length;
    const seenIds = () => ALL.filter((id) => ws(id).seen);

    // Gentagelse: ord, barnet er svagest til eller ikke har set længe, trækkes oftest (men altid med tilfældighed)
    function weight(id) {
      const st = ws(id);
      const stale = Math.min(3, (Date.now() - (st.t || 0)) / 600000);
      return Math.max(.6, 4 - st.box) + stale;
    }
    function pickWeighted(ids, n, exclude = []) {
      const pool = ids.filter((id) => !exclude.includes(id));
      const out = [];
      while (out.length < n && pool.length) {
        let r = Math.random() * pool.reduce((s, id) => s + weight(id), 0);
        let k = 0;
        for (; k < pool.length - 1; k++) { r -= weight(pool[k]); if (r <= 0) break; }
        out.push(pool.splice(k, 1)[0]);
      }
      return out;
    }

    // ---------- Farver og fart ----------
    // wall = stenmure, floor = mørk tempelgang. Guldkanten (rim) svarer til de blå linjer i originalen.
    const PALETTES = [
      { bg1: "#5b2a86", bg2: "#14683a", wall: "#7a3350", wallHi: "#93445f", floor: "#1c1020", rim: "#f2b63f" },
      { bg1: "#16327e", bg2: "#0f766e", wall: "#2c4a8a", wallHi: "#3b5ea6", floor: "#0c1230", rim: "#f5c04a" },
      { bg1: "#9a3412", bg2: "#4d7c0f", wall: "#8a4a1f", wallHi: "#a65c28", floor: "#22120a", rim: "#f0a53a" },
      { bg1: "#065f46", bg2: "#15803d", wall: "#46682e", wallHi: "#5a8239", floor: "#0e1f12", rim: "#e6b94a" }
    ];
    // Ghost-sprites: 0 tiger (rød), 1 abe (lyserød), 2 påfugl (cyan), 3 kobra (orange) som i originalen
    const GK = [
      { k: "puli", body: "#ef5a1a", dark: "#9a2f00", light: "#ffd9b8" },
      { k: "bandar", body: "#e79ab0", dark: "#9a4a66", light: "#fde1ea" },
      { k: "mayil", body: "#1fc3cf", dark: "#0e7c86", light: "#c8f6f9" },
      { k: "naga", body: "#f0a03a", dark: "#a05a00", light: "#ffe6b8" }
    ];
    const FACT = { rolig: .55, normal: .75, hurtig: 1 };
    const PHASES = {
      rolig: [9, 14, 9, 14, 7, 14, 7, 1e9],
      normal: [7, 20, 7, 20, 5, 20, 5, 1e9],
      hurtig: [7, 20, 7, 20, 5, 20, 5, 1e9]
    };
    const BASE = 9.47; // felter pr. sekund ved 100 % (som originalen)
    let speedKey = FACT[read("fart", "")] ? read("fart", "") : (kid === "riyana" ? "rolig" : "normal");

    // ---------- Billeder ----------
    const imgCache = new Map();
    function artImg(keyName) {
      let img = imgCache.get(keyName);
      if (!img) { img = new Image(); img.src = Art.dataUri(Art.get(keyName)); imgCache.set(keyName, img); }
      return img;
    }
    function pic(id) {
      const p = WORDS[id].pic;
      const el = document.createElement("div");
      el.className = "pic";
      if (p.color) el.innerHTML = Art.swatch(p.color);
      else if (p.count) el.innerHTML = Art.get(`n${p.count}`);
      else el.innerHTML = Art.get(p.art);
      return el;
    }
    function picBox(id) {
      const box = document.createElement("div");
      box.className = "pbox";
      box.append(pic(id));
      return box;
    }
    const starSvg = (cls = "") => `<svg class="${cls}" viewBox="0 0 100 96" aria-hidden="true"><polygon points="50,4 62,36 96,37 69,58 79,91 50,72 21,91 31,58 4,37 38,36" fill="#ffc933" stroke="#e08a00" stroke-width="5" stroke-linejoin="round"/></svg>`;
    // Lange tamilske ord får mindre skrift, så de kan være i kortene
    const lenCls = (txt) => (txt.length >= 11 ? "xlong" : txt.length >= 8 ? "long" : "");
    // Krymper tamilsk tekst, til den passer i sin ramme (aldrig ud over kanten)
    const FIT = ".card-w .t, .mcard .t, .wordbtn .tw, #wordPop .tw, .chip .ta";
    function fitAll() {
      for (const el of document.querySelectorAll(FIT)) {
        el.style.fontSize = "";
        if (!el.clientWidth) continue; // skjult
        let fs = parseFloat(getComputedStyle(el).fontSize);
        for (let i = 0; i < 30 && el.scrollWidth > el.clientWidth + 1 && fs > 10; i++) {
          fs *= .92;
          el.style.fontSize = `${fs.toFixed(1)}px`;
        }
      }
    }
    const fitSoon = () => { fitAll(); requestAnimationFrame(fitAll); setTimeout(fitAll, 250); };
    window.addEventListener("resize", fitSoon);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSoon);

    // ---------- Lyd ----------
    // Mobiler (især iPhone/iPad) tillader kun lyd, hvis afspilleren er "låst op" af en berøring. Derfor låses den op ved første tryk,
    // og afvises et klip alligevel, gemmes det og spilles ved næste tryk (med en lille tekst om det).
    const clip = new Audio();
    clip.preload = "auto";
    const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
    let speechToken = 0;
    let speechDone = null;
    let unlocked = false;
    let pendingSpeech = null;
    let soundNote = "";
    function setNote(text) {
      soundNote = text;
      for (const id of ["quizNote", "meetNote"]) {
        const el = $(id);
        if (el) { el.textContent = text; el.hidden = !text; }
      }
    }
    const refreshNote = () => setNote(muted ? "🔇 Lyden er slået fra. Slå den til i ⚙️." : pendingSpeech ? "🔈 Tryk på skærmen for at høre ordet." : "");
    function unlockAudio() {
      if (unlocked) return;
      unlocked = true;
      audio();
      try {
        clip.src = SILENT;
        const p = clip.play();
        if (p && p.catch) p.catch((err) => { if (err && err.name === "NotAllowedError") unlocked = false; });
      } catch { unlocked = false; }
    }
    function stopSpeech() {
      speechToken++;
      $("quizWord").classList.remove("speaking");
      clip.onended = null;
      clip.onerror = null;
      clip.onplaying = null;
      clip.pause();
      if (speechDone) { const d = speechDone; speechDone = null; d(false); }
    }
    // Svarer true, når klippet er spillet til ende, og false, hvis noget andet afbrød det eller afspilningen blev afvist
    function speak(id) {
      stopSpeech();
      const token = speechToken;
      return new Promise((resolve) => {
        let finished = false;
        let safety = 0;
        let endTimer = 0;
        const finish = (ok) => {
          if (finished) return;
          finished = true;
          if (token === speechToken) $("quizWord").classList.remove("speaking");
          clearTimeout(safety);
          clearTimeout(endTimer);
          if (speechDone === done) speechDone = null;
          resolve(ok && token === speechToken);
        };
        const done = (ok) => finish(ok);
        speechDone = done;
        $("quizWord").classList.add("speaking");
        if (muted) { setTimeout(() => finish(true), 500); return; }
        clip.onended = () => finish(true);
        clip.onerror = () => setTimeout(() => finish(true), 300);
        // Stemmen lægger stilhed efter ordet: gå videre, så snart ordet er sagt
        const len = (window.UrundaiLaengder || {})[id];
        clip.onplaying = () => {
          clip.onplaying = null;
          if (len) endTimer = setTimeout(() => { if (token === speechToken) { clip.pause(); finish(true); } }, (len + .25) * 1000);
        };
        clip.src = `lyd/${id}.mp3`;
        const p = clip.play();
        if (p && p.catch) {
          p.catch((err) => {
            if (token !== speechToken) return; // et nyt klip afbrød dette
            if (err && err.name === "NotAllowedError") { unlocked = false; pendingSpeech = id; refreshNote(); finish(false); } else setTimeout(() => finish(true), 300);
          });
        }
        if (pendingSpeech === id) { pendingSpeech = null; refreshNote(); }
        safety = setTimeout(() => finish(true), 6000);
      });
    }
    for (const ev of ["pointerdown", "touchend", "keydown"]) {
      document.addEventListener(ev, () => {
        unlockAudio();
        if (pendingSpeech) { const id = pendingSpeech; pendingSpeech = null; refreshNote(); speak(id); }
      }, true);
    }
    window.addEventListener("topbar:sound", refreshNote);
    let ac = null;
    function audio() {
      if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; } }
      if (ac && ac.state === "suspended") ac.resume();
      return ac;
    }
    function tone(freq, dur = .15, type = "sine", vol = .12, delay = 0, slide = 0) {
      if (muted) return;
      const a = audio();
      if (!a) return;
      const t = a.currentTime + delay;
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(a.destination);
      o.start(t);
      o.stop(t + dur + .03);
    }
    let chompFlip = false;
    const sfx = {
      chomp: () => { chompFlip = !chompFlip; tone(chompFlip ? 330 : 440, .06, "square", .04); },
      power: () => { tone(300, .2, "triangle", .12, 0, 500); tone(600, .25, "triangle", .1, .12); },
      eat: () => { tone(500, .12, "square", .08, 0, 600); tone(900, .12, "square", .06, .08); },
      fruit: () => { tone(880, .1, "triangle", .1); tone(1320, .14, "triangle", .1, .09); },
      caught: () => { [440, 370, 311, 262, 196, 147].forEach((f, i) => tone(f, .16, "sawtooth", .08, i * .12)); },
      ready: () => { [392, 523, 659, 784].forEach((f, i) => tone(f, .16, "triangle", .08, i * .15)); },
      wrong: () => tone(220, .28, "triangle", .1, 0, -90),
      right: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, "triangle", .12, i * .09)),
      fanfare: () => [523, 659, 784, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .28, "triangle", .13, i * .12)),
      pop: () => { tone(480, .1, "triangle", .12, 0, 380); tone(760, .12, "triangle", .08, .08); }
    };
    const buzz = (ms) => { if (!muted && navigator.vibrate) navigator.vibrate(ms); };

    // ---------- Skærme ----------
    const SCREENS = ["home", "dictScreen", "play"];

    paintBg();

    function renderHome() {
      $("playBtn").textContent = nextLevel > 1 ? `▶ Spil · bane ${nextLevel}` : "▶ Spil";
      $("dictCount").textContent = `(${seenCount()}/${ALL.length})`;
    }

    function renderDict() {
      const body = $("dictBody");

          card.addEventListener("click", () => { audio(); speak(id); card.animate([{ transform: "scale(1)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 300 }); });

    }

    // ---------- Banen: samme felt-labyrint som i Pac-Man (28 × 31 felter) ----------
    // # mur, _ uden for banen, . blomst, o lotus (kraftprik), mellemrum tom gang, T tunnel, - port, H spøgelseshuset
    const MAP = [
      "############################",
      "#............##............#",
      "#.####.#####.##.#####.####.#",
      "#o####.#####.##.#####.####o#",
      "#.####.#####.##.#####.####.#",
      "#..........................#",
      "#.####.##.########.##.####.#",
      "#.####.##.########.##.####.#",
      "#......##....##....##......#",
      "######.#####_##_#####.######",
      "_____#.#####_##_#####.#_____",
      "_____#.##          ##.#_____",
      "_____#.## ###--### ##.#_____",
      "######.## #HHHHHH# ##.######",
      "TTTTTT.   #HHHHHH#   .TTTTTT",
      "######.## #HHHHHH# ##.######",
      "_____#.## ######## ##.#_____",
      "_____#.##          ##.#_____",
      "_____#.## ######## ##.#_____",
      "######.## ######## ##.######",
      "#............##............#",
      "#.####.#####.##.#####.####.#",
      "#.####.#####.##.#####.####.#",
      "#o..##.......  .......##..o#",
      "###.##.##.########.##.##.###",
      "###.##.##.########.##.##.###",
      "#......##....##....##......#",
      "#.##########.##.##########.#",
      "#.##########.##.##########.#",
      "#..........................#",
      "############################"
    ];
    // Rækken over huset ligger tom, så mellemrum i række 9 er gang uden blomster
    MAP[9] = "######.##### ## #####.######";
    MAP[10] = "_____#.##### ## #####.#_____";
    const COLS = 28;
    const ROWS = 31;
    const DX = [0, 1, 0, -1];
    const DY = [-1, 0, 1, 0];
    const EPS = 1e-6;
    const NOUP = new Set(["12,11", "15,11", "12,23", "15,23"]);
    const CORNER = [[25, -3], [2, -3], [27, 31], [0, 31]];
    const FRUITS = ["mango", "banan", "kokos", "jakfrugt"];
    const FRUIT_POINTS = [100, 300, 500, 700, 1000, 2000, 3000, 5000];

    function tileAt(tx, ty) {
      if (ty < 0 || ty >= ROWS) return "#";
      if (tx < 0 || tx >= COLS) { if (ty !== 14) return "#"; tx = (tx + COLS) % COLS; }
      return MAP[ty][tx];
    }
    const pacPass = (tx, ty) => ".o T".includes(tileAt(tx, ty));
    const ghostPass = (tx, ty, eyes) => {
      const c = tileAt(tx, ty);
      return ".o T".includes(c) || (eyes && (c === "-" || c === "H"));
    };

    const stage = $("stage");
    const cv = $("cv");
    const ctx = cv.getContext("2d");
    let SW = 0;
    let SH = 0;
    let dpr = 1;
    let geo = { t: 10, ox: 0, oy: 0 };
    let G = null; // banens tilstand
    let pac = null;
    let ghosts = [];
    let boards = [null, null];
    let state = "home"; // ready, play, dying, won, quiz, meet, done
    let time = 0;
    let readyT = 0;
    let runScore = 0; // point fra de klarede baner i denne omgang
    let popups = [];
    const READY_TIME = 2.2;

    function resize() {
      const r = stage.getBoundingClientRect();
      SW = r.width;
      SH = r.height;
      dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.max(1, Math.round(SW * dpr));
      cv.height = Math.max(1, Math.round(SH * dpr));
      cv.style.width = `${SW}px`;
      cv.style.height = `${SH}px`;
      if (G && SW > 0) { layoutGeo(); renderBoards(); }
    }
    // Felterne må være op til 70 % højere (eller bredere) end de er brede, så labyrinten udnytter en høj mobilskærm.
    // t er den mindste side og bruges til figurernes størrelse.
    function layoutGeo() {
      const pad = SW < 520 ? 4 : 10;
      const base = Math.max(4, Math.min((SW - pad * 2) / COLS, (SH - pad * 2) / ROWS));
      const tx = Math.min((SW - pad * 2) / COLS, base * 1.7);
      const ty = Math.min((SH - pad * 2) / ROWS, base * 1.7);
      geo = { t: Math.min(tx, ty), tx, ty, ox: Math.round((SW - tx * COLS) / 2), oy: Math.round((SH - ty * ROWS) / 2) };
    }

    // Farten i felter pr. sekund. Den vokser lidt for hver bane.
    function speeds() {
      const f = FACT[speedKey] * Math.min(1.25, 1 + .03 * (G.n - 1));
      return { pac: BASE * .8 * f, ghost: BASE * .75 * f, fright: BASE * .5 * f, tunnel: BASE * .4 * f, eyes: BASE * 1.4 * f, house: BASE * .45 * f };
    }

    function pickNew(n) {
      return shuffle(ALL.filter((id) => !ws(id).seen)).slice(0, n);
    }
    // Gamle ord, der skal øves igen (de svageste og dem, barnet ikke har set længe, trækkes oftest)
    function pickReview(exclude) {
      return pickWeighted(seenIds(), 2, exclude);
    }

    function loadLevel(n, keepWords, keepReview) {
      const dots = new Uint8Array(COLS * ROWS);
      let total = 0;
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const c = MAP[y][x];
          if (c === "." || c === "o") { dots[y * COLS + x] = c === "o" ? 2 : 1; total++; }
        }
      }
      const fresh = keepWords || pickNew(2);
      G = {
        n, dots, total, left: total, eaten: 0, lifeDots: 0, noDot: 0, caught: 0,
        pal: PALETTES[rnd(PALETTES.length)],
        newWords: fresh,
        reviewWords: keepReview || pickReview(fresh),
        ghostsN: kid === "riyana" ? (n < 2 ? 1 : n < 6 ? 2 : 3) : (n < 2 ? 2 : n < 3 ? 3 : 4),
        score: runScore, phase: 0, phaseT: 0, frightT: 0, chain: 0, freeze: 0,
        fruit: null, fruitSeen: [false, false], bonus: 0, flash: 0, wonT: 0, frightLen: Math.max(3, 8 - .6 * n)
      };
      resetActors();
      layoutGeo();
      stage.style.backgroundImage = sceneUri(G.pal.bg1, G.pal.bg2, SW > SH);
      $("playTitle").textContent = `Bane ${n}`;
      setScore();
      renderFoot();
      renderBoards();
    }

    function resetActors() {
      pac = { x: 14, y: 23.5, dir: 3, face: 3, want: -1, wantT: 0, since: 1, lc: null, chew: 0, dying: 0 };
      ghosts = [0, 1, 2, 3].slice(0, G.ghostsN).map((id) => ({
        id, x: id === 0 ? 14 : [14, 12, 16][id - 1], y: id === 0 ? 11.5 : 14.5,
        dir: id === 0 ? 3 : -1, mode: id === 0 ? "active" : "house", fright: false, anim: id, wait: 0
      }));
      G.lifeDots = 0;
      G.noDot = 0;
      G.phase = 0;
      G.phaseT = 0;
      G.frightT = 0;
      G.chain = 0;
      G.fruit = null;
      G.freeze = 0;
      popups = [];
    }

    function startLevel(n) {

    }

    function beginReady() {

    }

    // Ordkort under spillet: gentagelse uden at afbryde
    let popTimer = 0;
    function wordPop(id) {
      const el = $("wordPop");
