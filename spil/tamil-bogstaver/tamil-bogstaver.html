<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f5c6e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tamil-bogstaver">
  <title>Tamil-bogstaver – konsonant + vokal</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-synthesis: none;
      --ink: #2b2250;
      --tamil: "Noto Sans Tamil", "Nirmala UI", "Latha", "Tamil Sangam MN", "Trebuchet MS", sans-serif;
      --red: #e0534a; --red-l: #fbd9d5; --red-d: #a8261f;
      --green: #6fb23c; --green-l: #e3f2d3; --green-d: #3d7a17;
      --pink: #e68ab8; --pink-l: #f9dcea; --pink-d: #b0306f;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      height: 100vh;
      height: 100dvh;
      min-width: 320px;
      margin: 0;
      overflow-y: auto;
      overscroll-behavior: none;
      color: var(--ink);
      background: #f4efe2;
      -webkit-user-select: none;
      user-select: none;
    }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 3px solid #0f5c6e; outline-offset: 2px; }
    .ta { font-family: var(--tamil); }

    .app {
      display: flex; flex-direction: column; gap: 6px; height: 100%;
      padding: calc(var(--tb-h, 54px) + 6px) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    }

    /* Overskrift som i bogen: sekskant med enhedens nummer, banner, "Aktivitet 1" og fremskridt */
    .head { flex: none; display: flex; align-items: center; gap: 10px; height: 38px; }
    .ban { display: flex; align-items: center; height: 100%; padding-right: 14px; border-radius: 0 10px 10px 0; background: #0f4c5c; color: #fff; font-weight: 800; font-size: 1.05rem; }
    .hex { display: grid; place-items: center; width: 40px; height: 100%; margin-right: 8px; background: #111; color: #fff; font-weight: 900; font-size: 1.2rem; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); }
    .act { display: flex; align-items: center; gap: 6px; height: 100%; padding: 0 12px 0 6px; border-radius: 999px; background: #0f7a3d; color: #fff; font-weight: 800; font-size: .9rem; }
    .act b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #fff; color: #0f7a3d; }
    .track { position: relative; flex: 1; min-width: 80px; height: 22px; border-radius: 999px; background: #0000001f; box-shadow: inset 0 2px 4px #0003; }
    .fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--p, 0) * (100% - 30px) + 15px); border-radius: 999px; background: linear-gradient(#ffd54f, #f5a300); transition: width .5s cubic-bezier(.3, 1.4, .5, 1); }
    .ball { position: absolute; top: -4px; left: calc(var(--p, 0) * (100% - 30px)); width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #ffd9a0, #ff8a3d 48%, #d9480f); box-shadow: 0 3px 0 #8a2f08, inset 0 0 0 2px #fff9; transform: rotate(calc(var(--p, 0) * 1440deg)); transition: left .5s cubic-bezier(.3, 1.4, .5, 1), transform .5s ease-out; }
    .ball::before, .ball::after { content: ""; position: absolute; top: 28%; width: 22%; height: 28%; border-radius: 50%; background: #fff; box-shadow: inset -2px -2px 0 #1c1233; }
    .ball::before { left: 22%; }
    .ball::after { right: 22%; }
    .count { flex: none; min-width: 3.4em; text-align: right; font-weight: 900; color: #0f4c5c; font-variant-numeric: tabular-nums; }

    /* Siden: to blokke (அ og ஆ) med 18 rækker hver, som i bogen */
    .sheet { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: max(8px, 1.6vw); max-width: 1100px; width: 100%; margin: 0 auto; }
    .block { container-type: size; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .bhead { flex: none; height: clamp(30px, 6cqh, 46px); display: flex; align-items: center; gap: 8px; padding-bottom: 3px; }
    .badge { flex: none; height: 100%; aspect-ratio: 1; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: #e0185f; color: #fff; font-size: clamp(18px, 3.6cqh, 28px); font-weight: 800; line-height: 1.35; box-shadow: 0 3px 0 #9d0f42; }
    .badge:active { transform: translateY(2px); box-shadow: 0 1px 0 #9d0f42; }
    .eg { padding: 2px 10px; border-radius: 8px; background: #0f7a3d; color: #fff; font-weight: 800; font-size: clamp(12px, 2.6cqh, 16px); }

    .rows { --rh: calc((100cqh - clamp(30px, 6cqh, 46px)) / 18); flex: 1; min-height: 0; display: grid; grid-template-rows: repeat(18, minmax(0, 1fr)); gap: max(1px, calc(var(--rh) * .07)); }
    .row { --c: var(--red); --cl: var(--red-l); --cd: var(--red-d); position: relative; display: flex; align-items: center; gap: .14em; min-height: 0; padding: 0 .3em; border-radius: 999px; background: var(--c); font-size: min(calc(var(--rh) * .55), calc(100cqw / 8.4)); }
    .row.m { --c: var(--green); --cl: var(--green-l); --cd: var(--green-d); }
    .row.i { --c: var(--pink); --cl: var(--pink-l); --cd: var(--pink-d); }
    .cap { flex: none; height: 84%; display: grid; place-items: center; padding: 0; border: 0; border-radius: 999px; background: var(--cl); color: #1d1d1d; font-family: var(--tamil); font-size: 1em; font-weight: 700; line-height: 1; white-space: nowrap; }
    .cons { width: 1.75em; }
    .vow { width: 1.4em; }
    .ans { flex: 1; min-width: 1.6em; background: #fff; color: var(--cd); box-shadow: inset 0 0 0 .09em var(--c); transition: transform .2s; }
    .op { flex: none; width: .7em; text-align: center; color: #fff; font-weight: 900; font-size: .72em; line-height: 1; text-shadow: 0 1px 0 #0003; }
    .row.active .ans::after { content: "?"; color: var(--cd); font-family: "Trebuchet MS", sans-serif; font-weight: 900; opacity: .55; }
    .row.active .ans { animation: glow 1.1s ease-in-out infinite; }
    .row.ex .ans { background: #fff; }
    .cap.hi { background: #ffe066; box-shadow: 0 0 0 .12em #f5a300; transform: scale(1.1); z-index: 1; }
    .ans.pop { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
    .block.win .row { animation: wave .7s ease-in-out both; animation-delay: calc(var(--n) * 45ms); }
    @keyframes glow { 0%, 100% { box-shadow: inset 0 0 0 .09em var(--c), 0 0 0 0 #ffd54f; } 50% { box-shadow: inset 0 0 0 .09em var(--c), 0 0 0 .22em #ffd54fcc; } }
    @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
    @keyframes wave { 0%, 100% { transform: none; filter: none; } 40% { transform: scale(1.06) translateX(3px); filter: brightness(1.18); } }

    /* Spørgsmål: konsonant + vokal = ? */
    .overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 12px; background: #0b1b2bb3; animation: fade .18s ease-out; }
    @keyframes fade { from { opacity: 0; } }
    .card { position: relative; width: min(94vw, 460px); max-height: 94dvh; overflow-y: auto; padding: 16px 14px 14px; border-radius: 26px; background: #fffaf0; box-shadow: 0 18px 50px #0007; animation: rise .25s cubic-bezier(.3, 1.4, .5, 1); }
    @keyframes rise { from { transform: translateY(30px) scale(.94); opacity: 0; } }
    .x { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: #0000000f; font-size: 1.2rem; font-weight: 900; color: #6a6485; }
    .eqn { --c: var(--red); --cl: var(--red-l); --cd: var(--red-d); display: flex; align-items: center; justify-content: center; gap: 8px; margin: 4px 36px 12px 0; padding: 8px 10px; border-radius: 999px; background: var(--c); font-size: clamp(30px, 9vw, 46px); }
    .eqn.m { --c: var(--green); --cl: var(--green-l); --cd: var(--green-d); }
    .eqn.i { --c: var(--pink); --cl: var(--pink-l); --cd: var(--pink-d); }
    .eqn .cap { height: auto; min-width: 1.55em; padding: .08em .2em; }
    .eqn .a { min-width: 1.8em; }
    .eqn .op { width: auto; font-size: .7em; }
    .say { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 44px; margin: 0 0 12px; border: 0; border-radius: 14px; background: #e6f4ff; color: #0b5d9c; font-weight: 800; font-size: 1.05rem; }
    .say:active { transform: scale(.98); }
    .opts { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .opts[data-n="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .opt { display: grid; place-items: center; min-height: 92px; padding: 6px; border: 0; border-radius: 20px; background: var(--oc); color: #fff; font-family: var(--tamil); font-size: clamp(40px, 12vw, 58px); font-weight: 700; line-height: 1.1; box-shadow: 0 6px 0 var(--od), 0 10px 16px #0003; transition: transform .1s, box-shadow .1s, opacity .2s; }
    .opt:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--od); }
    .opt:disabled { cursor: default; }
    .opt.bad { opacity: .28; animation: shake .38s; box-shadow: none; transform: none; }
    .opt.good { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); background: #2fb34e; --od: #1d8a37; }
    @keyframes shake { 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
    .toast { min-height: 1.6em; margin: 10px 0 0; text-align: center; font-weight: 900; color: #0f7a3d; font-size: 1.15rem; }
    .toast.no { color: #a8261f; }
    @media (max-height: 520px) {
      .opts, .opts[data-n="3"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .opts[data-n="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .opt { min-height: 70px; font-size: 40px; }
      .eqn { font-size: 30px; margin-bottom: 8px; }
      .card { padding: 10px; }
      .say { min-height: 36px; margin-bottom: 8px; }
    }

    .done { text-align: center; }
    .done h2 { margin: 6px 0; font-size: 1.7rem; }
    .done p { margin: 4px 0 14px; font-weight: 700; color: #5a5280; }
    .done .big { font-size: 4rem; line-height: 1.1; }
    .btn { min-height: 54px; padding: 8px 26px; border: 0; border-radius: 18px; background: linear-gradient(#7be08a, #2fb34e); color: #07350f; font-size: 1.2rem; font-weight: 900; box-shadow: 0 5px 0 #1d8a37; }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1d8a37; }
    .btn.ghost { background: #eef0f5; color: #4a4670; box-shadow: 0 5px 0 #c9cde0; margin-left: 6px; }

    #settings { display: grid; gap: 10px; }
    #settings label { display: grid; gap: 4px; font-weight: 800; color: #27426f; }
    #settings select, #settings button { min-height: 44px; padding: 6px 10px; border: 2px solid #dfe7f3; border-radius: 12px; background: #f7faff; color: #27426f; font: inherit; font-weight: 700; }

    .fx { position: fixed; z-index: 80; pointer-events: none; font-size: 22px; }

    @media (max-width: 520px) {
      .ban .ta { display: none; }
      .ban { padding-right: 0; }
      .act { padding: 0 8px 0 4px; }
      .act .ta { display: none; }
      .head { gap: 8px; }
    }
    @media (max-height: 560px) {
      /* Korte skærme (telefon på langs): rækkerne får fast højde, og siden ruller i stedet for at blive for lille */
      .app { height: auto; min-height: 100%; }
      .sheet { flex: none; grid-template-rows: auto; }
      .block { container-type: inline-size; }
      .bhead { height: 40px; }
      .rows { --rh: 40px; grid-template-rows: repeat(18, 40px); flex: none; }
      .badge { font-size: 24px; }
      .eg { font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) { .row.active .ans, .block.win .row, .overlay, .card, .ball, .fill { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="head">
      <div class="ban"><span class="hex">1</span><span class="ta">தமிழ்மொழி</span></div>
      <div class="act"><span class="ta">செயல்</span><b>1</b></div>
      <div class="track" id="track" aria-hidden="true"><i class="fill" id="fill"></i><span class="ball" id="ball"></span></div>
      <div class="count" id="count">0/34</div>
    </header>
    <main class="sheet" id="sheet" aria-label="Konsonant plus vokal er lig med bogstav"></main>
  </div>

  <div class="overlay" id="picker" hidden>
    <div class="card" role="dialog" aria-label="Vælg bogstavet">
      <button class="x" id="pickX" type="button" aria-label="Luk">✕</button>
      <div class="eqn" id="eqn">
        <button class="cap ta" id="eqC" type="button"></button><span class="op">+</span><button class="cap ta" id="eqV" type="button"></button><span class="op">=</span><span class="cap ta a" id="eqA">?</span>
      </div>
      <button class="say" id="pickSay" type="button">🔊 Hør lyden</button>
      <div class="opts" id="opts"></div>
      <p class="toast" id="toast" aria-live="polite"></p>
    </div>
  </div>

  <div class="overlay" id="done" hidden>
    <div class="card done" role="dialog" aria-label="Færdig">
      <div class="big">🎉🏆🎉</div>
      <h2>Hurra!</h2>
      <p>Du har lavet alle bogstaverne på siden!</p>
      <button class="btn" id="again" type="button">Spil igen</button>
      <button class="btn ghost" id="stay" type="button">Se siden</button>
    </div>
  </div>

  <div id="settings" hidden>
    <label>Antal bogstaver at vælge imellem
      <select id="optChoices">
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </label>
    <label>Næste række kommer af sig selv
      <select id="optAuto">
        <option value="1">Ja</option>
        <option value="0">Nej, jeg trykker selv</option>
      </select>
    </label>
    <button id="optReset" type="button">↺ Start siden forfra</button>
  </div>

  <script src="../../topbar.js"></script>
  <script src="bogstaver.js"></script>
  <script src="laengder.js"></script>
  <script>
  (() => {
    "use strict";
    const B = window.TamilBogstaver;
    const C = B.consonants;
    const V = B.vowels;
    const ROWS = C.length;
    const TOTAL = (ROWS - 1) * V.length; // række 1 er bogens eksempel og er allerede udfyldt
    const $ = (id) => document.getElementById(id);
    const kid = "ari";
    const key = (name) => `tamil-${kid}-${name}`;
    const read = (name, fallback) => { try { const v = localStorage.getItem(key(name)); return v === null ? fallback : v; } catch { return fallback; } };
    const write = (name, value) => { try { localStorage.setItem(key(name), String(value)); } catch { /* ingen lagring */ } };
    const readJSON = (name, fallback) => { try { return JSON.parse(read(name, "")) || fallback; } catch { return fallback; } };
    const rnd = (n) => Math.floor(Math.random() * n);
    const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    const freshFill = () => V.map(() => C.map((_, i) => i === 0));
    let fill = readJSON("fill", null);
    if (!Array.isArray(fill) || fill.length !== V.length || fill.some((f) => !Array.isArray(f) || f.length !== ROWS)) fill = freshFill();
    let awarded = readJSON("awarded", [false, false]);
    let stars = Number(read("stars", "0")) || 0;
    let muted = !Topbar.soundOn();
    window.addEventListener("topbar:sound", (e) => { muted = !e.detail.on; if (muted) stopAudio(); });

    const blockDone = (b) => fill[b].every(Boolean);
    const filledCount = () => fill.reduce((s, f) => s + f.filter(Boolean).length - 1, 0);
    const firstOpen = (b, after = -1) => {
      for (let i = after + 1; i < ROWS; i++) if (!fill[b][i]) return i;
      return fill[b].findIndex((x) => !x);
    };

    // ---------- Siden ----------
    const sheet = $("sheet");
    const rowEl = (b, i) => sheet.querySelector(`.row[data-b="${b}"][data-i="${i}"]`);
    function build() {
      sheet.innerHTML = "";
      V.forEach((v, b) => {
        const sec = document.createElement("section");
        sec.className = "block";
        sec.dataset.b = b;
        let html = `<div class="bhead"><button class="badge ta" type="button" data-k="vowel" data-b="${b}" aria-label="Vokalen ${v.ta}">${v.ta}</button><span class="eg ta">எ.கா:</span></div><div class="rows">`;
        C.forEach((c, i) => {
          html += `<div class="row ${c.cls}${i === 0 ? " ex" : ""}" data-b="${b}" data-i="${i}" style="--n:${i}">` +
            `<button class="cap cons ta" type="button" data-k="cons">${c.mei}</button><span class="op">+</span>` +
            `<button class="cap vow ta" type="button" data-k="vow">${v.ta}</button><span class="op">=</span>` +
            `<button class="cap ans ta" type="button" data-k="ans"></button></div>`;
        });
        sec.innerHTML = html + "</div>";
        sheet.appendChild(sec);
      });
      paintAll();
    }
    function paintAll() {
      V.forEach((v, b) => {
        const open = fill[b].findIndex((x) => !x);
        C.forEach((c, i) => {
          const row = rowEl(b, i);
          row.classList.toggle("active", i === open);
          row.classList.toggle("filled", fill[b][i]);
          row.querySelector(".ans").textContent = fill[b][i] ? B.letterOf(i, b).ta : "";
        });
      });
      progress();
    }
    function progress() {
      const n = filledCount();
      document.querySelector(".head").style.setProperty("--p", n / TOTAL);
      $("count").textContent = `${n}/${TOTAL}`;
    }
    function save() { write("fill", JSON.stringify(fill)); write("awarded", JSON.stringify(awarded)); }

    // ---------- Lyd ----------
    const clip = new Audio();
    clip.preload = "auto";
    const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
    const TEXT = Object.fromEntries(B.allClips().map((c) => [c.id, c.text]));
    let token = 0;
    let unlocked = false;
    let ac = null;
    function audio() {
      if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; } }
      if (ac && ac.state === "suspended") ac.resume();
      return ac;
    }
    function unlockAudio() {
      if (unlocked) return;
      unlocked = true;
      audio();
      try {
        clip.src = SILENT;
        const p = clip.play();
        if (p && p.catch) p.catch((err) => { if (err && err.name === "NotAllowedError") unlocked = false; });
      } catch { unlocked = false; }
    }
    for (const ev of ["pointerdown", "touchend", "keydown"]) document.addEventListener(ev, unlockAudio, true);
    function stopAudio() {
      token++;
      clip.onended = null;
      clip.onerror = null;
      clip.onplaying = null;
      clip.pause();
      document.querySelectorAll(".hi").forEach((e) => e.classList.remove("hi"));
    }
    function deviceVoice(id, t) {
      return new Promise((resolve) => {
        const synth = window.speechSynthesis;
        if (!synth || muted || !TEXT[id]) { resolve(); return; }
        const u = new SpeechSynthesisUtterance(TEXT[id]);
        u.lang = "ta-IN";
        u.onend = u.onerror = () => resolve();
        synth.speak(u);
        setTimeout(resolve, 1800);
      });
    }
    // Afspiller ét klip og venter, til bogstavet er sagt (stemmen lægger stilhed efter, den springes over)
    function playOne(id, t) {
      return new Promise((resolve) => {
        if (muted) { setTimeout(resolve, 450); return; }
        let finished = false;
        let endTimer = 0;
        let safety = 0;
        const finish = (fallback) => {
          if (finished) return;
          finished = true;
          clearTimeout(endTimer);
          clearTimeout(safety);
          if (fallback && t === token) deviceVoice(id, t).then(resolve); else resolve();
        };
        clip.onended = () => finish(false);
        clip.onerror = () => finish(true);
        const len = (window.TamilBogstaverLaengder || {})[id];
        clip.onplaying = () => {
          clip.onplaying = null;
          if (len) endTimer = setTimeout(() => { if (t === token) { clip.pause(); finish(false); } }, (len + .2) * 1000);
        };
        clip.src = `lyd/${B.clipFile(id)}`;
        const p = clip.play();
        if (p && p.catch) p.catch(() => finish(true));
        safety = setTimeout(() => finish(false), 4000);
      });
    }
    // items: [{ id, el }]. el lyser, mens klippet siges.
    async function say(items) {
      stopAudio();
      const t = token;
      for (const it of items) {
        if (t !== token) return false;
        if (it.el) it.el.classList.add("hi");
        await playOne(it.id, t);
        if (it.el) it.el.classList.remove("hi");
        if (t === token) await sleep(70);
      }
      return t === token;
    }
    function tone(freq, dur = .15, type = "sine", vol = .12, delay = 0, slide = 0) {
      if (muted) return;
      const a = audio();
      if (!a) return;
      const t = a.currentTime + delay;
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(a.destination);
      o.start(t);
      o.stop(t + dur + .03);
    }
    const sfx = {
      right: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, "triangle", .11, i * .08)),
      wrong: () => tone(240, .26, "triangle", .1, 0, -90),
      win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .22, "triangle", .12, i * .1))
    };
    const PRAISE = [{ id: "ros-nallathu", ta: "நல்லது!" }, { id: "ros-arumai", ta: "அருமை!" }, { id: "ros-sabaash", ta: "சபாஷ்!" }];
    // Ros fra Urundai (samme stemme), kun hver tredje gang så det ikke bliver for meget
    function playPraise(p) {
      if (muted) return Promise.resolve();
      return new Promise((resolve) => {
        const t = token;
        clip.onended = () => resolve();
        clip.onerror = () => resolve();
        clip.src = `../urundai/lyd/${p.id}.mp3`;
        const pr = clip.play();
        if (pr && pr.catch) pr.catch(() => resolve());
        setTimeout(() => { if (t === token) resolve(); }, 1500);
      });
    }

    function burst(x, y, n = 14, set = ["⭐", "✨", "🌸", "🟡"]) {
      for (let k = 0; k < n; k++) {
        const s = document.createElement("span");
        s.className = "fx";
        s.textContent = set[rnd(set.length)];
        s.style.left = `${x}px`;
        s.style.top = `${y}px`;
        document.body.appendChild(s);
        const a = Math.random() * Math.PI * 2;
        const d = 60 + Math.random() * 130;
        s.animate([{ transform: "translate(-50%,-50%) scale(.4)", opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d - 30}px)) scale(1.3) rotate(${rnd(360)}deg)`, opacity: 0 }], { duration: 800 + Math.random() * 500, easing: "ease-out" }).onfinish = () => s.remove();
      }
    }
    const centerOf = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

    // ---------- Spørgsmål ----------
    let cur = null; // { b, i, opts, busy }
    let praiseCount = 0;
    function makeOptions(b, i) {
      const n = Number(read("valg", "4")) === 3 ? 3 : 4;
      const right = B.letterOf(i, b);
      const picks = [right, B.letterOf(i, 1 - b)];
      const pool = shuffle(C.map((_, j) => j).filter((j) => j !== i));
      for (const j of pool) {
        if (picks.length >= n) break;
        picks.push(B.letterOf(j, b));
      }
      return shuffle(picks.slice(0, n)).map((l) => ({ ...l, right: l.id === right.id }));
    }
    const OC = [["#e0534a", "#a8261f"], ["#6fb23c", "#3d7a17"], ["#d96aa3", "#a02a6a"], ["#3b82c4", "#1f5a92"]];
    function openPicker(b, i) {
      stopAudio();
      cur = { b, i, busy: false };
      const c = C[i];
      const eqn = $("eqn");
      eqn.className = `eqn ${c.cls}`;
      $("eqC").textContent = c.mei;
      $("eqV").textContent = V[b].ta;
      $("eqA").textContent = "?";
      $("toast").textContent = "";
      $("toast").className = "toast";
      const opts = makeOptions(b, i);
      cur.opts = opts;
      const box = $("opts");
      box.dataset.n = opts.length;
      box.innerHTML = "";
      opts.forEach((o, k) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt";
        btn.textContent = o.ta;
        btn.style.setProperty("--oc", OC[k % OC.length][0]);
        btn.style.setProperty("--od", OC[k % OC.length][1]);
        btn.addEventListener("click", () => choose(o, btn));
        box.appendChild(btn);
      });
      $("picker").hidden = false;
      sayQuestion();
    }
    function sayQuestion() {
      if (!cur) return;
      say([{ id: C[cur.i].meiId, el: $("eqC") }, { id: V[cur.b].id, el: $("eqV") }]);
    }
    function closePicker() {
      stopAudio();
      cur = null;
      $("picker").hidden = true;
    }
    async function choose(o, btn) {
      if (!cur || cur.busy || btn.disabled) return;
      const { b, i } = cur;
      if (!o.right) {
        btn.classList.add("bad");
        btn.disabled = true;
        sfx.wrong();
        $("toast").className = "toast no";
        $("toast").textContent = "Prøv igen – du kan det!";
        say([{ id: o.id }]); // så barnet hører, hvilket bogstav det valgte
        return;
      }
      cur.busy = true;
      btn.classList.add("good");
      $("opts").querySelectorAll(".opt").forEach((x) => { x.disabled = true; });
      $("eqA").textContent = o.ta;
      sfx.right();
      fill[b][i] = true;
      save();
      paintAll();
      const ans = rowEl(b, i).querySelector(".ans");
      ans.classList.remove("pop");
      void ans.offsetWidth;
      ans.classList.add("pop");
      const [x, y] = centerOf(btn);
      burst(x, y, 10);
      praiseCount++;
      const p = PRAISE[praiseCount % PRAISE.length];
      $("toast").className = "toast";
      $("toast").textContent = praiseCount % 3 === 0 ? `${p.ta}` : "Rigtigt! ✓";
      await say([{ id: C[i].meiId, el: $("eqC") }, { id: V[b].id, el: $("eqV") }, { id: o.id, el: $("eqA") }]);
      if (praiseCount % 3 === 0) await playPraise(p);
      await sleep(250);
      if (!cur) return; // lukket imens
      advance(b, i);
    }
    function advance(b, i) {
      const auto = read("auto", "1") !== "0";
      if (blockDone(b)) {
        closePicker();
        winBlock(b);
        return;
      }
      if (!auto) { closePicker(); return; }
      openPicker(b, firstOpen(b, i));
    }

    // ---------- Belønning ----------
    async function winBlock(b) {
      const sec = sheet.querySelector(`.block[data-b="${b}"]`);
      sec.classList.add("win");
      sfx.win();
      const [x, y] = centerOf(sec);
      burst(x, y, 26);
      if (!awarded[b]) {
        awarded[b] = true;
        stars++;
        write("stars", stars);
        save();
        if (window.Topbar) Topbar.refreshStars(true);
      }
      await sleep(1500);
      sec.classList.remove("win");
      if (V.every((_, k) => blockDone(k))) {
        sfx.win();
        $("done").hidden = false;
        const [dx, dy] = [innerWidth / 2, innerHeight / 3];
        burst(dx, dy, 30);
        return;
      }
      const other = V.findIndex((_, k) => !blockDone(k));
      if (other >= 0 && read("auto", "1") !== "0") openPicker(other, firstOpen(other));
    }

    function restart() {
      stopAudio();
      fill = freshFill();
      awarded = [false, false];
      save();
      $("done").hidden = true;
      $("picker").hidden = true;
      cur = null;
      paintAll();
    }

    // ---------- Tryk på siden ----------
    sheet.addEventListener("click", (e) => {
      const badge = e.target.closest(".badge");
      if (badge) { const b = Number(badge.dataset.b); say([{ id: V[b].id, el: badge }]); return; }
      const row = e.target.closest(".row");
      if (!row) return;
      const b = Number(row.dataset.b);
      const i = Number(row.dataset.i);
      const which = e.target.closest(".cap");
      const k = which && which.dataset.k;
      if (!fill[b][i]) { openPicker(b, i); return; }
      const parts = { cons: { id: C[i].meiId, el: row.querySelector(".cons") }, vow: { id: V[b].id, el: row.querySelector(".vow") }, ans: { id: B.letterOf(i, b).id, el: row.querySelector(".ans") } };
      if (k && parts[k] && k !== "ans") say([parts[k]]);
      else say([parts.cons, parts.vow, parts.ans]); // hele regnestykket: konsonant, vokal og så bogstavet
    });
    $("pickX").addEventListener("click", closePicker);
    $("picker").addEventListener("click", (e) => { if (e.target === $("picker")) closePicker(); });
    $("pickSay").addEventListener("click", sayQuestion);
    $("eqC").addEventListener("click", () => cur && say([{ id: C[cur.i].meiId, el: $("eqC") }]));
    $("eqV").addEventListener("click", () => cur && say([{ id: V[cur.b].id, el: $("eqV") }]));
    $("again").addEventListener("click", restart);
    $("stay").addEventListener("click", () => { $("done").hidden = true; });
    $("optChoices").value = read("valg", "4");
    $("optAuto").value = read("auto", "1");
    $("optChoices").addEventListener("change", (e) => write("valg", e.target.value));
    $("optAuto").addEventListener("change", (e) => write("auto", e.target.value));
    $("optReset").addEventListener("click", () => { Topbar.closeMenu(); restart(); });

    build();
    Topbar.init({ kid, controls: [$("settings")] });

    // Testværktøj: window.__tamil giver adgang til tilstanden
    window.__tamil = { get fill() { return fill; }, get cur() { return cur; }, openPicker, choose, restart, C, V, B, say, makeOptions, winBlock };
  })();
  </script>
</body>
