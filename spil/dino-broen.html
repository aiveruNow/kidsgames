// Omsætter en kommandostreng til punkter med ca. 2 enheders mellemrum
function parseStroke(str) {
  const t = str.trim().split(/\s+/);
  const pts = [];
  let cur = null, dot = false, i = 0;
  const lineTo = (x, y) => {
    if (!cur) { pts.push([x, y]); cur = [x, y]; return; }
    const dx = x - cur[0], dy = y - cur[1], len = Math.hypot(dx, dy);
    if (len < .01) return;
    const n = Math.max(1, Math.ceil(len / 2));
    for (let k = 1; k <= n; k++) pts.push([cur[0] + dx * k / n, cur[1] + dy * k / n]);
    cur = [x, y];
  };
  while (i < t.length) {
    const c = t[i++];
    const num = () => parseFloat(t[i++]);
    if (c === "M") { const x = num(), y = num(); pts.push([x, y]); cur = [x, y]; }
    else if (c === "L") { const x = num(), y = num(); lineTo(x, y); }
    else if (c === "D") { const x = num(), y = num(); pts.push([x, y]); cur = [x, y]; dot = true; }
    else if (c === "C") {
      const x1 = num(), y1 = num(), x2 = num(), y2 = num(), x = num(), y = num();
      const [x0, y0] = cur;
      const approx = Math.hypot(x1 - x0, y1 - y0) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x - x2, y - y2);
      const n = Math.max(4, Math.ceil(approx / 2.2));
      for (let k = 1; k <= n; k++) {
        const u = k / n, v = 1 - u;
        pts.push([v * v * v * x0 + 3 * v * v * u * x1 + 3 * v * u * u * x2 + u * u * u * x,
                  v * v * v * y0 + 3 * v * v * u * y1 + 3 * v * u * u * y2 + u * u * u * y]);
      }
      cur = [x, y];
    } else if (c === "E") {
      const cx = num(), cy = num(), rx = num(), ry = num(), a0 = num(), a1 = num();
      const n = Math.max(8, Math.ceil(Math.abs(a1 - a0) * Math.PI / 180 * (rx + ry) / 2 / 2));
      for (let k = 0; k <= n; k++) {
        const a = (a0 + (a1 - a0) * k / n) * Math.PI / 180;
        const x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
        if (k === 0) lineTo(x, y); else { pts.push([x, y]); cur = [x, y]; }
      }
    }
  }
  let len = 0;
  for (let k = 1; k < pts.length; k++) len += dist(pts[k], pts[k - 1]);

function ridge(c, base, amp, color, seed, freq = 1) {
  c.fillStyle = color; c.beginPath(); c.moveTo(0, L.H);

    c.quadraticCurveTo(tx + Math.cos(a) * len * .5, ty + Math.sin(a) * len * .5 - len * .05, tx, ty); c.fill();

    c.fillStyle = "#2f7a5a"; c.beginPath(); c.moveTo(x - w, by); c.lineTo(x, by - h * .38); c.lineTo(x + w, by); c.closePath(); c.fill();
    c.fillStyle = "#f4fbff"; c.beginPath(); c.moveTo(x - w * .55, by - h * .17); c.lineTo(x, by - h * .38); c.lineTo(x + w * .55, by - h * .17); c.quadraticCurveTo(x, by - h * .1, x - w * .55, by - h * .17); c.fill();

  c.shadowColor = "#9cf"; c.shadowBlur = h * .5; c.fillStyle = "#6fe0ff";

}
function spikes(c, x, y, h) {

  for (const [dx, hh] of [[-.2, .7], [0, 1], [.22, .6]]) { c.beginPath(); c.moveTo(x + dx * h - h * .14, y); c.lineTo(x + dx * h, y - hh * h); c.lineTo(x + dx * h + h * .14, y); c.closePath(); c.fill(); }

function buildStatic() {
  const B = biome(), { W, H, gy, xL, xR } = L, rnd = seeded(7 + G.bridge % 4 * 13);
  const c = backCv.getContext("2d");

  let g = c.createLinearGradient(0, 0, 0, gy); g.addColorStop(0, B.sky[0]); g.addColorStop(1, B.sky[1]); c.fillStyle = g; c.fillRect(0, 0, W, H);
  const night = G.bridge % 4 === 3, lava = G.bridge % 4 === 1;
  const sunX = lava ? W * .3 : W * .76, sunY = lava ? gy * .62 : gy * .27, sunR = lava ? gy * .2 : gy * .1;
  g = c.createRadialGradient(sunX, sunY, sunR * .3, sunX, sunY, sunR * 3);
  g.addColorStop(0, night ? "#ffffff66" : "#fff6b8aa"); g.addColorStop(1, "#ffffff00"); c.fillStyle = g; c.fillRect(0, 0, W, gy);
  c.fillStyle = night ? "#f6f3d9" : lava ? "#ff5a2a" : "#fff3a0"; c.beginPath(); c.arc(sunX, sunY, sunR, 0, TAU); c.fill();

    c.fillStyle = "#3a2024"; c.beginPath(); c.moveTo(vx - vh * .9, gy); c.lineTo(vx - vh * .2, gy - vh); c.lineTo(vx + vh * .2, gy - vh); c.lineTo(vx + vh * .9, gy); c.closePath(); c.fill();
    g = c.createLinearGradient(0, gy - vh, 0, gy); g.addColorStop(0, "#ff8a2a"); g.addColorStop(1, "#ff8a2a00"); c.strokeStyle = g; c.lineWidth = 5;
    c.beginPath(); c.moveTo(vx - vh * .1, gy - vh); c.quadraticCurveTo(vx - vh * .3, gy - vh * .5, vx - vh * .35, gy); c.moveTo(vx + vh * .12, gy - vh); c.quadraticCurveTo(vx + vh * .28, gy - vh * .5, vx + vh * .45, gy); c.stroke();
  }

  g = c.createLinearGradient(0, gy, 0, H); g.addColorStop(0, B.wall[0]); g.addColorStop(1, B.wall[1]); c.fillStyle = g; c.fillRect(0, gy, W, H - gy);
  for (let i = 1; i < 8; i++) {
    const y = gy + (H - gy) * i / 8; c.strokeStyle = `rgba(0,0,0,${.07 + rnd() * .08})`; c.lineWidth = 2 + rnd() * 3;
    c.beginPath(); c.moveTo(xL, y); for (let x = xL; x <= xR; x += 14) c.lineTo(x, y + Math.sin(x * .05 + i) * 3); c.stroke();
  }
  c.fillStyle = "rgba(0,0,0,.18)";
  for (let i = 0; i < 6; i++) { const rx = xL + rnd() * (xR - xL), ry = gy + (H - gy) * (.15 + rnd() * .6), rw = 20 + rnd() * 40; c.beginPath(); c.moveTo(rx, ry); c.lineTo(rx + rw * .5, ry - rw * .5); c.lineTo(rx + rw, ry); c.closePath(); c.fill(); }
  g = c.createLinearGradient(xL, 0, xR, 0); g.addColorStop(0, "rgba(0,0,0,.4)"); g.addColorStop(.25, "rgba(0,0,0,0)"); g.addColorStop(.75, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.4)");
  c.fillStyle = g; c.fillRect(xL, gy, xR - xL, H - gy);

  const f = cliffCv.getContext("2d");
  f.setTransform(L.dpr, 0, 0, L.dpr, 0, 0); f.clearRect(0, 0, W, H);
  for (const side of [-1, 1]) {
    const edge = side < 0 ? xL : xR, steps = 9;
    g = f.createLinearGradient(0, gy, 0, H); g.addColorStop(0, B.cliff[0]); g.addColorStop(1, B.cliff[1]); f.fillStyle = g;
    f.beginPath(); f.moveTo(side < 0 ? 0 : W, gy - 2); f.lineTo(edge, gy - 2);
    for (let i = 1; i <= steps; i++) f.lineTo(edge + side * (2 + i * 2.2) + (rnd() * 8 - 4), gy + (H - gy) * i / steps);
    f.lineTo(side < 0 ? 0 : W, H); f.closePath(); f.fill();
    f.strokeStyle = "rgba(0,0,0,.14)"; f.lineWidth = 2.5;
    for (let i = 1; i < 7; i++) { const y = gy + (H - gy) * i / 7; f.beginPath(); f.moveTo(edge - side * 70, y); f.lineTo(edge, y + rnd() * 6 - 3); f.stroke(); }
    f.fillStyle = B.grass;
    const x0 = side < 0 ? 0 : xR - 3, x1 = side < 0 ? xL + 3 : W;
    f.beginPath(); f.moveTo(x0, gy - 5); f.lineTo(x1, gy - 5); f.lineTo(x1, gy + 6);
    for (let x = x1; x >= x0; x -= 9) f.lineTo(x, gy + 6 + Math.abs(Math.sin(x * .7)) * 5); f.closePath(); f.fill();
    f.fillStyle = "rgba(255,255,255,.22)"; f.fillRect(x0, gy - 5, x1 - x0, 3);
    const dx = side < 0 ? W * .07 : W * .935, hh = Math.min(L.H * .3, L.W * .22);

// ---------- Scenens levende tilstand ----------
const planks = [], debris = [], amb = [];
const D = { x: 0, tx: 0, phase: 0, walk: false, mood: "idle", moodUntil: 0, hop: null, cheer: null, blinkAt: 2, blink: 0, tremble: 0, dy: 0, lastStep: 0 };
const SPX = { ptero: null, egg: null, balloon: null, hatch: null };
const R = { baby: null }; // redningsscene: den ventende unge, der løber hen mod mor
const hopeBaby = () => G.babies.length;
const slotX = i => L.xL + i * L.pw;
const anchorFor = n => L.xL + n * L.pw - .22 * L.hD;
function setMood(m, ms) { D.mood = m; D.moodUntil = ms ? T + ms / 1000 : 0; }
function snapDino() { D.x = D.tx = anchorFor(G.built); D.hop = null; }
function restorePlanks() {
  planks.length = 0;
  for (let i = 0; i < G.built; i++) planks.push({ i, born: -10, gold: false });
}
function placePlank(gold, dropH) {
  const p = { i: planks.length, born: T, gold: !!gold, dropH: dropH || L.H * .5, landed: false };
  planks.push(p);
  setTimeout(() => {
    p.landed = true; Sfx.plank();
    const [x] = [slotX(p.i) + L.pw / 2];
    dust(...sp(x, L.gy + 2), 7);
    if (gold) burst(...sp(x, L.gy - 6), 14, { shape: "star", color: "#ffd54f", v0: 40, v1: 160, up: 60 });
  }, 400);
  return p;
}
function breakLastPlank() {
  const p = planks.pop();
  if (!p) return;
  const x = slotX(p.i), w = L.pw - 2;
  for (const half of [0, 1]) debris.push({ x: x + 1 + half * w / 2, y: L.gy, w: w / 2, h: L.th, vx: (half ? 1 : -1) * rand(20, 70), vy: -rand(60, 140), rot: 0, vr: (half ? 1 : -1) * rand(2, 6), gold: p.gold });
  burst(...sp(x + w / 2, L.gy + 4), 14, { shape: "rect", color: "#b8793a", v0: 40, v1: 170, up: 60, s0: 3, s1: 6 });
}
function hopBack() {
  D.hop = { t0: T, dur: .55, from: D.x, to: anchorFor(planks.length) };
  D.tx = D.hop.to;
}
function cheerDino(n = 3, dur = 1.2) { D.cheer = { t0: T, dur, n }; setMood("happy", dur * 1000 + 500); }

function updateScene(dt) {
  if (T > D.blinkAt) { D.blink = .14; D.blinkAt = T + rand(2, 5); }
  D.blink = Math.max(0, D.blink - dt);
  if (D.mood !== "idle" && D.moodUntil && T > D.moodUntil) D.mood = "idle";
  D.dy = 0; D.walk = false;
  if (D.hop) {
    const u = (T - D.hop.t0) / D.hop.dur;
    if (u >= 1) { D.x = D.hop.to; D.hop = null; dust(...sp(D.x, L.gy), 6); Sfx.step(); }
    else { D.x = lerp(D.hop.from, D.hop.to, easeInOut(u)); D.dy = -Math.sin(u * Math.PI) * L.hD * .5; }
  } else {
    const dx = D.tx - D.x;
    if (Math.abs(dx) > .5) {
      const step = Math.min(Math.abs(dx), Math.max(70, L.pw * 2.8) * dt);
      D.x += Math.sign(dx) * step; D.phase += step / (L.hD * .26) * Math.PI; D.walk = true;
      const s = Math.floor(D.phase / Math.PI);
      if (s !== D.lastStep) { D.lastStep = s; Sfx.step(); }
    }
  }
  if (D.cheer) {
    const u = (T - D.cheer.t0) / D.cheer.dur;
    if (u >= 1) D.cheer = null; else D.dy -= Math.abs(Math.sin(u * D.cheer.n * Math.PI)) * L.hD * .22;
  }
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i]; d.vy += 900 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
    if (d.y > L.H + 60) debris.splice(i, 1);

function pickLetter() {
  const ri = G.review.findIndex(r => r.due <= G.rounds);
  let ch;
  if (ri >= 0) ch = G.review.splice(ri, 1)[0].ch;
  else if (G.order === "mix") {
    const w = ORDER_ABC.map(c => { const m = G.mastery[G.case + c]; return G.recent.includes(c) ? 0 : Math.max(.3, 3 - (m ? m.lvl : 0) + Math.min(m ? m.bad : 0, 3)); });

    while (i < w.length - 1 && (r -= w[i]) > 0) i++;
    ch = ORDER_ABC[i];
  } else { const list = orderList(); ch = list[G.idx % list.length]; G.idx++; }
  G.recent.push(ch); if (G.recent.length > 4) G.recent.shift();
  return ch;
}
function pickSurprise() {
