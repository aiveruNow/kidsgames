<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#bfeaff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Løven Ari">
  <title>Løven Ari lærer at læse</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #17233c;
      font-synthesis: none;
      --accent: #2f9e5b;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html { height: 100%; overflow: hidden; overscroll-behavior: none; }

    body {
      min-width: 320px;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: calc(var(--tb-h, 54px) + 10px) 12px 14px;
      background: radial-gradient(ellipse at 15% 0%, #f4fde9 0, #d3f0c2 100%) fixed;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: none;
    }

    button { font: inherit; cursor: pointer; }
    .app { width: min(100%, 700px); margin: 0 auto; }

    @media (min-width: 900px) and (min-aspect-ratio: 5/4) {
      .app { width: min(100%, 1180px); }
      .play { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
      .wordcard { margin-top: 0; }
      .pic { font-size: clamp(2.6rem, 6vw, 4.6rem); }
    }

    .topline { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-bottom: 8px; }

    .stats { display: flex; align-items: center; gap: 8px; }

    .chip {
      padding: 8px 12px;
      border: 1px solid #f3dc9a;
      border-radius: 14px;
      background: #fff9e3;
      color: #8a5a00;
      font-size: .95rem;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: 0 3px 10px #b8860b14;
    }

    button.chip { border-color: #bfe3b4; background: #f0fbe9; color: #2b6d3c; }
    .chip.bump { animation: bump .7s ease-out; }

    .sizes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #27426f;
      font-size: .95rem;
      font-weight: 800;
    }

    .size {
      min-width: 66px;
      padding: 7px 12px;
      border: 3px solid #fff;
      border-radius: 14px;
      background: #ffffffa6;
      color: #27426f;
      font-weight: 900;
      line-height: 1.1;
      box-shadow: 0 3px 10px #243a5a14;
    }

    .size small { display: block; font-size: .7rem; color: #a56d00; }
    .size[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
    .size[aria-pressed="true"] small { color: #fff6c9; }
    .tb-panel .size:not([aria-pressed="true"]) { border-color: #d3e8c8; background: #f3faee; }

    /* ---------- Scene ---------- */
    .scene-card {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background: #bfeaff;
      box-shadow: 0 14px 36px #1d4a2c33;
    }

    #scene { display: block; width: 100%; height: auto; }

    .bubble {
      position: absolute;
      top: 10px;
      left: 12px;
      max-width: 58%;
      padding: 9px 14px;
      border-radius: 18px;
      background: #fff;
      color: #27426f;
      font-size: clamp(.95rem, 3.2vw, 1.25rem);
      font-weight: 800;
      box-shadow: 0 6px 16px #243a5a26;
    }

    .bubble::after {
      content: "";
      position: absolute;
      left: 26px;
      bottom: -8px;
      width: 16px;
      height: 16px;
      background: inherit;
      transform: rotate(45deg);
      border-radius: 3px;
    }

    .bubble.pop { animation: pop .45s ease-out; }

    .sun-rays { transform-origin: 548px 58px; animation: spin 40s linear infinite; }
    .cloud { animation: drift 16s ease-in-out infinite alternate; }
    .sway { transform-origin: 0 0; animation: sway 5s ease-in-out infinite alternate; }
    .blade { transform-box: fill-box; transform-origin: 50% 100%; animation: blade 3.4s ease-in-out infinite alternate; }
    .firefly { animation: firefly 7s ease-in-out infinite; }
    .pal { transform-box: fill-box; transform-origin: 50% 100%; animation: pal 2.2s ease-in-out infinite; }
    .tail { transform-origin: 150px 180px; animation: wag 1.6s ease-in-out infinite alternate; }

    .leo { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
    .leo .mane-scale { transform-origin: 100px 108px; transition: transform .8s cubic-bezier(.3, 1.6, .5, 1); }
    .leo .mane-sway { transform-origin: 100px 108px; animation: manesway 4s ease-in-out infinite alternate; }
    .leo .mouth-open { display: none; }
    .leo.open .mouth-open { display: inline; }
    .leo.open .mouth-closed { display: none; }
    .leo .crown { display: none; }
    .leo.crowned .crown { display: inline; }
    .leo .eyes-look { transition: transform .12s; }
    .leo .blink { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .leo.jump { animation: jump .7s ease-out; }
    .leo.roar { animation: roar 1s ease-in-out; }
    .leo.chew { animation: chew .7s ease-in-out; }
    .leo.sad { animation: sad .7s ease-in-out; }

    .leo-ring { opacity: 0; transition: opacity .25s; animation: dash 1.2s linear infinite; }
    .scene-card.dragging .leo-ring { opacity: .95; }
    .scene-card.over .leo-ring { stroke: #ffd54f; stroke-width: 8; }

    .egg-body {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      filter: drop-shadow(0 0 calc(var(--glow, 0) * 16px) #fff1a6);
    }

    .egg-body.wobble { animation: wobble 1.4s ease-in-out infinite; }
    .egg-body.jiggle { animation: jiggle .6s ease-in-out; }
    .egg-body.shake-hard { animation: shake-hard .8s ease-in-out; }
    .egg-body.drop { animation: egg-drop .9s cubic-bezier(.3, 1.4, .5, 1); }
    .crack { fill: none; stroke-linecap: butt; stroke-linejoin: round; stroke-dasharray: 100 100; stroke-dashoffset: 100; transition: stroke-dashoffset .7s ease-out; }
    .branch { opacity: 0; transition: opacity .4s; }
    .branch.on { opacity: 1; }
    .chick { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; }
    .burst { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
    .hatched .shell-top { animation: shell-fly 1s ease-in forwards; }
    .hatched .shell-bot { transform-box: fill-box; transform-origin: 50% 100%; animation: shell-tilt .6s .2s ease-out forwards; }
    .hatched .crack, .hatched .branch { opacity: 0; }
    .hatched .chick { animation: chick-pop 1.1s .25s cubic-bezier(.3, 1.6, .5, 1) forwards; }
    .hatched .burst { animation: burst 1s ease-out forwards; }
    .shell-top, .shell-bot { transform-box: fill-box; transform-origin: 50% 50%; }

    .path {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 8px 0 0;
      padding: 8px 10px;
      border-radius: 16px;
      background: #ffffffa6;
    }

    .dot {
      flex: 1;
      display: grid;
      height: clamp(22px, 5.4vw, 30px);
      place-items: center;
      border-radius: 50%;
      background: #dfe7dd;
      font-size: clamp(.7rem, 2.6vw, .95rem);
      filter: grayscale(1);
      opacity: .6;
      transition: background .3s, transform .3s;
    }

    .dot.done { background: #ffd54f; filter: none; opacity: 1; transform: scale(1.12); }

    /* ---------- Ord og valg ---------- */
    .wordcard {
      position: relative;
      container-type: inline-size;
      display: grid;
      gap: 10px;
      justify-items: center;
      margin: 10px 0 12px;
      padding: 14px 12px 14px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 14px 36px #233c6020;
    }

    .wordcard.gold { background: linear-gradient(135deg, #fff9d6, #ffe58a 50%, #fff9d6); box-shadow: 0 0 0 4px #ffc928, 0 14px 36px #b8860b55; }
    .wordcard .gold-tag { position: absolute; top: -12px; right: 14px; padding: 4px 12px; border-radius: 99px; background: #ffb300; color: #fff; font-size: .85rem; font-weight: 900; animation: nudge 1s ease-in-out infinite; }
    .wordcard:not(.gold) .gold-tag { display: none; }

    .letters { display: flex; gap: clamp(6px, 2vw, 14px); --n: 4; }

    .letter {
      display: grid;
      width: clamp(40px, calc(84cqw / var(--n) - 10px), 100px);
      aspect-ratio: 4 / 5;
      place-items: center;
      border: 4px solid #cfe0ff;
      border-radius: 18px;
      background: #f3f8ff;
      color: #183976;
      font-size: clamp(1.8rem, calc(40cqw / var(--n)), 4.6rem);
      font-weight: 900;
      transition: transform .2s, background .2s, border-color .2s;
    }

    .letter.lit { transform: translateY(-8px) scale(1.1); border-color: #ffb300; background: #fff1b8; }
    .letters.all .letter { border-color: #ffb300; background: #fff1b8; animation: pop .5s ease-out; }
    .letters.mini { gap: 4px; justify-content: center; }
    .letters.mini .letter { width: clamp(20px, calc(88cqw / var(--n) - 4px), 50px); border-width: 3px; border-radius: 12px; font-size: clamp(1rem, calc(36cqw / var(--n)), 2.3rem); border-color: #ffb300; background: #fff1b8; animation: pop .5s ease-out backwards; }

    .read {
      padding: 11px 24px;
      border: 0;
      border-radius: 18px;
      background: var(--accent);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 900;
      box-shadow: 0 6px 0 #0003, 0 8px 16px #0002;
    }

    .read:active { transform: translateY(3px); box-shadow: 0 3px 0 #0003; }
    .read.nudge { animation: nudge 1s ease-in-out infinite; }

    .choices-wrap { position: relative; }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(8px, 2.5vw, 18px);
    }

    .pic {
      display: grid;
      aspect-ratio: 1;
      place-items: center;
      border: 4px solid #fff;
      border-radius: 26px;
      background: #fff;
      font-size: clamp(3.2rem, 15vw, 6rem);
      line-height: 1;
      box-shadow: 0 10px 24px #233c6022;
      cursor: grab;
      touch-action: none;
      transition: opacity .25s, border-color .2s;
    }

    .pic.lifted { opacity: .22; }
    .pic.eaten { visibility: hidden; }
    .pic.wrong { opacity: .28; filter: grayscale(.8); pointer-events: none; animation: shake .45s; }
    .pic.hint { animation: nudge 1s ease-in-out infinite; border-color: #ffb300; }

    .flyer {
      position: fixed;
      z-index: 40;
      margin: 0;
      aspect-ratio: auto;
      pointer-events: none;
      box-shadow: 0 22px 34px #0004;
      border-color: #ffd54f;
      cursor: grabbing;
    }

    .drag-note { margin: 10px 0 0; text-align: center; color: #3f6b49; font-weight: 800; font-size: .95rem; }

    .ghost {
      position: absolute;
      left: 16%;
      top: 38%;
      z-index: 5;
      font-size: 3rem;
      pointer-events: none;
      opacity: 0;
    }

    .ghost.on { animation: ghost 2.2s ease-in-out infinite; }

    /* ---------- Overlays ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 16px;
      background: #17233ca8;
      animation: fade .3s;
    }

    .overlay[hidden] { display: none; }

    .friend-card {
      position: relative;
      container-type: inline-size;
      overflow: hidden;
      display: grid;
      gap: 8px;
      justify-items: center;
      width: min(100%, 440px);
      padding: 26px 18px 22px;
      border-radius: 34px;
      background: linear-gradient(180deg, #fff6c9, #ffe08a);
      text-align: center;
      box-shadow: 0 0 0 5px #fff, 0 24px 60px #0006;
      animation: pop .6s cubic-bezier(.3, 1.5, .5, 1);
    }

    .friend-card > * { position: relative; }

    .friend-card::before {
      content: "";
      position: absolute;
      inset: -60%;
      background: repeating-conic-gradient(#ffffff80 0 9deg, #fff0 9deg 18deg);
      animation: spin 18s linear infinite;
    }

    .ribbon {
      padding: 6px 22px;
      border-radius: 99px;
      background: #e5484d;
      color: #fff;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: .04em;
      box-shadow: 0 5px 0 #a82f33;
    }

    .ribbon.rare { background: #7b4dd6; box-shadow: 0 5px 0 #532f9c; }
    .friend-emoji { font-size: clamp(6rem, 30vw, 9rem); line-height: 1.1; animation: friend-in 1.1s cubic-bezier(.3, 1.6, .5, 1), float 2.6s 1.1s ease-in-out infinite; filter: drop-shadow(0 12px 14px #0003); }
    .friend-card p { margin: 0; color: #7a4d00; font-size: 1.1rem; font-weight: 900; }
    .friend-card .king { padding: 8px 14px; border-radius: 16px; background: #fff; color: #b8860b; animation: nudge 1s ease-in-out infinite; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }

    .next {
      padding: 13px 24px;
      border: 0;
      border-radius: 18px;
      background: #fff;
      color: #27426f;
      font-size: 1.1rem;
      font-weight: 900;
      box-shadow: 0 6px 0 #0003;
    }

    .next.primary { background: #1b9a67; color: #fff; }

    .book-card {
      display: grid;
      gap: 12px;
      width: min(100%, 560px);
      max-height: 92vh;
      overflow: auto;
      padding: 18px;
      border-radius: 30px;
      background: linear-gradient(180deg, #fff8e1, #ffe9b0);
      box-shadow: 0 0 0 5px #fff, 0 24px 60px #0006;
      animation: pop .5s ease-out;
    }

    .book-card h2 { margin: 0; text-align: center; color: #7a4d00; font-size: 1.5rem; }
    .book-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

    .slot {
      position: relative;
      display: grid;
      gap: 2px;
      justify-items: center;
      padding: 8px 2px 6px;
      border: 3px solid #fff;
      border-radius: 18px;
      background: #ffffffb8;
      color: #5b3a00;
      font-size: .62rem;
      font-weight: 900;
      cursor: pointer;
    }

    .slot .em { font-size: clamp(2rem, 9vw, 3rem); line-height: 1.1; }
    .slot.locked { cursor: default; background: #ffffff66; }
    .slot.locked .em { filter: brightness(0); opacity: .16; }
    .slot.rare { border-color: #b69af0; background: #f1e9ff; }
    .slot.new { border-color: #ff6b6b; animation: nudge 1s ease-in-out infinite; }
    .slot .cnt { position: absolute; top: 3px; right: 5px; padding: 0 6px; border-radius: 99px; background: #ffb300; color: #fff; font-size: .7rem; }
    .slot.hop .em { animation: hop 1s ease-out; }

    .confetti { position: fixed; top: -40px; z-index: 50; pointer-events: none; font-size: 28px; }

    @keyframes bump { 30% { transform: scale(1.3) rotate(-6deg); } 60% { transform: scale(.95) rotate(3deg); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift { to { transform: translateX(46px); } }
    @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    @keyframes blade { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
    @keyframes firefly { 0%, 100% { transform: translate(0, 0); opacity: .2; } 50% { transform: translate(var(--dx), var(--dy)); opacity: 1; } }
    @keyframes pal { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px) rotate(3deg); } }
    @keyframes wag { from { transform: rotate(-9deg); } to { transform: rotate(11deg); } }
    @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.025); } }
    @keyframes manesway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
    @keyframes jump { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-20px) rotate(-3deg); } 65% { transform: translateY(0) rotate(2deg); } }
    @keyframes roar { 0%, 100% { transform: scale(1); } 20%, 60% { transform: scale(1.12) rotate(-2deg); } 40%, 80% { transform: scale(1.15) rotate(2deg); } }
    @keyframes chew { 0%, 100% { transform: scale(1); } 20% { transform: scale(1.06, .94); } 40% { transform: scale(.96, 1.05); } 60% { transform: scale(1.06, .94); } 80% { transform: scale(.98, 1.03); } }
    @keyframes sad { 0%, 100% { transform: rotate(0); } 20%, 60% { transform: rotate(-6deg) translateX(-4px); } 40%, 80% { transform: rotate(6deg) translateX(4px); } }
    @keyframes dash { to { stroke-dashoffset: -20; } }
    @keyframes shake { 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }
    @keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes wobble { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes jiggle { 0%, 100% { transform: rotate(0) scale(1); } 15% { transform: rotate(-9deg) scale(1.05); } 35% { transform: rotate(8deg) scale(1.06); } 55% { transform: rotate(-5deg); } 75% { transform: rotate(3deg); } }
    @keyframes shake-hard { 0%, 100% { transform: rotate(0) scale(1); } 10%, 50%, 90% { transform: rotate(-12deg) scale(1.08); } 30%, 70% { transform: rotate(12deg) scale(1.1); } }
    @keyframes egg-drop { 0% { transform: translateY(-190px) scale(.8); opacity: 0; } 60% { transform: translateY(8px) scale(1.05, .92); opacity: 1; } 80% { transform: translateY(-6px) scale(.98, 1.03); } 100% { transform: translateY(0) scale(1); } }
    @keyframes shell-fly { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(-40px, -130px) rotate(-55deg); opacity: 0; } }
    @keyframes shell-tilt { to { transform: rotate(7deg) scale(1.03); } }
    @keyframes chick-pop { 0% { opacity: 0; transform: translateY(40px) scale(.1); } 50% { opacity: 1; transform: translateY(-48px) scale(1.4); } 100% { opacity: 1; transform: translateY(-24px) scale(1.15); } }
    @keyframes burst { 0% { opacity: .95; transform: scale(.1); } 100% { opacity: 0; transform: scale(5); } }
    @keyframes friend-in { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: scale(1) rotate(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes hop { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-14px) scale(1.2); } 60% { transform: translateY(0) scale(.95); } }
    @keyframes ghost { 0% { opacity: 0; transform: translate(0, 40px); } 20% { opacity: 1; transform: translate(0, 0); } 75% { opacity: 1; transform: translate(-60px, -190px) scale(.8); } 100% { opacity: 0; transform: translate(-70px, -210px) scale(.7); } }

    @media (min-width: 600px) { .book-grid { grid-template-columns: repeat(6, 1fr); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="topline">
      <div class="stats">
        <button class="chip" id="bookBtn" type="button" aria-label="Åbn junglebogen">📖 <span id="friendCount">0</span></button>
      </div>
    </div>

    <div class="sizes" role="group" aria-label="Antal bogstaver">
      <span>Bogstaver:</span>
      <button class="size" type="button" data-size="3">3<small></small></button>
      <button class="size" type="button" data-size="4">4<small></small></button>
      <button class="size" type="button" data-size="5">5<small></small></button>
    </div>

    <div class="play">
    <div class="col">
    <section class="scene-card" id="sceneCard">
      <svg id="scene" viewBox="0 0 640 320" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#8fd9ff"/>
            <stop offset=".6" stop-color="#d9f5ff"/>
            <stop offset="1" stop-color="#eaffd6"/>
          </linearGradient>
          <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#86d96f"/>
            <stop offset="1" stop-color="#4aa84f"/>
          </linearGradient>
          <radialGradient id="eggGrad" cx=".35" cy=".3" r=".85">
            <stop offset="0" style="stop-color: var(--egg-hi, #fff)"/>
            <stop offset=".55" style="stop-color: var(--egg, #f2b84b)"/>
            <stop offset="1" style="stop-color: var(--egg-lo, #b8761c)"/>
          </radialGradient>
          <clipPath id="eggClip"><path d="M0-62C34-62 52-18 52 14 52 48 30 64 0 64-30 64-52 48-52 14-52-18-34-62 0-62Z"/></clipPath>
          <clipPath id="eggTop"><path d="M-80-80H80V4L56 4 40 14 24 0 8 16-8-2-24 14-40-4-56 8-80 8Z"/></clipPath>
          <clipPath id="eggBot"><path d="M-80 6-56 6-40-6-24 12-8-4 8 14 24-2 40 12 56 2 80 2V100H-80Z"/></clipPath>
          <g id="eggArt">
            <path d="M0-62C34-62 52-18 52 14 52 48 30 64 0 64-30 64-52 48-52 14-52-18-34-62 0-62Z" fill="url(#eggGrad)" stroke="var(--egg-lo, #b8761c)" stroke-width="3"/>
            <g style="fill: var(--egg-lo, #b8761c)" opacity=".38">
              <circle cx="-22" cy="-24" r="8"/><circle cx="18" cy="-34" r="6"/><circle cx="30" cy="-4" r="9"/>

    let ac;
    function audio() {
      if (muted) return null;
      if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; } }
      if (ac && ac.state === "suspended") ac.resume();
      return ac;
    }

    function tone(freq, at, dur, type = "triangle", vol = .16) {
      const ctx = audio();
      if (!ctx) return;
      const t = ctx.currentTime + at;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + .02);
      gain.gain.exponentialRampToValueAtTime(.0001, t + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dur + .05);
    }

    const chime = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .28));

    const crackSound = () => { tone(180, 0, .05, "square", .1); tone(120, .05, .06, "square", .08); };
    const fanfare = () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i * .11, .35, "triangle", .18));

    function roarSound(big) {
      const ctx = audio();
      if (!ctx) return;
      const dur = big ? 1.5 : .8;
      const t = ctx.currentTime;
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(900, t);
      filter.frequency.exponentialRampToValueAtTime(260, t + dur);
      gain.gain.setValueAtTime(.0001, t);
      gain.gain.exponentialRampToValueAtTime(.3, t + .08);
      gain.gain.exponentialRampToValueAtTime(.0001, t + dur);
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.value = 26;
      lfoGain.gain.value = .09;
      lfo.connect(lfoGain).connect(gain.gain);
      for (const [type, mult] of [["sawtooth", 1], ["square", 1.51]]) {
        const osc = ctx.createOscillator();
        osc.type = type;
        osc.frequency.setValueAtTime(120 * mult, t);
        osc.frequency.exponentialRampToValueAtTime(52 * mult, t + dur);
        osc.connect(filter);
        osc.start(t);
        osc.stop(t + dur + .05);
      }
      filter.connect(gain).connect(ctx.destination);
      lfo.start(t);
      lfo.stop(t + dur + .05);
    }

      if (!clips.has(key)) {
        const el = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=da&q=${encodeURIComponent(key)}`);
        el.preload = "auto";
        clips.set(key, el);
      }
      return clips.get(key);
    }

    function sayOnline(text) {
      return new Promise(resolve => {
        const el = clip(text);
        el.onended = resolve;
        el.onerror = resolve;
        el.currentTime = 0;
        el.play().catch(resolve);
        setTimeout(resolve, 4000);
      });
    }

    function say(text, rate = .8) {
      return new Promise(resolve => {
        if (muted) return resolve();
        if (!daVoice) return sayOnline(text).then(resolve);
        const u = new SpeechSynthesisUtterance(text.toLowerCase());
        u.voice = daVoice;
        u.lang = daVoice.lang;
        u.rate = rate;
        u.pitch = 1.1;
        u.onend = resolve;
        u.onerror = resolve;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
        setTimeout(resolve, 3500);
      });
    }

    // ---------- Scene ----------
    const sceneCard = $("sceneCard");
    const scene = $("scene");
    const leo = $("leo");
    const NS = "http://www.w3.org/2000/svg";

    function buildMane() {
      const mane = $("mane");
      const base = document.createElementNS(NS, "circle");
      base.setAttribute("cx", 100);
      base.setAttribute("cy", 108);
      base.setAttribute("r", 62);
      base.setAttribute("fill", "#c9741f");
      mane.append(base);
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", 100 + Math.cos(a) * 50);
        c.setAttribute("cy", 108 + Math.sin(a) * 50);
        c.setAttribute("r", 24);
        c.setAttribute("fill", i % 2 ? "#b8651b" : "#d9822b");
        c.setAttribute("stroke", "#8f4d12");
        c.setAttribute("stroke-width", 2.5);
        mane.append(c);
      }
    }

    function updateLeo() {
      const f = Math.min(1, distinct() / KING);
      $("maneScale").style.transform = `scale(${0.7 + 0.45 * f})`;
      leo.classList.toggle("crowned", distinct() >= KING);
    }

    function react(className, ms) {
      leo.classList.remove("jump", "roar", "sad", "chew");
      void leo.getBoundingClientRect();
      leo.classList.add(className);
      setTimeout(() => leo.classList.remove(className), ms);
    }

    function leoRoar(big) {
      leo.classList.add("open");
      react("roar", 1000);
      roarSound(big);
      setTimeout(() => leo.classList.remove("open"), big ? 1500 : 800);
    }

    function bubble(text) {
      const el = $("bubble");
      el.textContent = text;
      el.classList.remove("pop");
      void el.offsetWidth;
      el.classList.add("pop");
    }

    function mix(hex, other, t) {
      const a = parseInt(hex.slice(1), 16);
      const b = parseInt(other.slice(1), 16);
      const ch = shift => Math.round(((a >> shift) & 255) * (1 - t) + ((b >> shift) & 255) * t);
      return `rgb(${ch(16)}, ${ch(8)}, ${ch(0)})`;
    }

    function setEggColor() {
      const f = friendOf(eggFriendId) || FRIENDS[0];
      scene.style.setProperty("--egg", f.c);
      scene.style.setProperty("--egg-hi", mix(f.c, "#ffffff", .65));
      scene.style.setProperty("--egg-lo", mix(f.c, "#000000", .35));
      $("chick").textContent = f.e;
    }

    function pickEggFriend() {
      const fresh = FRIENDS.filter(f => !friends[f.id]);
      eggFriendId = pick(fresh.length ? fresh : FRIENDS).id;
      save("leo-egg", eggFriendId);
    }

    function setEgg(p, animate) {
      const frac = p / GOAL;
      for (const id of ["crackDark", "crackLight"]) $(id).style.strokeDashoffset = 100 * (1 - frac);
      $("br1").classList.toggle("on", p >= 3);
      $("br2").classList.toggle("on", p >= 6);
      $("br3").classList.toggle("on", p >= 8);
      scene.style.setProperty("--glow", frac);
      const body = $("eggBody");
      body.classList.toggle("wobble", p >= 6);
      if (animate && p > 0) {
        crackSound();
        body.classList.remove("jiggle");
        void body.getBoundingClientRect();
        body.classList.add("jiggle");
      }
    }

    function renderFriends() {
      const g = $("friends");
      g.replaceChildren();
      order.slice(-4).forEach((id, i) => {
        const f = friendOf(id);
        if (!f) return;
        const t = document.createElementNS(NS, "text");
        t.setAttribute("x", 270 + i * 50);
        t.setAttribute("y", 292 + (i % 2) * 6);
        t.setAttribute("class", "pal");
        t.style.animationDelay = `${-i * .6}s`;
        t.textContent = f.e;
        g.append(t);
      });
    }

    function leoZoneContains(x, y) {
      const r = $("leoZone").getBoundingClientRect();
      return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    }

    function mouthCenter() {
      const r = $("mouthPt").getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function lookAt(x, y) {
      const m = mouthCenter();
      const clamp = v => Math.max(-1, Math.min(1, v));
      $("eyes").style.transform = x == null ? "" : `translate(${clamp((x - m.x) / 90) * 4}px, ${clamp((y - m.y + 40) / 90) * 3}px)`;
    }

    // ---------- Visning ----------
    function buildPath() {
      const path = $("path");
      path.replaceChildren();
      for (let i = 0; i < GOAL; i++) {
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.textContent = i === GOAL - 1 ? "🐣" : "🐾";
        path.append(dot);
      }
    }

    function updatePath() {
      [...$("path").children].forEach((dot, i) => dot.classList.toggle("done", i < progress));
      $("path").setAttribute("aria-label", `${progress} af ${GOAL} ord`);
    }

    function updateStats() {
      $("friendCount").textContent = `${distinct()}/${FRIENDS.length}`;
      for (const btn of document.querySelectorAll(".size")) {
        const n = Number(btn.dataset.size);
        btn.querySelector("small").textContent = eggs[n] ? `🥚 ${eggs[n]}` : "\u00a0";
        btn.setAttribute("aria-pressed", n === size);
      }
    }

    function confetti(count = 36) {
      if (reduceMotion) return;
      const symbols = ["⭐", "🌟", "🎉", "🍃", "🐾", "✨"];
      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = "confetti";
        el.textContent = pick(symbols);
        el.style.left = `${Math.random() * 100}vw`;
        document.body.append(el);
        const drift = (Math.random() - .5) * 160;
        const anim = el.animate([
          { transform: "translate(0, 0) rotate(0)", opacity: 1 },
          { transform: `translate(${drift}px, 105vh) rotate(${Math.random() * 720 - 360}deg)`, opacity: .9 }
        ], { duration: 1600 + Math.random() * 1400, delay: Math.random() * 400, easing: "ease-in" });
        anim.onfinish = () => el.remove();
      }
    }

    function setIdleNudge() {
      clearTimeout(idleTimer);
      $("readBtn").classList.remove("nudge");
      idleTimer = setTimeout(() => $("readBtn").classList.add("nudge"), 9000);
    }

    function showGhost() {
      clearTimeout(ghostTimer);
      $("ghost").classList.remove("on");
      if (delivered >= 4) return;
      ghostTimer = setTimeout(() => $("ghost").classList.add("on"), 1800);
    }

    // ---------- Ord ----------
    function nextTarget() {
      const pool = WORDS.filter(w => !recent.includes(w[0]));
      const list = pool.length ? pool : WORDS;
      const weights = list.map(w => 1 + Math.min(3, misses[w[0]] || 0) * 2);
      let r = Math.random() * weights.reduce((a, b) => a + b, 0);
      for (let i = 0; i < list.length; i++) {
        r -= weights[i];
        if (r <= 0) return list[i];
      }
      return list[list.length - 1];
    }

    function pickChoices(word) {
      const initial = w => w[0][0];
      const others = WORDS.filter(w => w !== word);
      const picks = [];
      if (distinct() >= 3) {
        const similar = others.filter(w => initial(w) === initial(word));
        if (similar.length) picks.push(pick(similar));
      }
      for (const w of shuffle(others.slice())) {
        if (picks.length >= 2) break;
        if (picks.includes(w)) continue;
        if (distinct() < 3 && initial(w) === initial(word)) continue;
        picks.push(w);
      }
      return shuffle([word, ...picks]);
    }

    function newWord() {
      runId++;
      target = nextTarget();
      recent.push(target[0]);
      recent = recent.slice(-Math.min(10, WORDS.length - 6));
      choices = pickChoices(target);
      wrong = 0;
      locked = false;
      gold = progress > 0 && Math.random() < .12;
      $("wordcard").classList.toggle("gold", gold);

      const letters = $("letters");
      letters.style.setProperty("--n", target[0].length);
      letters.classList.remove("all");
      letters.replaceChildren(...[...target[0]].map(ch => {
        const tile = document.createElement("div");
        tile.className = "letter";
        tile.textContent = ch;
        return tile;
      }));

      $("choices").replaceChildren(...choices.map((w, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pic";
        btn.dataset.index = i;
        btn.textContent = w[1];
        btn.setAttribute("aria-label", `Billede ${i + 1}`);
        return btn;
      }));

      if (!daVoice && !muted) clip(target[0]);
      bubble(gold ? "Et guldord! Dobbelt stjerne!" : pick(["Hvad står der?", "Find det rigtige billede!", "Hvilket billede passer?"]));
      setIdleNudge();
      showGhost();
    }

    async function readWord() {
      const id = runId;
      const word = target[0];
      const tiles = [...$("letters").children];
      $("readBtn").classList.remove("nudge");
      setIdleNudge();
      tiles.forEach(l => l.classList.remove("lit"));
      $("letters").classList.remove("all");
      for (const tile of tiles) {
        tile.classList.add("lit");
        await delay(420);
        tile.classList.remove("lit");
        if (id !== runId) return;
      }
      $("letters").classList.add("all");
      await say(word);
    }

    function hintCorrect() {
      $("choices").children[choices.indexOf(target)]?.classList.add("hint");
    }

    // ---------- Træk og aflever ----------
    function makeFlyer(btn, rect, small) {
      const f = btn.cloneNode(true);
      f.className = "pic flyer";
      f.removeAttribute("data-index");
      const s = small ? Math.min(rect.width, 104) : rect.width;
      const left = small ? small.x - s / 2 : rect.left;
      const top = small ? small.y - s / 2 : rect.top;
      Object.assign(f.style, { left: `${left}px`, top: `${top}px`, width: `${s}px`, height: `${s}px`, fontSize: `${s * .42}px` });
      document.body.append(f);
      btn.classList.add("lifted");
      return f;
    }

    const center = r => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });

    function fly(el, frames, ms, easing = "ease-in-out") {
      const anim = el.animate(frames, { duration: reduceMotion ? 1 : ms, easing, fill: "forwards" });
      return anim.finished.catch(() => {});
    }

    async function deliver(index, flyer) {
      locked = true;
      clearTimeout(idleTimer);
      clearTimeout(ghostTimer);
      $("ghost").classList.remove("on");
      $("readBtn").classList.remove("nudge");
      delivered++;
      save("leo-delivered", delivered);
      const btn = $("choices").children[index];
      const home = center(btn.getBoundingClientRect());
      const from = center(flyer.getBoundingClientRect());
      const mouth = mouthCenter();
      const toMouth = `translate(${mouth.x - from.x}px, ${mouth.y - from.y}px)`;
      leo.classList.add("open");
      await fly(flyer, [
        { transform: "translate(0, 0) scale(1) rotate(0)" },
        { transform: `${toMouth} scale(.22) rotate(28deg)`, opacity: .9 }
      ], 380, "cubic-bezier(.5, 0, .8, .6)");

      if (choices[index] === target) {
        flyer.remove();
        btn.classList.remove("lifted");
        btn.classList.add("eaten");
        leo.classList.remove("open");
        react("chew", 700);
        nam();
        await onCorrect();
      } else {
        react("sad", 700);
        oops();
        bubble(pick(["Bleh! Det er ikke det!", "Øv, det smager ikke rigtigt!", "Hov! Prøv et andet."]));
        setTimeout(() => leo.classList.remove("open"), 350);
        await fly(flyer, [
          { transform: `${toMouth} scale(.22) rotate(28deg)` },
          { transform: `translate(${(mouth.x + home.x) / 2 - from.x}px, ${Math.min(mouth.y, home.y) - from.y - 90}px) scale(1.05) rotate(-22deg)` },
          { transform: `translate(${home.x - from.x}px, ${home.y - from.y}px) scale(1) rotate(0)` }
        ], 650, "cubic-bezier(.3, .6, .4, 1)");
        flyer.remove();
        btn.classList.remove("lifted");
        btn.classList.add("wrong");
        await onWrong();
      }
    }

    async function returnFlyer(d) {
      const from = center(d.flyer.getBoundingClientRect());
      const home = center(d.btn.getBoundingClientRect());
      await fly(d.flyer, [
        { transform: "translate(0, 0)" },
        { transform: `translate(${home.x - from.x}px, ${home.y - from.y}px)` }
      ], 320, "cubic-bezier(.3, 1.4, .5, 1)");
      d.flyer.remove();
      d.btn.classList.remove("lifted");
    }

    function endDrag(e) {
      if (!drag || e.pointerId !== drag.pointerId) return;
      const d = drag;
      drag = null;
      sceneCard.classList.remove("dragging", "over");
      lookAt(null);
      if (!d.moved) {
        deliver(d.index, makeFlyer(d.btn, d.rect));
      } else if (e.type !== "pointercancel" && leoZoneContains(e.clientX, e.clientY)) {
        deliver(d.index, d.flyer);
      } else {
        leo.classList.remove("open");
        returnFlyer(d);
      }
    }

    $("choices").addEventListener("pointerdown", e => {
      const btn = e.target.closest(".pic");
      if (!btn || locked || drag || e.button > 0 || btn.classList.contains("wrong")) return;
      e.preventDefault();
      audio();
      $("ghost").classList.remove("on");
      clearTimeout(ghostTimer);
      const rect = btn.getBoundingClientRect();
      drag = { btn, index: Number(btn.dataset.index), rect, startX: e.clientX, startY: e.clientY, pointerId: e.pointerId, moved: false, flyer: null };
    });

    window.addEventListener("pointermove", e => {
      if (!drag || e.pointerId !== drag.pointerId) return;
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (!drag.moved && Math.hypot(dx, dy) > 8) {
        drag.moved = true;
        drag.flyer = makeFlyer(drag.btn, drag.rect, { x: e.clientX, y: e.clientY });
        drag.size = drag.flyer.getBoundingClientRect().width;
        sceneCard.classList.add("dragging");
      }
      if (!drag.moved) return;
      drag.flyer.style.left = `${e.clientX - drag.size / 2}px`;
      drag.flyer.style.top = `${e.clientY - drag.size / 2}px`;
      const over = leoZoneContains(e.clientX, e.clientY);
      sceneCard.classList.toggle("over", over);
      leo.classList.toggle("open", over);
      lookAt(e.clientX, e.clientY);
    });

    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);

    // Tastatur: Enter eller mellemrum på et billede
    $("choices").addEventListener("click", e => {
      const btn = e.target.closest(".pic");
      if (!btn || e.detail !== 0 || locked || btn.classList.contains("wrong")) return;
      audio();
      deliver(Number(btn.dataset.index), makeFlyer(btn, btn.getBoundingClientRect()));
    });

    // ---------- Spilforløb ----------
    async function onCorrect() {
      const id = runId;
      const word = target[0];
      const firstTry = wrong === 0;
      progress++;
      save("leo-progress", progress);
      updatePath();
      setEgg(progress, true);
      react("jump", 700);
      chime();
      $("letters").classList.add("all");

      let gain = 0;
      let message = firstTry ? pick(["Det er rigtigt!", "Flot læst!", "Du er dygtig!", "Yes!"]) : "Godt klaret!";
      if (gold) {
        gain = 2;
        message = "Guldord! ⭐⭐";
        confetti(20);
      } else if (firstTry) {
        gain = 1;
      }
      if (firstTry) {
        streak++;
        if (misses[word]) { misses[word]--; save("leo-misses", misses); }
        if (streak % 3 === 0) {
          gain++;
          message = `${streak} i træk! Brøl-bonus! 🦁`;
          setTimeout(() => leoRoar(false), 350);
          confetti(24);
        }
      } else {
        streak = 0;
      }
      if (gain) {
        stars += gain;
        save("leo-stars", stars);
        Topbar.refreshStars(true);
      }
      updateStats();
      bubble(message);

      if (progress >= GOAL) {
        await say(word);
        await delay(300);
        if (id === runId) await hatch();
        return;
      }
      await Promise.all([say(word), delay(1700)]);
      if (id === runId) newWord();
    }

    async function onWrong() {
      wrong++;
      streak = 0;
      misses[target[0]] = (misses[target[0]] || 0) + 1;
      save("leo-misses", misses);
      if (wrong >= 2) {
        bubble("Lyt, så læser jeg ordet!");
        await readWord();
        hintCorrect();
      } else {
        say("Prøv igen");
        setIdleNudge();
      }
      locked = false;
    }

    // ---------- Æg og venner ----------
    async function hatch() {
      locked = true;
      const friend = friendOf(eggFriendId) || FRIENDS[0];
      const before = distinct();
      const isNew = !friends[friend.id];
      friends[friend.id] = (friends[friend.id] || 0) + 1;
      if (isNew) order.push(friend.id);
      eggs[size] = (eggs[size] || 0) + 1;
      stars += 3;
      save("leo-friends", friends);
      save("leo-order", order);
      save("leo-eggs", eggs);
      save("leo-stars", stars);
      save("leo-progress", 0);
      const king = before < KING && distinct() >= KING;

      bubble("Ægget klækker!");
      const body = $("eggBody");
      body.classList.remove("wobble", "jiggle");
      void body.getBoundingClientRect();
      body.classList.add("shake-hard");
      crackSound();
      await delay(850);
      body.classList.remove("shake-hard");
      $("egg").classList.add("hatched");
      fanfare();
      confetti(60);
      leoRoar(false);
      await delay(1900);

      $("hatchEmoji").textContent = friend.e;
      $("hatchRibbon").textContent = friend.rare ? "✨ Sjælden ven!" : isNew ? "Ny ven!" : "Din ven kom igen!";
      $("hatchRibbon").classList.toggle("rare", Boolean(friend.rare));
      const name = $("hatchName");
      name.style.setProperty("--n", friend.name.length);
      name.replaceChildren(...[...friend.name].map((ch, i) => {
        const tile = document.createElement("div");
        tile.className = "letter";
        tile.style.animationDelay = `${.5 + i * .09}s`;
        tile.textContent = ch;
        return tile;
      }));
      $("hatchInfo").textContent = isNew ? `Ven nr. ${distinct()} af ${FRIENDS.length}` : `Nu har du ${friends[friend.id]} af dem!`;
      $("kingNote").hidden = !king;
      $("hatch").hidden = false;
      updateStats();
      Topbar.refreshStars(true);
      say(friend.name);
      if (king) setTimeout(() => leoRoar(true), 1200);
      $("hatch").dataset.friend = friend.id;
    }

    function afterHatch(openBook) {
      const id = $("hatch").dataset.friend;
      $("hatch").hidden = true;
      progress = 0;
      pickEggFriend();
      $("egg").classList.remove("hatched");
      setEggColor();
      setEgg(0, false);
      const body = $("eggBody");
      body.classList.remove("drop");
      void body.getBoundingClientRect();
      body.classList.add("drop");
      updatePath();
      renderFriends();
      updateLeo();
      updateStats();
      bubble("Nyt æg! Hvem mon er i det?");
      newWord();
      if (openBook) showBook(id);
    }

    function showBook(newId) {
      const grid = $("bookGrid");
      grid.replaceChildren(...FRIENDS.map(f => {
        const have = friends[f.id] > 0;
        const slot = document.createElement("div");
        slot.className = `slot${have ? "" : " locked"}${f.rare ? " rare" : ""}${f.id === newId ? " new" : ""}`;
        slot.innerHTML = `<span class="em">${f.e}</span><span>${have ? f.name : "???"}</span>`;
        if (have && friends[f.id] > 1) {
          const cnt = document.createElement("span");
          cnt.className = "cnt";
          cnt.textContent = `×${friends[f.id]}`;
          slot.append(cnt);
        }
        if (have) {
          slot.addEventListener("click", () => {
            slot.classList.remove("hop");
            void slot.offsetWidth;
            slot.classList.add("hop");
            audio();
            say(f.name);
          });
        }
        return slot;
      }));
      $("bookCount").textContent = `${distinct()}/${FRIENDS.length}`;
      $("book").hidden = false;
    }

    function setSize(n) {
      if (n === size && target) return;
      size = n;
      WORDS = WORD_SETS[size];
      save("leo-size", size);
      recent = [];
      streak = 0;
      updateStats();
      bubble(`Nu læser vi ord med ${size} bogstaver!`);
      newWord();
    }

    window.addEventListener("topbar:sound", e => {
      muted = !e.detail.on;
      if (muted && "speechSynthesis" in window) speechSynthesis.cancel();
    });

    document.querySelector(".sizes").addEventListener("click", e => {
      const btn = e.target.closest(".size");
      if (btn && !locked) setSize(Number(btn.dataset.size));
    });
    $("readBtn").addEventListener("click", () => { audio(); readWord(); });
    $("letters").addEventListener("click", () => { audio(); readWord(); });
    $("bookBtn").addEventListener("click", () => showBook());
    $("bookClose").addEventListener("click", () => { $("book").hidden = true; });
    $("book").addEventListener("click", e => { if (e.target === $("book")) $("book").hidden = true; });
    $("hatchNext").addEventListener("click", () => afterHatch(false));
    $("hatchBook").addEventListener("click", () => afterHatch(true));
    leo.addEventListener("click", () => { audio(); leoRoar(false); });

    buildMane();
    buildPath();
    if (!friendOf(eggFriendId)) pickEggFriend();
    setEggColor();
    setEgg(progress, false);
    updatePath();
    renderFriends();
    updateLeo();
    updateStats();
    Topbar.init({ kid: "ari", controls: [document.querySelector(".sizes")] });
    newWord();
  </script>
</body>
</html>
